name: Set up the toolchain
description: >-
  Installs the pinned pnpm and Node.js, proves the checkout is the revision under test, and installs the
  dependencies from the frozen lockfile. Every job that runs the repository's commands starts with it, after
  checking the repository out, so the pins live in one place.

runs:
  using: composite
  steps:
    # pnpm comes from package.json "packageManager"; do not pin a version here.
    - name: Set up pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    # Node.js comes from .node-version; do not pin a version here.
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: pnpm

    # The job must test the commit the run is about (GITHUB_SHA), not a branch tip or a merge ref that moved.
    - name: Confirm the checkout is the revision under test
      shell: bash
      run: node scripts/ci-revision.ts checkout

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
