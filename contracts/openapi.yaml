  /orders/{id}/delivery-location-change:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: requestDeliveryLocationChange
      x-permission: delivery.stop.execute
      x-error-codes: [CSRF_VALIDATION_FAILED, IDEMPOTENCY_KEY_CONFLICT, PERMISSION_DENIED, SESSION_INVALID, STATE_CONFLICT, VALIDATION_FAILED]
      tags: [delivery]
