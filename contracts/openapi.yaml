      security:
        - browserSession: []
        - riderSession: []
      x-permission: payment.read
      x-error-codes: [PERMISSION_DENIED, SESSION_INVALID]
      tags: [payments]
      summary: Hub cash reconciliations
      description: |
        `payment.read`. Finance holds this at all hubs - reconciliation is cross-hub by nature.

        **Paginated — post-session audit remediation, CRIT-10's sibling.** One record per business
        day accumulates without bound over the platform's lifetime for the `{id}` hub this
        operation is scoped to; was an unbounded raw array.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: Reconciliations in scope
          content:
            application/json:
              schema:
                type: object
                required: [items, next_page_token]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HubCashReconciliation' }
                  next_page_token: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /hub-cash-reconciliations/{id}/resolve:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: resolveHubCashVariance
      x-permission: payment.variance.resolve
      x-error-codes: [CSRF_VALIDATION_FAILED, PERMISSION_DENIED, REASON_REQUIRED, SESSION_INVALID, STATE_CONFLICT]
      tags: [payments]
      summary: Disposition a Hub cash variance
      description: |
        `payment.variance.resolve` - MSC-DEC-321, MSC-DEC-322. Reuses the existing variance key
        rather than adding a hub-specific one.

        **The expected total is unchanged by resolution.** The variance is resolved, not erased -
        a resolution that rewrote the expectation would reach the same terminal state with no
        evidence anything happened.

        **A rider may never resolve their own variance.** This key is Senior Ops and is not
        rider-holdable at all.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashVarianceResolution' }
      responses:
        '200':
          description: Variance dispositioned; expected_minor intact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubCashReconciliation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /hub-cash-reconciliations/{id}/dispositions:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: recordCashDisposition
      x-permission: payment.cash.disposition
      x-error-codes: [CSRF_VALIDATION_FAILED, EVIDENCE_REQUIRED, IDEMPOTENCY_KEY_CONFLICT, PERMISSION_DENIED, SESSION_INVALID, VALIDATION_FAILED]
      tags: [payments]
      summary: Record where the physical cash went
      description: |
        `payment.cash.disposition` - MSC-DEC-323. Bank deposit, Merchant MoMo transfer, Finance
        handover or approved safe custody, with amount, method, destination, reference and
        evidence where the method requires it.

        **Cash is not settled because a rider handed it to a hub.** This is the last custody
        transfer and the one nobody naturally records: rider-to-hub is observed by two people,
        hub-to-bank is often one person and a deposit slip.

        **This creates no accounting entry.** It is the operational source event the future
        Accounting domain consumes.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashDisposition' }
      responses:
        '201':
          description: Disposition RECORDED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashDisposition' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /vendor-organizations:
    post:
      operationId: createVendorOrganization
      x-permission: vendor.organization.create
      x-error-codes: [CSRF_VALIDATION_FAILED, PERMISSION_DENIED, SESSION_INVALID, VALIDATION_FAILED]
      tags: [vendors]
      summary: Create a vendor record and its shared portal account, awaiting approval
      description: |
        `vendor.organization.create` - Ops Staff, Senior Ops, Platform Admin at own hub
        (18.2, 29.2.1, 35.12.1).

        **A business cannot self-register.** There is no anonymous creation path and every
        record carries a staff `created_by`.

        **The record is created in `PENDING_SENIOR_OPS_REVIEW` and grants nothing.** One act
        also creates the `VendorAccount` and `VendorCredential` that 29.2.1's "and initial
        shared portal account" requires - the credential carrying a registered recovery
        channel and a **null secret**. No session can be issued against it, because a vendor
        sign-in proves three factors and one of them does not exist yet.

        **No administrator supplies the secret**, here or anywhere. It is set by
        the vendor from the setup grant that APPROVAL issues, not creation.

        **The caller is recorded as `created_by` and cannot decide this record.** 35.12.2's
        exclusion is enforced at `decideVendorOrganization` and is checkable afterwards from
        the two actor fields the record carries.

        **The allowance is not part of this act.** The organisation's `VendorAccountAllowance`
        is created `DISABLED_PREPAYMENT_ONLY` and only Platform Admin moves it (35.12.3).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorOrganizationCreate' }
      responses:
        '200':
          description: Created in PENDING_SENIOR_OPS_REVIEW, granting nothing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorOrganization' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /vendor-organizations/{id}/decision:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: decideVendorOrganization
      x-permission: vendor.organization.approve
      x-error-codes: [CREDENTIAL_DELIVERY_FAILED, CSRF_VALIDATION_FAILED, PERMISSION_DENIED, REASON_REQUIRED, SELF_APPROVAL_FORBIDDEN, SESSION_INVALID, STATE_CONFLICT]
      tags: [vendors]
      summary: Approve or reject operational activation
      description: |
        `vendor.organization.approve` - hub Senior Ops or Platform Admin, **own hub** (18.2,
        29.2.2). **One key carries both halves**, because 18.2 words the act as "approves or
        rejects" - the same shape `approveStaffIdentity` uses, and the reason no
        `vendor.organization.reject` key exists.

        **The decider may not be the creator** (29.2.3, 35.12.2). Returns
        `SELF_APPROVAL_FORBIDDEN`, the same code every other same-actor exclusion returns:
        one uniform rule keeps one code (37.4, MSC-DEC-135).

        **Approval issues exactly one `VENDOR_CREDENTIAL_SETUP` grant** to the account's
        registered recovery channel, resolved from the record and never from the request
        (state-machines.md 19.1). That grant is where vendor-authentication.md 5.1 begins.

        **Delivery** (Gate PD-3R2, applying `PDA-54` to the one issuing operation that lacked it): the grant
        is handed to the delivery channel inside this operation, before it commits, and its raw token is
        never persisted. If the channel refuses it the operation is rolled back - no grant exists and the
        decision is not recorded - and the answer is `CREDENTIAL_DELIVERY_FAILED`; nothing was sent and the
        approver may decide again. Rejection issues no grant and cannot return it.

        **Rejection is the same call with `approved: false` and a mandatory reason.** It is
        terminal and the record stays queryable (36.1). **Reapplication is a new
        `VendorOrganization`** (MSC-DEC-397; OQ-033 closed 21 September 2026) - no operation
        returns a `REJECTED` record to review, the rejection history stays on the rejected
        record, and linking a fresh application to it is duplicate detection's job.

        **Approval does NOT enable the account allowance** (35.12.3, 36.12). Operational
        `ACTIVE` does not imply allowance `ENABLED`, and the two acts carry different keys
        with different scopes so that the separation is structural.
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorOrganizationDecision' }
      responses:
        '200':
          description: Activated to ACTIVE, or REJECTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorOrganization' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /vendor-organizations/{id}/allowance/enable:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: enableVendorAllowance
      x-permission: vendor.allowance.enable
      x-error-codes: [CSRF_VALIDATION_FAILED, PERMISSION_DENIED, REASON_REQUIRED, SESSION_INVALID, STATE_CONFLICT]
      tags: [vendors]
      summary: Enable the account allowance for a vendor
      description: |
        `vendor.allowance.enable` - **Platform Admin only, all hubs** (29.2.4, 35.12.3). A
        separate decision from operational activation, by a different authority, which is why
        it is a separate operation on a separate key rather than a field on the decision above.

        **A reason is mandatory** and **no probation threshold is evaluated.** 29.2.4 states
        that enabling follows "basic verification and with a recorded reason; no mandatory
        probation threshold applies" - the absence is decided, not missing, and an
        implementation that gated on elapsed time or completed orders would add a rule nobody
        approved.

        **This sets a flag, not an amount.** The limit is one platform-wide figure,
        `global_vendor_account_limit_amount` (GH200, MSC-DEC-238), with no Version 1 override.

        **The consequence is the commercial machine's, not this operation's.** 8 branches
        `PRICED -> CREDIT_RESERVED` on allowance enabled, account not OVERDUE and sufficient
        global exposure. This operation moves one of those three conditions.

        **Basic verification is the recorded reason and nothing more** (MSC-DEC-397; OQ-033
        closed 21 September 2026): 29.2.4 names the verification and no contract carries an
        evidence set for it, by decision rather than by omission - the control is bounded by
        the GH200 near-prepay ceiling - so this operation records the reason and nothing more.
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorAllowanceDecision' }
      responses:
        '200':
          description: Allowance ENABLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorAccountAllowance' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /vendor-organizations/{id}/allowance/disable:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: disableVendorAllowance
      x-permission: vendor.allowance.disable
      x-error-codes: [CSRF_VALIDATION_FAILED, PERMISSION_DENIED, REASON_REQUIRED, SESSION_INVALID, STATE_CONFLICT]
      tags: [vendors]
      summary: Disable the account allowance for a vendor
      description: |
        `vendor.allowance.disable` - **Platform Admin only, all hubs** (29.2.5, 35.12.3), with
        a **mandatory reason**.

        **Disablement is not retroactive, and 29.2.5 says so in its own words**: after
        disablement the prepayment gate applies to vendor-paid and split vendor portions
        calculated at itemization, "while existing confirmed itemized orders and outstanding
        obligations remain valid." Nothing here reprices, reverses or voids settled work -
        only orders priced after this transition meet the gate.

        **A disabled allowance is not a suspension and not an OVERDUE status.** 35.12.8 names
        four distinct conditions and forbids collapsing them into one flag. This operation
        moves exactly one of the four.
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorAllowanceDecision' }
      responses:
        '200':
          description: Allowance DISABLED_PREPAYMENT_ONLY
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorAccountAllowance' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /vendor-organizations/{id}/suspension:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: suspendVendor
      x-permission: vendor.suspension.create
      x-error-codes: [CSRF_VALIDATION_FAILED, PERMISSION_DENIED, REASON_REQUIRED, SESSION_INVALID, STATE_CONFLICT, VALIDATION_FAILED]
      tags: [vendors]
      summary: Suspend a vendor, blocking the login and holding non-terminal work
      description: |
        `vendor.suspension.create` - hub Senior Ops at the vendor's responsible hub, or Platform
        Admin directly at any hub (29.6, MSC-DEC-168-169).

        **The reason must cite one of FOUR grounds categories** and the set is fixed: non-payment
        or overdue beyond policy, suspected fraud or abuse, safety or legal violation, repeated
        service-quality failure. 29.6 calls them "four starting grounds categories" - starting,
        and still four. No fifth is created and none is widened by interpretation.

        **Effects.** operational_status reaches SUSPENDED, VendorAccount.status reaches SUSPENDED,
        and every live Session terminates with reason SUSPENDED (domain-model.md 6.8, already
        specified and not restated). **One VendorSuspensionHold is created per non-terminal work
        item**, each recording where that item physically is - 29.6 requires that "the system must
        identify where each held item physically is", and a suspension that stopped the account
        without enumerating the parcels would lose custody of other people's goods.

        **It charges, reverses and reprices nothing.** Outstanding obligations stay valid and
        payable, which is the same non-retroactivity 29.2.5 applies to allowance disablement.

        **Terminal orders are not held.** A delivered parcel is history, and 29.6 preserves history
        rather than holding it.
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorSuspension' }
      responses:
        '200':
          description: Suspended; holds created for every non-terminal work item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorOrganization' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /vendor-organizations/{id}/suspension/lift:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: reactivateVendor
      x-permission: vendor.suspension.lift
      x-error-codes: [CSRF_VALIDATION_FAILED, INSUFFICIENT_AUTHORITY, PERMISSION_DENIED, REASON_REQUIRED, SESSION_INVALID, STATE_CONFLICT]
      tags: [vendors]
      summary: Lift a suspension and resume every held item
      description: |
        `vendor.suspension.lift` - **symmetric or higher** (29.6, MSC-DEC-397). A suspension created
        by hub Senior Ops may be lifted by that hub's Senior Ops **or** by Platform Admin; a
        suspension created by Platform Admin may be lifted **only** by Platform Admin, returning
        `INSUFFICIENT_AUTHORITY` to anyone else.

        **The asymmetry protects the case that matters.** The risk is a hub quietly undoing a
        Platform Admin fraud suspension. The routine case is "they paid, let them back", and routing
        that to Platform Admin would send a daily hub decision to the busiest authority in the
        product - the failure 11.4 warns about.

        **Lifting resumes EVERY remaining HELD hold in one act**, moving each to RESUMED. No
        per-item resume decision is required, because 29.6 already says the hold persists "until
        reactivation or a disposition decision" - reactivation IS the resolution, and demanding a
        second decision per parcel would contradict the approved sentence.

        **Effects.** operational_status returns to ACTIVE and VendorAccount.status to ACTIVE. **No
        session is issued** - the vendor signs in again normally. **The allowance is untouched**: it
        is a separate lifecycle with a separate authority (35.12.3), and a suspension never moved it.
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorReactivation' }
      responses:
        '200':
          description: Reactivated; every remaining hold RESUMED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorOrganization' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /vendor-organizations/{id}/termination:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: terminateVendor
      x-permission: vendor.organization.terminate
      x-error-codes: [CSRF_VALIDATION_FAILED, PERMISSION_DENIED, REASON_REQUIRED, SESSION_INVALID, STATE_CONFLICT]
      tags: [vendors]
      summary: Terminate a suspended vendor whose holds are all resolved
      description: |
        `vendor.organization.terminate` - **Platform Admin only, all hubs** (29.6, MSC-DEC-397),
        with a mandatory reason and enhanced audit.

        **Three preconditions, each closing a different hole.** The vendor must be **SUSPENDED** -
        which guarantees a reasoned suspension record and an enumerated parcel set behind every
        termination. **No VendorSuspensionHold may still be HELD** - you cannot end a relationship
        while holding someone's goods with no decision on them, which is the state 29.6 exists to
        prevent and would be perverse to reach through the act that closes the record. Both return
        `STATE_CONFLICT`. And Platform Admin only, because ending a platform-wide commercial
        relationship is not a single hub's call.

        **Termination ends the relationship and the access, NOT the debt.** Outstanding obligations
        survive and stay payable; VendorBalance, statements and demands persist. **Settlement is not
        a precondition** - requiring it would give a defaulter a veto over their own termination,
        and the defaulting vendor is the main reason to terminate one.

        **Retention of the terminated record is NOT decided here.** 29.6's offboarding retention is
        `OQ-028`'s, with the retention periods that need qualified legal input. Nothing is deleted
        by this operation.
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorTermination' }
      responses:
        '200':
          description: TERMINATED; obligations preserved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorOrganization' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /vendor-suspension-holds/{id}/disposition:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: decideHeldParcelDisposition
      x-permission: vendor.held_parcel.decide
      x-error-codes: [CSRF_VALIDATION_FAILED, PERMISSION_DENIED, REASON_REQUIRED, SESSION_INVALID, STATE_CONFLICT]
      tags: [vendors]
      summary: Decide what happens to one held item
      description: |
        `vendor.held_parcel.decide` - hub Senior Ops or Platform Admin, **at the hub where the item
        physically is** (29.6, MSC-DEC-142). Reason mandatory, audit mandatory (35.12.9).

        **RETURN_TO_VENDOR is absent from the enum, and that absence is the honest state of the
        contract rather than an omission.** 29.6 confirms it as a disposition and 29.6, MSC-DEC-171 fixes
        its fee, so it is approved policy - but `RETURNED_TO_VENDOR` is a terminal fulfilment
        outcome (16.1), and the **SIGNED** fulfilment machine at state-machines.md 9 has exactly
        one entry into RETURN_TO_VENDOR_IN_PROGRESS: from AT_HUB_AFTER_FAILURE. A suspended
        vendor's parcels sit in every non-terminal state, so for most held parcels there is no
        signed transition. Making the value unrepresentable keeps the gap a contract fact a check
        can see, instead of a runtime failure. See vendor-suspension.md 14.

        **CONTINUE_HOLD has no expiry**, because 29.6 states that "no fixed maximum hold duration
        applies" - an indefinite hold is a legitimate steady state, not a gap.
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HeldParcelDisposition' }
      responses:
        '200':
          description: Disposition recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorSuspensionHold' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /vendor-suspension-holds/{id}/escalate:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: escalateHeldParcel
      x-permission: vendor.held_parcel.escalate
      x-error-codes: [CSRF_VALIDATION_FAILED, PERMISSION_DENIED, REASON_REQUIRED, SESSION_INVALID, STATE_CONFLICT]
      tags: [vendors]
      summary: Escalate a held item to a manual claims or security hold
      description: |
        `vendor.held_parcel.escalate` - **Platform Admin only, all hubs** (29.6, MSC-DEC-142), for
        cases neither continued hold nor return resolves. 29.6's examples are suspected fraud and
        an abandoned or undeliverable parcel.

        The hold reaches **AUTHORIZED_EXCEPTION_DISPOSITION**, which is 36.12's named exit for a
        held work item that leaves the ordinary path.

        **This escalates a PARCEL, and does not create a vendor-level SecurityRiskHold.** The two
        are different records at different grains, and `SecurityRiskHold` is written by
        `openSecurityRiskHold` and `clearSecurityRiskHold` (MSC-DEC-414, closing `OQ-128`).
        *Superseded:* it had no write authority anywhere in the repository.
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HeldParcelEscalation' }
      responses:
        '200':
          description: Escalated to AUTHORIZED_EXCEPTION_DISPOSITION
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorSuspensionHold' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  # SECURITYRISKHOLD HAD A STATE SET AND NO ACTOR (MSC-DEC-414, closing OQ-128). 35.12.8 names it the
  # fourth of four vendor conditions that must not collapse into one flag. Platform Admin opens and
  # clears; an open hold stops NEW business and keeps work in flight. The vendor never sees it.
  /vendor-organizations/{id}/security-holds:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      operationId: listSecurityRiskHolds
      # SAFE READ. No CSRF: a synchronizer token defends state change, and a read
      # changes none. Requiring it here would train clients to send it everywhere.
      security:
        - browserSession: []
      x-permission: vendor.read
      x-error-codes: [NOT_FOUND, PERMISSION_DENIED, SESSION_INVALID]
      tags: [vendors]
      summary: The security/risk holds recorded against one vendor
      description: |
        `vendor.read` **at all-Hub scope only** - data-scope-registry.md 4.3 restricts this record
        to all-Hub vendor.read and **denies the vendor its own row**. Ordinary Hub staff act on the
        OUTCOME through getVendorOperationalEligibility, which never discloses that a hold exists.

        **This is how Platform Admin finds a hold to clear.** A record with a write and no read is
        the class MSC-DEC-406 and OQ-129 R1 removed twice; it is not repeated here.

        **Paginated**. *Superseded shape:* a raw array, as MSC-DEC-414 first wrote it.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: Every hold on this vendor, open and cleared
          content:
            application/json:
              schema:
                type: object
                required: [items, next_page_token]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SecurityRiskHold' }
                  next_page_token: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: openSecurityRiskHold
      x-permission: vendor.security_hold.manage
      x-error-codes: [CSRF_VALIDATION_FAILED, IDEMPOTENCY_KEY_CONFLICT, NOT_FOUND, PERMISSION_DENIED, REASON_REQUIRED, SESSION_INVALID, VALIDATION_FAILED]
      tags: [vendors]
      summary: Platform Admin opens a vendor-level security/risk hold
      description: |
        `vendor.security_hold.manage` - **Platform Admin only**, all hubs.
        Performs state-machines.md 21's SIGNED `-> OPEN`. **A reason is mandatory** and the act is
        Enhanced-audited as vendor.security_hold.opened.

        **An open hold stops NEW business and keeps work in flight.** While any hold on the vendor
        is OPEN, VendorOperationalEligibility's mayCreatePickup and mayConfirmVendorPaidOrder read
        false. **Parcels already moving continue to delivery and the vendor login is NOT blocked** -
        that is suspension's effect (35.12.7), and 35.12.8 requires the two to stay distinct.
        restrictionCategory never names the hold.

        **Holds may coexist**: a second concern is a second record with its own reason.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '201':
          description: Hold is OPEN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityRiskHold' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /security-holds/{id}/clear:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: clearSecurityRiskHold
      x-permission: vendor.security_hold.manage
      x-error-codes: [CSRF_VALIDATION_FAILED, IDEMPOTENCY_KEY_CONFLICT, NOT_FOUND, PERMISSION_DENIED, REASON_REQUIRED, SESSION_INVALID, STATE_CONFLICT]
      tags: [vendors]
      summary: Platform Admin clears a security/risk hold
      description: |
        `vendor.security_hold.manage` - Platform Admin only. Performs state-machines.md 21's SIGNED
        `OPEN -> CLEARED`, with a mandatory reason, Enhanced-audited as
        vendor.security_hold.cleared. STATE_CONFLICT refuses a hold already CLEARED.

        **The effect lifts only once no other hold on the vendor is OPEN**, and the record is kept.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: Hold is CLEARED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityRiskHold' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /vendor-organizations/{id}/pickup-locations:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: createVendorPickupLocation
      x-permission: vendor.pickup_location.manage
      x-error-codes: [CSRF_VALIDATION_FAILED, PERMISSION_DENIED, SESSION_INVALID, VALIDATION_FAILED]
      tags: [vendors]
      summary: Save a pickup location for a vendor
      description: |
        `vendor.pickup_location.manage` - the Vendor on its own record, or Ops at the vendor's
        own hub. Both halves are approved: 29.1 makes this an internal Ops capability and 29.4
        gives the vendor it.

        **The first location a vendor saves becomes the default.** A list whose default is
        unreachable by any available act is a state nobody can leave, so the rule is applied at
        creation rather than left to a second call.

        **No serviceability check runs here.** 29.4 and 11.3 both place it at booking, and 11.3
        says "revalidated per request" - a check at save would let a location stored while a
        zone was served look permanently valid. pickup-request.md owns it.

        **Saving a location changes nothing already booked.** The authoritative origin of a
        request is its own snapshotted resolved_pickup_location (3.7).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorPickupLocationCreate' }
      responses:
        '200':
          description: Saved and active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorPickupLocation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /vendor-pickup-locations/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    patch:
      operationId: updateVendorPickupLocation
      x-permission: vendor.pickup_location.manage
      x-error-codes: [CSRF_VALIDATION_FAILED, PERMISSION_DENIED, SESSION_INVALID, STATE_CONFLICT, VALIDATION_FAILED]
      tags: [vendors]
      summary: Edit a saved pickup location
      description: |
        `vendor.pickup_location.manage` - own vendor for a Vendor, own hub for Ops.

        **Editing does not rewrite a booked request.** A PickupRequest's
        resolved_pickup_location was snapshotted at booking (3.7), and 11.3 states the rule from
        the other side: per-request contact and location edits do not rewrite saved vendor
        locations, and the reverse holds too.

        **The default is not set here** - setDefaultVendorPickupLocation is a separate act,
        because moving a default is a different decision from correcting an address.
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorPickupLocationUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorPickupLocation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /vendor-pickup-locations/{id}/default:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: setDefaultVendorPickupLocation
      x-permission: vendor.pickup_location.manage
      x-error-codes: [CSRF_VALIDATION_FAILED, PERMISSION_DENIED, SESSION_INVALID, STATE_CONFLICT]
      tags: [vendors]
      summary: Make this the vendor's one default pickup location
      description: |
        `vendor.pickup_location.manage` - own vendor for a Vendor, own hub for Ops.

        **One act, both sides.** Setting a new default clears the previous one in the same
        operation, because 29.4 allows exactly one and two writes would leave a window with
        none or two.

        **A deactivated location cannot become the default** - STATE_CONFLICT.

        **This changes where a later booking sends a rider**, which is why it emits its own
        audit event naming both locations rather than reusing the update event.
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200':
          description: This location is now the single default
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorPickupLocation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /vendor-pickup-locations/{id}/deactivate:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: deactivateVendorPickupLocation
      x-permission: vendor.pickup_location.manage
      x-error-codes: [CSRF_VALIDATION_FAILED, PERMISSION_DENIED, SESSION_INVALID, STATE_CONFLICT]
      tags: [vendors]
      summary: Retire a saved pickup location, retaining it
      description: |
        `vendor.pickup_location.manage` - own vendor for a Vendor, own hub for Ops.

        **Deactivation, not deletion** (domain-model.md 8). 34.7 requires a past request's
        origin to stay interpretable, so the record is retained and simply stops being
        selectable. There is no delete operation and none is planned.

        **Retiring the default is refused while another active location exists** -
        STATE_CONFLICT, because 29.4 requires one. Set the new default first.

        **Retiring the LAST active location is permitted.** A vendor may legitimately save
        none: COLLECT_FOR_VENDOR and per-request origins do not depend on the list.
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200':
          description: Retired and retained
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorPickupLocation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /vendors/{id}/operational-eligibility:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      operationId: getVendorOperationalEligibility
      # SAFE READ. No CSRF: a synchronizer token defends state change, and a read
      # changes none. Requiring it here would train clients to send it everywhere.
      security:
        - browserSession: []
        - riderSession: []
      x-permission: vendor.read
      x-error-codes: [PERMISSION_DENIED, SESSION_INVALID]
      tags: [vendors]
      summary: The safe operational yes/no for a vendor
      description: |
        `vendor.read` - MSC-DEC-339. A DERIVED projection. It has no row and is not a source of
        truth.

        **It exists so Hub Ops can act without reading the restricted global control records.**
        Gate B's C1 restricted VendorAccountAllowance, VendorSuspensionHold and SecurityRiskHold
        to all-Hub vendor.read; this answers "may this vendor book today" without disclosing that
        a security hold exists, who raised it or why.

        **A projection is safe precisely because it is lossy.** The four 35.12.8 conditions -
        operational suspension, OVERDUE status, allowance state, security/risk hold - are read
        SEPARATELY and never collapsed into one flag.

        **Closes OQ-105.**
      responses:
        '200':
          description: Derived eligibility, computed at read time
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorOperationalEligibility' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /hubs/{id}/daily-operations-cash-report:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      operationId: getDailyOperationsCashReport
      # SAFE READ. No CSRF: a synchronizer token defends state change, and a read
      # changes none. Requiring it here would train clients to send it everywhere.
      security:
        - browserSession: []
      x-permission: report.read
      x-error-codes: [PERMISSION_DENIED, SESSION_INVALID]
      tags: [reports]
      summary: One hub-day's operations and money-flow report
      description: |
        `report.read` - THE EXISTING KEY (permissions.md 7), no new permission. **S** at `own hub`
        reads their own hub's day; **P**, **Finance** and **Executive** at `all hubs` read any
        hub's day, one hub at a time - the same scope split every other cross-hub read key
        already uses (payment.read, vendor.read). Ops Staff holds no grant for this key, by
        decision - MSC-DEC-393 closed OQ-124 on 17 September 2026 on the same
        segregation-of-duties reasoning that withholds payment.cash.confirm from a rider.

        **Ops Portal only.** No `riderSession` - Melarc Rider has no assigned-stop or
        assigned-run reading of a whole hub's day, and no rider bundle holds report.read.
        Vendor holds no report.read grant either.

        **A DERIVED projection, computed at read time** (domain-model.md 6.13,
        MSC-DEC-294's pattern). No row is stored, no accounting entry is created,
        and calling this twice recomputes rather than replays - there is nothing to replay,
        which is why this operation carries no Idempotency-Key.

        **Never presents an open exception as a closed day** (MSC-DEC-325, 16.3).
        `unreconciledExceptionsOpen` is true whenever any RiderCashCustody is EXCEPTION_OPEN
        or the day's HubCashReconciliation is VARIANCE_OPEN.

        **revenueByType is bounded to the five PaymentDemandLine.obligation_type values this
        contract models** - DELIVERY_FEE, REDELIVERY_DELIVERY_FEE, REDELIVERY_FEE,
        SINGLE_PACKAGE_PICKUP_FEE, RETURN_FEE - with DELIVERY_FEE further split by
        commercialMode, so Station Drop revenue is a breakout of an existing category rather
        than a category of its own (5.31, Accounting Pass 2). RETURN_FEE covers only the
        ad-hoc-sender settlement path (5.32, SLICE-006 Pass 1); a registered vendor's return
        fee raises no demand line and is not invented for this endpoint. OQ-123 is closed. The
        schema beneath states the same; the canonical ACCOUNTING export is a different
        artifact under the accounting-exports tag.
      parameters:
        - name: business_date
          in: query
          required: true
          schema: { type: string, format: date }
          description: The operating day to report on. Reflects source-record state as of read time.
      responses:
        '200':
          description: Operations and money-flow projection for this hub-day
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyOperationsCashReport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # THE ARRIVAL A SIGNED GUARD COULD NOT EVIDENCE. OQ-129 is NARROWED, NOT CLOSED -
  # the closure claim was withdrawn at OQ-129 R1, which found four contract defects inside it.
  # state-machines.md 9's ATTEMPT_FAILED to AT_HUB_AFTER_FAILURE row is SIGNED, names the RIDER
  # and guards on "custody returned to the responsible hub" with CUSTODY_NOT_RETURNED - and no
  # record evidenced the arrival. RunCustodyHandover 4.1 is PickupManifest-scoped and answers a
  # different question. These three operations mirror the cash handover exactly: the rider
  # declares, THE HUB receives, a mismatch opens a variance, Senior Ops closes it.
  /parcel-custody-returns:
    get:
      operationId: listParcelCustodyReturns
      security:
        - browserSession: []
        - riderSession: []
      x-permission: fleet.custody.read
      x-error-codes: [PERMISSION_DENIED, SESSION_INVALID]
      tags: [delivery-runs]
      summary: Parcel custody returns in scope, filterable by state
      description: |
        `fleet.custody.read` - the hub's returns for Ops, the rider's own for a rider. Paginated,
        the envelope every list in this contract uses.

        **The state filter is the operational visibility a declared-but-unconfirmed return needs.**
        A return sitting in DECLARED is one a rider has **named and no officer has checked**, so
        **no custody has moved and what the hub physically holds is still unknown** - the parcels
        may be on the counter, in the pannier, or nowhere (corrected at OQ-129 R1.1, which found
        this described as already handed over). 36.9 allows no rider overnight hold, so an ageing
        DECLARED return is precisely what a hub must be able to see.

        **It does not see a run whose rider declared nothing at all.** No record exists to list, and
        detecting that absence needs a backstop this corpus does not have - carried on OQ-129 rather
        than invented here.
      parameters:
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/PageToken' }
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [DECLARED, RECEIVED, VARIANCE_OPEN, CLOSED]
          description: Narrow to one state. **DECLARED is the unconfirmed set.**
        - name: delivery_run_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Returns in scope, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items, next_page_token]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ParcelCustodyReturn' }
                  next_page_token: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: openParcelCustodyReturn
      x-permission: fleet.custody.return
      x-error-codes: [CSRF_VALIDATION_FAILED, IDEMPOTENCY_KEY_CONFLICT, NOT_ASSIGNED_RIDER, NOT_CUSTODY_HOLDER, ORDER_NOT_ON_RUN, PERMISSION_DENIED, SESSION_INVALID, STATE_CONFLICT, VALIDATION_FAILED]
      tags: [delivery-runs]
      summary: Rider declares the undelivered parcels coming back to the hub
      description: |
        `fleet.custody.return` - **the rider who holds the parcels**, on their own completed run.

        **Custody, not assignment, is the test**, and both refusals are declared because they
        describe different people: `NOT_ASSIGNED_RIDER` for a rider with no relation to the run, and
        `NOT_CUSTODY_HOLDER` for one who had the parcels and no longer does. errors-and-enums.md
        keeps them apart for exactly this reason. **Today the two coincide on a delivery run**,
        because no delivery-run custody transfer exists - `RunCustodyHandover` is
        `PickupManifest`-scoped - so the holder is always the assigned rider. **The scope is written
        on custody anyway**, so that creating a delivery-run transfer later does not require
        rewriting this rule. It is the same correction MSC-DEC-404 made to submitHubHandover.

        **Declaring is not transferring.** The return opens in DECLARED and **no custody moves and no
        order changes state**; that happens when the hub confirms, under a different key. A rider
        who could confirm their own return could close a run over parcels nobody counted - the
        separation AC-SLICE-003-16 already makes for cash.

        **One open return per run** - STATE_CONFLICT on a second.

        **Every undelivered order still aboard is named**, whatever state it is in. Only orders in
        ATTEMPT_FAILED move on confirmation, because 9 declares no transition for the others; a
        skipped or suspension-held parcel is carried on the record with its order state unchanged.
        

        **Each order must be on this run and at this hub** - `ORDER_NOT_ON_RUN` otherwise. The
        eligible set is the orders carrying a DeliveryStop on delivery_run_id whose stop is not
        DELIVERED, and the run's responsible_hub_id is the return's. A rider cannot hand back a
        parcel from another run, or to a hub that does not answer for it (34.9).
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParcelCustodyReturnCreate' }
      responses:
        '201':
          description: Return opened in DECLARED. No custody has moved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParcelCustodyReturn' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  # THE RECORD THREE DIFFERENT PEOPLE MUST FIND (OQ-129 R1). The rider opens the return; HUB OPS
  # confirms it; SENIOR OPS resolves a variance. Without a read the id travels outside the system -
  # the exact class MSC-DEC-406 removed for RunCustodyHandover, repeated one record later.
  /parcel-custody-returns/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      operationId: getParcelCustodyReturn
      security:
        - browserSession: []
        - riderSession: []
      x-permission: fleet.custody.read
      x-error-codes: [NOT_FOUND, PERMISSION_DENIED, SESSION_INVALID]
      tags: [delivery-runs]
      summary: One parcel custody return, with its lines
      description: |
        `fleet.custody.read` - **Hub Ops, Senior Ops and Platform Admin at their own hub**, and **the
        rider on their own return**. Scoped server-side (37.6), never by a filter the caller
        supplies (42.4).

        **This is how the confirming and resolving actors reach the record at all.** The rider opens
        it; a different actor confirms it and possibly a third resolves it.
      responses:
        '200':
          description: The return and its lines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParcelCustodyReturn' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /parcel-custody-returns/{id}/confirm:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: confirmParcelCustodyReturn
      x-permission: fleet.custody.receive
      x-error-codes: [CSRF_VALIDATION_FAILED, IDEMPOTENCY_KEY_CONFLICT, NOT_FOUND, ORDER_NOT_ON_RUN, PERMISSION_DENIED, REASON_REQUIRED, SESSION_INVALID, STATE_CONFLICT, VALIDATION_FAILED]
      tags: [delivery-runs]
      summary: Hub Ops confirms receipt, and custody transfers
      description: |
        `fleet.custody.receive` - Hub Ops at own hub, and **never a rider**: no rider bundle holds
        this key.

        **confirmed_at records when Hub Ops made the physical comparison, and it is not by itself a
        custody instant** (OQ-129 R1.1). Every line the hub actually received moves to RECEIVED and
        transfers custody at confirmed_at; each such order in ATTEMPT_FAILED moves to
        AT_HUB_AFTER_FAILURE (state-machines.md 9), which is the transition whose guard - "custody
        returned to the responsible hub" - had no artifact behind it before MSC-DEC-408.
        **An OUT_FOR_DELIVERY order moves to the same state** where its stop is terminal and not
        DELIVERED - in practice SKIPPED - and **no live VendorSuspensionHold covers it**
        (MSC-DEC-411, closing OQ-143). **No attempt is consumed** and the skip is not
        retrospectively a physical attempt. **Where a hold does cover it, this operation moves
        physical custody only**: the hold's state and custody_location carry the fact, and an order
        already at RETURN_TO_VENDOR_IN_PROGRESS stays there - hub receipt changed where the parcel
        is, not what is to be done with it. **A MISSING
        line transfers no custody at all**, and one later dispositioned RECEIVED_LATE transfers at
        resolved_at. A confirmation that receives nothing still sets confirmed_at and moves nothing,
        which is why the record cannot carry one custody instant for all of its lines.

        **A mismatch opens a variance rather than refusing.** A named parcel the hub cannot find is
        MISSING; one it holds that was not named is UNDECLARED; the return moves to VARIANCE_OPEN
        with a mandatory reason. **Custody still transfers for the lines actually received**, because
        a variance that moved all or nothing would either lose parcels the hub is holding or credit
        the rider with parcels nobody found.

        **An undeclared id is held to the same eligibility rule as a declared one** (OQ-129 R1.1).
        Every received_order_ids entry the rider did not name must still carry a non-DELIVERED stop
        on this delivery_run_id, on a run whose responsible hub is the return's - ORDER_NOT_ON_RUN
        otherwise (domain-model.md 6.10). Confirmation is the second door into the line set, and
        the declaration path validates only what the rider named, so without this an order from
        another run or another hub enters the record unchecked.

        **The order transition's actor is settled: it is the HUB's.** state-machines.md 12.2 is
        SIGNED (Product Owner, 25 September 2026, MSC-DEC-410), and the same act amended and
        re-signed 9's ATTEMPT_FAILED to AT_HUB_AFTER_FAILURE row, which had named the RIDER and
        guarded on "custody returned to the responsible hub". **It now names Hub Ops confirming
        this return** - or Hub Senior Ops on a RECEIVED_LATE disposition - and guards on the
        order's line reaching RECEIVED. **A rider's declaration moves no order state**, exactly as
        CashHandover 16.4 gives the confirmation to the hub.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParcelCustodyReturnConfirm' }
      responses:
        '200':
          description: Receipt confirmed. state is RECEIVED, or VARIANCE_OPEN where lines differ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParcelCustodyReturn' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /parcel-custody-returns/{id}/resolve:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: resolveParcelCustodyVariance
      x-permission: fleet.custody.variance_resolve
      x-error-codes: [CSRF_VALIDATION_FAILED, IDEMPOTENCY_KEY_CONFLICT, INSUFFICIENT_AUTHORITY, NOT_FOUND, PERMISSION_DENIED, REASON_REQUIRED, SESSION_INVALID, STATE_CONFLICT]
      tags: [delivery-runs]
      summary: Senior Ops dispositions a missing or undeclared parcel
      description: |
        `fleet.custody.variance_resolve` - Hub Senior Ops at own hub. INSUFFICIENT_AUTHORITY where
        the actor holds the key's domain but not the senior standing 12.2 requires.

        **The variance is dispositioned, not erased** - MSC-DEC-321's rule for cash, applied to
        parcels. CLOSED records what was decided about each line and rewrites none of them.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParcelCustodyVarianceResolution' }
      responses:
        '200':
          description: Every line resolved; the return is CLOSED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParcelCustodyReturn' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /reason-definitions:
    get:
      operationId: listReasonDefinitions
      # SAFE READ. No CSRF: a synchronizer token defends state change, and a read
      # changes none. Requiring it here would train clients to send it everywhere.
      security:
        - browserSession: []
        - riderSession: []
      x-permission: settings.reason.read
      x-error-codes: [PERMISSION_DENIED, SESSION_INVALID]
      tags: [reason-definitions]
      summary: The operational reason catalogue
      description: |
        `settings.reason.read` - MSC-DEC-330, MSC-DEC-361. Every reason a workflow may offer, with
        its attribution and the metadata that drives validation. Rider-holdable on an assigned stop
        or run: it reads active codes and their consequences, never a hub value and never an edit.

        **Selecting a reason is not the authority to edit one.** A rider reads this catalogue and
        may never change what a code does.

        **Filterable by domain and checkpoint** (MSC-DEC-407, closing OQ-138's engineering half).
        Until 24 September 2026 this operation took NO parameters, so a screen that had to offer
        the reasons valid at one checkpoint fetched the whole catalogue and filtered on a field
        that did not exist - rider-android.md families F and L both do exactly that. Both filters
        are ordinary narrowing of a read the caller is already entitled to: they change no scope,
        and 42.4's rule that filters are authorization-checked and never trusted applies unchanged.
      parameters:
        - name: domain
          in: query
          required: false
          schema: { type: string }
          description: Narrow to one reason domain, e.g. DELIVERY_FAILURE or RECIPIENT_CONTACT.
        - name: checkpoint
          in: query
          required: false
          schema:
            type: string
            enum: [PRE_DISPATCH, NEXT_STOP, DOORSTEP]
          description: >-
            Narrow to the reasons valid at one recipient-contact checkpoint - the codes whose
            validCheckpoints contains this value. **This is the filter that makes
            REASON_NOT_VALID_FOR_CHECKPOINT avoidable at the screen** rather than discoverable
            only by submitting and being refused.
      responses:
        '200':
          description: Reason definitions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReasonDefinition' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reason-definitions/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema: { type: string }
        description: The stable reason code. Never reused after deactivation.
    put:
      operationId: upsertReasonDefinition
      x-permission: settings.reason.manage
      x-error-codes: [CSRF_VALIDATION_FAILED, PERMISSION_DENIED, SESSION_INVALID, SETTING_INVALID, VALIDATION_FAILED]
      tags: [reason-definitions]
      summary: Create or amend a reason definition
      description: |
        `settings.reason.manage` - MSC-DEC-330. Creates, edits, activates or deactivates a reason
        and its behaviour metadata.

        **Deactivation never deletes** - history stays interpretable (35.9.1).

        **Emits settings.reason.catalog_changed, enhanced.** Flipping consumes_delivery_attempt on
        a reason silently changes what every future delivery failure costs a customer, and it is
        the one edit that can rewrite policy without touching a document.

        **21.5's four PICKUP-failure categories remain a closed enum** - 21.5 fixes them by
        specification and no decision has widened them.

        **The DELIVERY set is different**. Its five reasons are SEEDED DEFAULTS in this
        catalogue, and an approved operational reason may be added through this operation.
        MSC-DEC-330 recorded them as closed; that reading was narrower than the rule approved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonDefinition' }
      responses:
        '200':
          description: Reason definition stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReasonDefinition' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  # THE CONTRACT'S FIRST EXPORT OPERATIONS. Before 5.43 a grep for an
  # accounting export returned nothing at all, while domain-model.md 6.12, permissions.md,
  # audit.md, settings.md and state-machines.md 20.7 all named one.
  #
  # TWO KEYS, NOT ONE, AND THE SPLIT IS ON THE VERB. payment.ledger.export gates the two acts
  # that put payment facts into the world - requestAccountingExport and
  # createAccountingExportRetrievalAuthorization - because issuing a capability over a period's
  # payment facts is not a lesser act than requesting one and earns no weaker key.
  # payment.ledger.read gates the two metadata reads (permissions.md v1.39). Both are Finance,
  # all hubs: 32 requires company-wide export access to be explicit rather than implied, and
  # the metadata answers the same company-wide question - who exported what, over which period.
  #
  # v1.38 gave one key all four, and THE ARGUMENT FOR IT DID NOT REACH THE READS: it is about
  # issuing a capability, and a metadata read issues none. This catalogue had already decided
  # the same question twice - payment.collection.read and payment.run_position.read both exist
  # because a narrow read was gated by a broad key, and both records say the screens were
  # UNBUILDABLE until it was split.
  /accounting-exports:
    post:
      operationId: requestAccountingExport
      x-permission: payment.ledger.export
      x-error-codes: [CSRF_VALIDATION_FAILED, EXPORT_RETENTION_NOT_CONFIGURED, EXPORT_SOURCE_NOT_EVENT_COMPLETE, PERIOD_NOT_RECONCILED, PERMISSION_DENIED, SESSION_INVALID, VALIDATION_FAILED]
      tags: [accounting-exports]
      summary: Request a canonical accounting export for a closed period
      description: |
        `payment.ledger.export` — Finance, all hubs. **Creates an
        `AccountingExport` in `REQUESTED` and nothing else.** No accounting entry is made and no
        money moves: Melarc runs no ledger, which is exactly why the extract it hands to a
        system that does has to be canonical.

        **GENERATION HAS TWO INDEPENDENT READINESS GATES, AND EACH REFUSES WITH ITS OWN NAMED
        CODE.** A caller must be able to tell *why* generation is unavailable, so one shared
        code would be worse than useless — the two resolve at different times and against
        different work.

        1. **`EXPORT_RETENTION_NOT_CONFIGURED`** while `accounting_export_file_retention_days`
           holds no value. `file_available_until` cannot be computed without it, and
           generating a package with an undefined lifetime puts a file into the world with no
           stated expiry. **The format, the schemas, the entity and these four operations are
           fully specified regardless** — it is production generation that waits on the figure,
           the same shape `MSC-DEC-328` used when `recipient_cash_enabled` shipped Off.

        2. **`EXPORT_SOURCE_NOT_EVENT_COMPLETE`** while **any** canonical source record type is
           `CREATION_ONLY`. **A package that cannot carry a `PaymentReceipt`
           reversal is not a canonical accounting export, however clearly its manifest declares
           the gap.** Eight of the twelve record types are `CREATION_ONLY` today, so this gate
           is closed; it opens when every required type is `EVENT_COMPLETE`, which is
           `SLICE-004` Pass 4's work and not this contract's.

        **`PERIOD_NOT_RECONCILED` — canonical exports are final-period only.** Every day in
        `period_from`..`period_to` must have a **closed** `HubCashReconciliation`.
        An open hub-day's figures are still moving, and an export of a moving
        figure is a number two systems will later disagree about.

        **IDEMPOTENT ON (scope, hub, period, schema version) WHILE A `REQUESTED` RECORD
        EXISTS.** A retried request matching an outstanding one **returns that record** and
        **does not queue a second package**. This is a natural-key rule, not an
        `Idempotency-Key` one: two officers who independently ask for August for the same hub
        are not two exports, and the duplicate would be discovered only as two manifests with
        two digests for one period.

        **A completed export is never regenerated in place.** Once a record leaves `REQUESTED`
        the same tuple may be requested again, and **that is a new record with its own
        manifest digest** — §5.5's rule that a fact is never rewritten and a correction is a
        new record. There is deliberately no `REGENERATING` state and no path back to
        `REQUESTED` (state-machines.md §20.7, **no machine**).

        **Emits `payment.ledger.exported` on generation, Enhanced** — §38.5 category 8, *"data
        exports and destructive retention actions"*. The event carries requester, scope, period
        range, schema version, per-record-type row counts and manifest digest. It is **the
        event that says payment facts left the platform**.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountingExportRequest' }
      responses:
        '201':
          description: |
            Export requested. `status` is `REQUESTED`; on an idempotent retry this is the
            record the first request created, unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountingExport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RuleViolation' }
    get:
      operationId: listAccountingExports
      # SAFE READ. No CSRF: a synchronizer token defends state change, and a read
      # changes none. Requiring it here would train clients to send it everywhere.
      security:
        - browserSession: []
      x-permission: payment.ledger.read
      x-error-codes: [PERMISSION_DENIED, SESSION_INVALID, VALIDATION_FAILED]
      tags: [accounting-exports]
      summary: Accounting exports in scope
      description: |
        `payment.ledger.read` — Finance, all hubs, the **read** key of the pair
        (permissions.md v1.39). **Filterable by `scope`, `hub_id`, period and `status`.**

        **METADATA ONLY.** This returns `AccountingExport` records — scope, period, schema
        version, status, requester, row counts, manifest digest and `file_available_until`. It
        returns **no package, no row, no payment fact and no `storage_ref`**, and it confers no
        retrieval authority: a package is reached only through
        `createAccountingExportRetrievalAuthorization`, one object at a time.

        **Paginated.** One record per requested period per scope accumulates without bound over
        the platform's lifetime, and a re-run is a new record rather than an update — so the
        set only grows.
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [SINGLE_HUB, ALL_HUBS] }
          description: '`AccountingExportScope` — errors-and-enums.md §6.'
        - name: hub_id
          in: query
          schema: { type: string, format: uuid }
          description: Meaningful only against `SINGLE_HUB` exports; `ALL_HUBS` records carry no hub.
        - name: period_from
          in: query
          schema: { type: string, format: date }
        - name: period_to
          in: query
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { type: string, enum: [REQUESTED, GENERATED, FAILED] }
          description: '`AccountingExportStatus` — errors-and-enums.md §6. **No machine** (state-machines.md §20.7).'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: Accounting exports in scope
          content:
            application/json:
              schema:
                type: object
                required: [items, next_page_token]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AccountingExport' }
                  next_page_token: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /accounting-exports/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      operationId: getAccountingExport
      # SAFE READ. No CSRF: a synchronizer token defends state change, and a read
      # changes none. Requiring it here would train clients to send it everywhere.
      security:
        - browserSession: []
      x-permission: payment.ledger.read
      x-error-codes: [PERMISSION_DENIED, SESSION_INVALID]
      tags: [accounting-exports]
      summary: One accounting export, readable after its file is gone
      description: |
        `payment.ledger.read` — `MSC-DEC-401`, permissions.md v1.39. **Reading the record is not
        reaching the package**: this key confers no retrieval authority whatever, and the only
        route to bytes is `payment.ledger.export` through
        `createAccountingExportRetrievalAuthorization`.

        **THIS RETURNS METADATA, ROW COUNTS AND MANIFEST DIGEST EVEN AFTER
        `file_available_until` HAS PASSED.** **The record is permanent; only the file
        expires.** `manifest_digest` and `row_counts` outlive the package deliberately, so the
        fact that an export happened — and what it contained — stays answerable when the bytes
        are gone. An expired export is **not** a 404 and **not** a `FAILED` record: it is a
        `GENERATED` record whose `file_available_until` is in the past, which a caller
        determines **by comparison**.

        **File availability is not a status, and that is a decision rather than an omission**
        (plan §9). Adding a fourth value to `AccountingExportStatus` would make the passage of
        time look like a transition somebody took, and state-machines.md §20.7's test is
        precisely that no transition after creation is any actor's decision.

        **No `storage_ref`, here as everywhere.** Returning it would hand a client the address
        to construct its own retrieval and bypass the authorization entirely.
      responses:
        '200':
          description: |
            The export record — scope, period, schema version, status, row counts, manifest
            digest and `file_available_until`. Returned whether or not the package still exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountingExport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /accounting-exports/{id}/retrieval-authorizations:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: createAccountingExportRetrievalAuthorization
      x-permission: payment.ledger.export
      x-error-codes: [CSRF_VALIDATION_FAILED, EXPORT_FILE_EXPIRED, PERMISSION_DENIED, SESSION_INVALID, STATE_CONFLICT]
      tags: [accounting-exports]
      summary: Obtain a short-lived, single-object retrieval authorization over a package
      description: |
        **This mirrors `createEvidenceRetrievalAuthorization` deliberately and completely**
        (§7.6). It is the repository's established shape for handing out a stored object, and a
        payment-ledger package is not the place to invent a second one.

        **The order of checks is the operation**: authenticate, verify
        `payment.ledger.export`, execute principal-specific RLS, confirm the record is
        `GENERATED`, confirm `file_available_until` has not passed, and only then issue the
        capability. A record in `REQUESTED` or `FAILED` returns `STATE_CONFLICT` — there is no
        package to authorize. Past `file_available_until` it returns **`EXPORT_FILE_EXPIRED`**,
        deterministically, rather than an authorization over an absent object;
        `getAccountingExport` still answers for the export itself.

        **THIS IS NOT A DOWNLOAD OPERATION.** It streams nothing and returns no package bytes.
        Private means authorization-private, not network-unreachable: the object endpoint may
        be Internet-reachable for a cryptographically valid, short-lived, single-object signed
        operation — that is what makes a presigned URL work, and what makes it safe is that the
        platform issued it after checking permission and it grants exactly one object for a few
        minutes. **There is no anonymous read, no listing, no public ACL and no permanent URL.**

        **Five minutes** — `accounting_export_retrieval_authorization_ttl_minutes`
        (settings.md v1.38). It matches `evidence_retrieval_authorization_ttl_minutes`
        because the capability is regenerable and **a payment-ledger package is
        at least as sensitive as a single `Evidence` object**, so it earns no longer bearer
        lifetime than evidence's five minutes.

        **The response is transient and is never logged.** No storage credential, no listing
        authority, no usable `storage_ref`, no permanent URL. `Cache-Control: no-store`.

        **Emits `payment.ledger.export_retrieval_authorized`, Enhanced** — §38.5 category 8.
        **The event is named for what Melarc can observe**: the object is fetched from storage
        under the presigned authorization, so the platform records the capability it issued and
        **never the download that follows**. Calling it `accessed` would certify a fact nobody
        holds. The signed URL itself is never logged (audit.md §9).
      responses:
        '200':
          description: Short-lived single-object retrieval authorization
          headers:
            Cache-Control:
              description: Always `no-store`. The capability must not be cached by any intermediary
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountingExportRetrievalAuthorization' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: melarc_session
      description: |
        **Ops Portal and Vendor PWA.** An OPAQUE server-side session credential
        delivered in an HttpOnly, Secure, SameSite=Lax cookie. Browser JavaScript never receives
        the raw secret, and only its hash is persisted (Session.token_hash).

        Unsafe requests additionally require CSRF protection and Origin validation - the cost of
        using cookies, and cheaper than the alternative.

        NOT a JWT. There is no refresh-token subsystem in Version 1: Melarc already requires
        immediate revocation, vendor displacement, rider one-session enforcement and
        suspension/credential/administrative revocation, which erase the statelessness a JWT would
        buy. Revoking the Session record ends the access.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        **The synchronizer half of a cookie-authenticated browser request** (MSC-DEC-261,
        MSC-DEC-270). Echoed from the readable `melarc_csrf` cookie and compared against
        Session.csrf_token_hash. Origin is validated as well; either failing returns
        CSRF_VALIDATION_FAILED.

        **It is declared as a security scheme rather than a parameter deliberately.** A parameter
        can be optional, and a CSRF token that is optional is not a control. Declared here it
        composes with browserSession as an AND requirement, which is a structural rule a checker
        can read off the contract.

        **Never required of riderSession.** A Bearer credential is not attached automatically by a
        browser, so there is nothing for a cross-site request to ride on.

    vendorDevice:
      type: apiKey
      in: cookie
      name: melarc_vendor_device
      description: |
        **Pre-session proof that this browser is the vendor's registered one** (MSC-DEC-265,
        MSC-DEC-270). A long-lived, server-generated, high-entropy credential in an HttpOnly
        cookie, stored hashed. **It is not a Session** and confers no authority: it identifies the
        browser, and the human credentials are still required in the request body.

        **Declared as security rather than left implicit.** Gate A issued this credential and no
        operation required it, so vendor sign-in was in practice **shared secret alone** - the
        second factor existed in three documents and in no request. Declaring it here makes
        possession a structural precondition a checker can read off the contract.

        **Held only by vendorSignIn.** Initial setup and recovery are the operations that ESTABLISH
        it, so requiring it there would make first registration impossible.

    riderSession:
      type: http
      scheme: bearer
      description: |
        **Melarc Rider only.** The same class of opaque server-side session secret as
        browserSession, presented as a Bearer credential and stored ONLY in Android OS-backed
        secure credential storage.

        Bearer here denotes the transport, not a JWT. The value is an opaque secret whose hash is
        the server's record; it carries no claims and cannot be parsed.

  headers:
    SetCookie:
      description: |
        One or more real `Set-Cookie` field lines.

        **A response may emit several.** HTTP allows repeated `Set-Cookie` fields and OpenAPI
        cannot name them individually, so WHICH cookies a response establishes is declared by the
        `x-set-cookies` extension on that response, resolving against the root `x-cookies` map.

        **The previous representation invented `X-Set-Csrf-Cookie` and `X-Set-Vendor-Device-Cookie`
        to work around that limitation.** Those are not HTTP headers. An implementation reading the
        contract literally would have emitted two custom headers no browser stores, and the
        credentials would never have reached the client at all.

        Raw cookie credentials appear here and **never in a JSON body**.
      schema: { type: string }
    CacheControlNoStore:
      description: |
        `no-store`. Set on any response carrying a raw setup credential, so no
        intermediary or browser cache retains an enrolment secret.
      schema: { type: string }
    ETag:
      description: Opaque record version. Send back as `If-Match` on the next mutation.
      schema: { type: string }
    RetryAfter:
      description: Whole seconds the client should wait before it tries again (`TrustDataUnavailable`).
      schema: { type: integer, minimum: 1 }

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
      description: |
        Synchronizer token echoed from the `melarc_csrf` cookie on **unsafe cookie-authenticated**
        requests. The server compares its hash against `Session.csrf_token_hash` and
        validates `Origin`; either failing returns `CSRF_VALIDATION_FAILED`.

        **Rider Bearer requests do not use CSRF** - a Bearer credential is not sent automatically by
        the browser, so there is nothing for a cross-site request to ride on.
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: UUID v7. The human-readable `code` is an attribute, never a path parameter.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
      description: |
        ETag from the last read. A mismatch returns 409 `STATE_CONFLICT`. Version-based rather
        than state-based, so a concurrent change that does not alter state is still caught.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 128 }
      description: |
        Client-generated. **Required for every operation whose contract declares this parameter**;
        **all rider mutation commands declare it** unless an operation states otherwise. Same key
        and same payload replays the original result; same key with a different payload returns
        409 `IDEMPOTENCY_KEY_CONFLICT`.

        **Rider commands carry it for connection resilience, not because the command is
        offline-capable** (see rule 4). Ops commands carry it where a repeated submission would
        otherwise repeat a side effect - `reassignPickupRequestHub`, `cancelPickupRequest`,
        `escalatePickupRequest`, `extendPickupAttempts`, `submitBlindCount`, `closeHubIntake`
        and `setManifestStopOrder` are the current examples (the last two added for their new
        audit events under CRIT-05/CRIT-09, not a repeatable business effect) - and it is why
        this description no longer says *rider* alone: **a parameter description narrower than
        the parameter's declared use is a contract disagreeing with itself.**

        **Not every Ops mutation carries it, and the omission is deliberate where a guarded
        state transition creates no second record and repeats no charge** -
        `confirmPickupRequest` is the current example: `If-Match` alone already makes a stale
        retry fail cleanly, and confirmation reserves no credit and moves no money (§5.2.1).

        **The key is scoped to the calling principal and the operation**, so a
        key chosen by one caller can never match another's. Clients need no coordination and
        may reuse any value they like across operations.

        **R0 scoped it globally, and the consequence was not a collision.** Two vendors
        choosing `retry-1` on the same operation is expected behaviour for two independent
        clients; the second did not get an error, it got a **replay of the first vendor's
        stored result** - one caller receiving another's response body, through the mechanism
        that exists to make retries safe.
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    PageToken:
      name: page_token
      in: query
      schema: { type: string }

  responses:
    Unauthenticated:
      description: |
        401 - no usable authenticated session. Missing, malformed, unknown, expired
        or terminated.

        DELIBERATELY UNDIFFERENTIATED. `SESSION_INVALID` is returned for every one of those causes:
        distinguishing them outward tells an unauthenticated caller which guess was closest. The
        AUDIT record keeps the precise cause - audit.md 5.4's asymmetry, undifferentiated outward
        and precise inward.

        `SESSION_SUPERSEDED` is the single exception, because 37.2 makes vendor displacement
        deliberate product behaviour the client must be able to recognise.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: |
        429 - rate limited. Per credential, tightest on the shared vendor login and
        the rider device. The figures were set at MSC-DEC-371 (OQ-067 closed 5 September 2026)
        onto the six buckets and eight keys MSC-DEC-285 created at settings.md 7.7 (OQ-077
        closed); the RESPONSE was declarable before either landed, which is why it was
        declared first.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        `PERMISSION_DENIED`, `INSUFFICIENT_AUTHORITY` or `HUB_SCOPE_VIOLATION` - the three
        refusals an authenticated caller may be told, each for a different gate.
        Deny by default (§37.1). **A record that exists but belongs to another vendor, or - when a
        rider looks it up - to work not assigned to that rider, is never a 403**: it is the `404`
        below, identical to a record that does not exist. A rider who acts on work they name and are
        not assigned is told `NOT_ASSIGNED_RIDER` or `NOT_CUSTODY_HOLDER`, not this.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: |
        `NOT_FOUND`. The record does not exist - **or** it exists and the caller is a
        Vendor or a Rider who may not know it does (§43.2, §19.2). The two are one response: same
        status, same code, same body shape and the same timing class. Staff who hold the key and
        reach an existing record outside their hubs are not given this: that is `HUB_SCOPE_VIOLATION`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: '`VALIDATION_FAILED`. `details` names the offending field.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: '`STATE_CONFLICT` or `IDEMPOTENCY_KEY_CONFLICT`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RuleViolation:
      description: |
        A business rule refused the command. `code` carries the specific reason from
        `contracts/errors-and-enums.md` §5.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TrustDataUnavailable:
      description: |
        `503` `TRUST_DATA_UNAVAILABLE` (MSC-DEC-437, SECURITY_DESIGN 15.2.2). The verifier cannot
        evaluate a handset's key attestation because the trust data it needs - the accepted roots and
        Google's revocation list - is older than the 24-hour maximum, was never loaded by this
        instance, or could not be loaded. **Retryable, and the grant is still good**: nothing was
        written and nothing was consumed. `Retry-After` says when to try again.

        **Returned by `completeRiderDeviceEnrolment` and by nothing else.** Sign-in, sessions and
        every other operation do not read trust data. It is not `DEVICE_INTEGRITY_FAILED`, which
        says the evidence was evaluated and failed policy, and not `DEVICE_SECURITY_UNSUPPORTED`,
        which says the handset lacks the capability: nothing is known to be wrong with the device.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    DeliveryCommitment:
      type: object
      description: >-
        One commitment state for an order. APPEND-ONLY: a row is never updated
        except to set supersededAt. The current commitment is the row with no supersededAt.
      required: [id, orderId, sequence, defaultDate, committedDate, slaStartAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        sequence: { type: integer, minimum: 1, description: 1 for the original commitment }
        defaultDate:
          type: string
          format: date
          description: >-
            The calculated service date. Carried forward unchanged on every revision - it answers
            what ordinary service would have produced, and recomputing it destroys that.
        requestedDate:
          type: string
          format: date
          nullable: true
          description: What the sender or recipient asked for.
        committedDate: { type: string, format: date, description: What Melarc promised }
        committedWindowStart: { type: string, nullable: true, example: '10:00' }
        committedWindowEnd: { type: string, nullable: true, example: '16:00' }
        changeReasonCode:
          type: string
          nullable: true
          description: Mandatory from sequence 2 onward. A CommitmentChangeReason.
        requestedByParty:
          type: string
          enum: [SENDER, RECIPIENT, MELARC, SYSTEM]
          nullable: true
        approvedByStaffId: { type: string, format: uuid, nullable: true }
        slaStartAt:
          type: string
          format: date-time
          description: >-
            Pickup custody, not hub arrival. Internal delay after pickup does not
            move it.
        createdAt: { type: string, format: date-time }
        supersededAt: { type: string, format: date-time, nullable: true }

    DeliveryCommitmentRevision:
      type: object
      required: [committedDate, changeReasonCode, requestedByParty]
      properties:
        committedDate: { type: string, format: date }
        committedWindowStart: { type: string, nullable: true }
        committedWindowEnd: { type: string, nullable: true }
        requestedDate: { type: string, format: date, nullable: true }
        changeReasonCode:
          type: string
          description: >-
            Mandatory. CUSTOMER_DEFERRED, SENDER_SCHEDULED, CORRIDOR_SCHEDULE or MELARC_DELAY.
            Without it the revision is refused - the same change means opposite things depending
            on cause.
        requestedByParty: { type: string, enum: [SENDER, RECIPIENT, MELARC, SYSTEM] }
        note: { type: string, nullable: true }

    ServiceWindowOverride:
      type: object
      required: [revisedWindowStart, revisedWindowEnd, reasonCode, customerNotified]
      properties:
        revisedWindowStart: { type: string, example: '08:30' }
        revisedWindowEnd: { type: string, example: '10:00' }
        revisedDate: { type: string, format: date, nullable: true }
        reasonCode: { type: string, description: Mandatory }
        customerNotified:
          type: boolean
          description: The customer notification state at the time of the override.
        note: { type: string, nullable: true }

    ParcelHandlingAssessment:
      type: object
      description: >-
        A transport-safety judgement, never a pricing outcome. No kilogram or
        dimension threshold exists.
      required: [assessment]
      properties:
        assessment: { type: string, enum: [STANDARD_HANDLING, REQUIRES_REVIEW, NOT_ACCEPTABLE] }
        reasonCode:
          type: string
          nullable: true
          description: Mandatory for REQUIRES_REVIEW and NOT_ACCEPTABLE.
        note: { type: string, nullable: true }
        assessedAt: { type: string, format: date-time, readOnly: true }

    VerificationFallbackRequest:
      type: object
      description: >-
        The rider-side REQUEST only. It authorises nothing; the grant is
        authoriseDeliveryWithoutOtp under delivery.otp.override.
      required: [failureReasonCode, recipientPresent]
      properties:
        failureReasonCode: { type: string }
        recipientPresent: { type: boolean }
        attemptsMade: { type: integer, minimum: 0 }
        note: { type: string, nullable: true }
        status: { type: string, enum: [REQUESTED, GRANTED, REFUSED], readOnly: true }

    ManualPaymentConfirmation:
      type: object
      description: >-
        Out-of-band confirmation of a Merchant MoMo receipt. A screenshot is not
        proof; the confirming actor is recorded and is never the rider.
      required: [amountMinor, method, providerReference]
      properties:
        amountMinor: { type: integer, minimum: 1 }
        method: { type: string, enum: [MERCHANT_MOMO, OPS_ASSISTED] }
        fallback_authorization_id:
          type: string
          format: uuid
          description: >-
            REQUIRED where a provider attempt is unresolved. The grant must be
            ACTIVE, name this demand and that attempt, and authorise MERCHANT_MOMO. A successful
            confirmation CONSUMES it - it cannot settle a second payment.
        providerReference: { type: string, description: The transaction reference actually verified }
        confirmedByStaffId: { type: string, format: uuid, readOnly: true }
        confirmedAt: { type: string, format: date-time, readOnly: true }

    RoadExpense:
      type: object
      required: [id, riderId, categoryCode, amountMinor, fundingSource, status]
      properties:
        id: { type: string, format: uuid }
        riderId: { type: string, format: uuid }
        deliveryRunId: { type: string, format: uuid, nullable: true }
        motorcycleId: { type: string, format: uuid, nullable: true }
        responsibleHubId: { type: string, format: uuid }
        categoryCode: { type: string, description: From the configurable catalogue }
        amountMinor: { type: integer, minimum: 1 }
        fundingSource:
          type: string
          enum: [COLLECTION_CASH, RIDER_PERSONAL, COMPANY_FLOAT]
          description: >-
            Never mixed. Only an approved, eligible COLLECTION_CASH expense
            ACTUALLY APPLIED to a handover reduces that handover's expected cash - approval
            alone reduces nothing. RIDER_PERSONAL records a
            reimbursement obligation and COMPANY_FLOAT reconciles against the float.
        description: { type: string }
        evidenceId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [CLAIMED, APPROVED, REJECTED] }
        decidedByStaffId: { type: string, format: uuid, nullable: true }
        decisionReasonCode: { type: string, nullable: true }
        appliedToCashHandoverId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: >-
            The one handover this expense reduced, or null while unapplied. Write-once per
            expense and immutable once set. NOT unique across expenses - many
            expenses may name one handover.
        appliedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: >-
            When this expense was applied. APPROVAL made it eligible; application is what
            reduced expected cash, and the two are different events at different times.
        incurredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }

    RoadExpenseCreate:
      type: object
      required: [categoryCode, amountMinor, fundingSource, description, incurredAt]
      properties:
        deliveryRunId: { type: string, format: uuid, nullable: true }
        motorcycleId: { type: string, format: uuid, nullable: true }
        categoryCode: { type: string }
        amountMinor: { type: integer, minimum: 1 }
        fundingSource: { type: string, enum: [COLLECTION_CASH, RIDER_PERSONAL, COMPANY_FLOAT] }
        description: { type: string }
        evidenceId: { type: string, format: uuid, nullable: true }
        incurredAt: { type: string, format: date-time }

    RoadExpenseDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APPROVED, REJECTED] }
        reasonCode: { type: string, nullable: true, description: Mandatory on REJECTED }
        note: { type: string, nullable: true }

    RunCashSummary:
      type: object
      description: >-
        Two reconciliations, deliberately separate. Collapsing them reports a
        GH300 shortfall against a rider who is not short by a pesewa.
      required: [runId, customerPayment, cashCustody, orders]
      properties:
        runId: { type: string, format: uuid }
        customerPayment:
          type: object
          description: Did every completed delivery receive what it was owed?
          required: [expectedMinor, confirmedDigitalMinor, grossCashMinor, totalAccountedMinor, varianceMinor]
          properties:
            expectedMinor: { type: integer }
            confirmedDigitalMinor: { type: integer, description: Only where Melarc CONFIRMED receipt }
            confirmedFallbackMinor: { type: integer }
            grossCashMinor: { type: integer, description: Gross recipient cash. Never rewritten by an expense }
            totalAccountedMinor: { type: integer }
            varianceMinor: { type: integer }
        cashCustody:
          type: object
          description: What cash physically entered rider possession, and where did it go?
          required: [grossCashMinor, approvedCollectionCashExpenseMinor, appliedCollectionCashExpenseMinor, expectedHandoverMinor]
          properties:
            grossCashMinor: { type: integer }
            approvedCollectionCashExpenseMinor:
              type: integer
              description: >-
                APPROVED and eligible COLLECTION_CASH road expenses for this run.
                ELIGIBILITY, not a deduction: an expense here may already
                have been applied to an earlier handover, and deducting it again would
                charge the rider twice for one tank of fuel.
            appliedCollectionCashExpenseMinor:
              type: integer
              description: >-
                Total APPLIED to the handover being reconciled - the figure that actually
                reduces expected cash. Equal to the approved
                total only when every eligible expense has been applied here.
            expectedHandoverMinor:
              type: integer
              description: >-
                grossCashMinor minus appliedCollectionCashExpenseMinor (MSC-DEC-316, as
                corrected at Gate C R1.2). NEVER computed from the approved total.
            declaredMinor: { type: integer, nullable: true }
            countedMinor: { type: integer, nullable: true }
            varianceMinor: { type: integer, nullable: true }
        orders:
          type: array
          description: >-
            Per-order reconciliation. A run total can be right while both orders
            are wrong, and an aggregate nets one order's shortfall against another's excess.
          items:
            type: object
            properties:
              orderId: { type: string, format: uuid }
              requiredMinor: { type: integer }
              allocatedMinor: { type: integer }
              settlementStatus: { type: string }
              paymentMethods: { type: array, items: { type: string } }

    HubCashReconciliation:
      type: object
      required: [id, hubId, businessDate, expectedMinor, state]
      properties:
        id: { type: string, format: uuid }
        hubId: { type: string, format: uuid }
        businessDate: { type: string, format: date }
        openingPositionMinor: { type: integer }
        expectedMinor:
          type: integer
          description: Never edited to match the count.
        countedMinor: { type: integer, nullable: true }
        varianceMinor:
          type: integer
          nullable: true
          # The one-line flow mapping read `description: counted minus expected, signed`, and an
          # unquoted comma SEPARATES ENTRIES in a flow mapping - so `signed` parsed as a second
          # key with a null value. An unknown keyword in a schema is silently ignored by some
          # tools and fatal in others; either way it is not what was meant.
          description: Counted minus expected. Signed - a negative value is a shortage.
        state: { type: string, enum: [OPEN, COUNTED, RECONCILED, VARIANCE_OPEN] }
        varianceReasonCode: { type: string, nullable: true }
        reconciledByStaffId: { type: string, format: uuid, nullable: true }
        openedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }

    HubCashCount:
      type: object
      required: [businessDate, countedMinor]
      properties:
        businessDate: { type: string, format: date }
        countedMinor: { type: integer, minimum: 0 }
        varianceReasonCode:
          type: string
          nullable: true
          description: Mandatory where the count differs from the expected position.
        note: { type: string, nullable: true }

    CashDisposition:
      type: object
      description: >-
        The last custody transfer, and the one nobody naturally records. Creates no
        accounting entry.
      required: [amountMinor, method, destination]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        hubCashReconciliationId: { type: string, format: uuid, readOnly: true }
        amountMinor: { type: integer, minimum: 1 }
        method:
          type: string
          enum: [BANK_DEPOSIT, MERCHANT_MOMO_TRANSFER, FINANCE_HANDOVER, SAFE_CUSTODY]
        destination: { type: string }
        reference:
          type: string
          nullable: true
          description: Mandatory for BANK_DEPOSIT and MERCHANT_MOMO_TRANSFER.
        evidenceId: { type: string, format: uuid, nullable: true }
        recordedByStaffId: { type: string, format: uuid, readOnly: true }
        recordedAt: { type: string, format: date-time, readOnly: true }

    VendorOrganizationCreate:
      type: object
      required: [responsible_hub_id, legal_name]
      additionalProperties: false
      properties:
        responsible_hub_id: { type: string, format: uuid }
        legal_name: { type: string }
        trading_name: { type: string }
        contact_phone: { type: string }
        contact_email: { type: string }
        recovery_phone: { type: string }
        recovery_email: { type: string }
      description: |
        **No secret field, and no status field.** The vendor sets its own secret from the
        grant APPROVAL issues, and the record's status is `PENDING_SENIOR_OPS_REVIEW`
        by construction - accepting either would let the creating actor hand itself an active
        vendor.

        **At least one of `recovery_phone` / `recovery_email` is required** - it is the channel
        the setup grant is delivered to, and an account with no channel can never be activated.
        The business `contact_*` pair is deliberately separate: a business contact is not an
        authentication channel.

    VendorOrganization:
      type: object
      required: [id, responsible_hub_id, legal_name, operational_status, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        responsible_hub_id: { type: string, format: uuid }
        legal_name: { type: string }
        trading_name: { type: [string, 'null'] }
        contact_phone: { type: [string, 'null'] }
        contact_email: { type: [string, 'null'] }
        operational_status:
          type: string
          enum: [CREATED_BY_OPS, PENDING_SENIOR_OPS_REVIEW, ACTIVE, REJECTED, SUSPENDED, TERMINATED]
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        decided_by: { type: [string, 'null'], format: uuid }
        decided_at: { type: [string, 'null'], format: date-time }
        decision_reason: { type: [string, 'null'] }
      description: |
        Entity at domain-model.md 6.16.

        **`SUSPENDED` and `TERMINATED` are reached by `suspendVendor`, `reactivateVendor` and
        `terminateVendor`** (MSC-DEC-397; OQ-033 closed 21 September 2026): suspension by hub
        Senior Ops or Platform Admin, reactivation symmetric or higher, termination by Platform
        Admin from `SUSPENDED` only with no hold still `HELD`. **The machine itself is still
        untabled** - state-machines.md 14 holds `VendorOrganization` as state sets only, so
        three live operations drive transitions no signed table describes. That is OQ-132,
        owed by SLICE-008 and closing on a 36.13 signature. *Superseded reading:* declared and
        reachable by no operation here, exits and entries being OQ-033's - true until SLICE-008
        Pass 2, and carried here for two days after.

        **Both actor fields are returned together on purpose.** 35.12.2's exclusion is enforced
        at the call, and an enforcement that leaves no queryable record is unfalsifiable
        afterwards - the same reasoning audit.md 5.6 records for `staff.identity.approved`.

    VendorOrganizationDecision:
      type: object
      required: [approved]
      additionalProperties: false
      properties:
        approved: { type: boolean }
        reason:
          type: string
          description: Mandatory when `approved` is false (29.2.5). Optional on approval.
      description: |
        One schema for both halves of 18.2's "approves or rejects", the same shape
        `StaffIdentityApproval` uses. A separate rejection operation would need a separate
        permission key for one decision.

    VendorAllowanceDecision:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string }
      description: |
        **A reason and nothing else.** No amount - the limit is one platform-wide figure,
        `global_vendor_account_limit_amount` (GH200, MSC-DEC-238), and a per-vendor amount here
        would make an override representable that 29.2.4 does not grant. No target state -
        the operation's own path fixes the direction, so a body that disagreed with the path
        could not exist. No evidence reference: 29.2.4's "basic verification" names no evidence
        set in any contract, and MSC-DEC-397 settled that it is the recorded reason and nothing
        more (OQ-033 closed) - not this schema's to invent.

    VendorAccountAllowance:
      type: object
      required: [id, vendor_organization_id, state]
      properties:
        id: { type: string, format: uuid }
        vendor_organization_id: { type: string, format: uuid }
        state: { type: string, enum: [DISABLED_PREPAYMENT_ONLY, ENABLED] }
        decided_by: { type: [string, 'null'], format: uuid }
        decided_at: { type: [string, 'null'], format: date-time }
        reason: { type: [string, 'null'] }
      description: |
        Entity at domain-model.md 6.16. Exactly one per organisation, created with it in
        `DISABLED_PREPAYMENT_ONLY` so that "no decision yet" and "deliberately disabled" are
        the same safe state rather than a null nobody interprets.

        **This records the decision and does not enforce the consequence** - state-machines.md
        8 branches `PRICED -> CREDIT_RESERVED` on allowance enabled, not OVERDUE and sufficient
        global exposure, and restating that here would create a second place for it to be wrong.

    VendorSuspension:
      type: object
      required: [grounds, reason]
      additionalProperties: false
      properties:
        grounds:
          type: string
          enum: [NON_PAYMENT_OVERDUE, SUSPECTED_FRAUD_OR_ABUSE, SAFETY_OR_LEGAL_VIOLATION,
                 REPEATED_SERVICE_QUALITY_FAILURE]
        reason: { type: string }
      description: |
        **Four grounds and a reason, and the enum is closed.** 29.6 fixes the categories
        (29.6, MSC-DEC-168-169) and calls them "four starting grounds categories" - starting, and still
        four. A free-text grounds field would let a fifth arrive without a decision.

        **The reason is separate from the grounds and both are required.** The category is what an
        auditor filters on; the reason is what a reviewer reads.

    VendorReactivation:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string }
      description: |
        **A reason and nothing else.** No per-item selection: reactivation resumes EVERY remaining
        HELD hold in one act, because 29.6 already makes reactivation the resolution
        of a hold. Accepting a subset here would quietly create the per-item resume decision that
        decision rejected.

    VendorTermination:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string }
      description: |
        **A reason and nothing else.** No settlement flag and no write-off field: obligations
        survive termination and stay payable, so there is nothing here to close them
        with. No retention period either - that is `OQ-028`'s, awaiting legal input.

    HeldParcelDisposition:
      type: object
      required: [outcome, reason]
      additionalProperties: false
      properties:
        outcome:
          type: string
          enum: [CONTINUE_HOLD, RETURN_TO_VENDOR]
          description: >-
            RETURN_TO_VENDOR became representable on 21 September 2026, when state-machines.md 9
            gained the suspension route into RETURN_TO_VENDOR_IN_PROGRESS from the six non-terminal
            states that are not AT_HUB_AFTER_FAILURE (9.1). Until then it was confirmed policy
            (29.6, MSC-DEC-142) this contract could not express, held out of the enum so the gap
            stayed a contract fact rather than a runtime failure. THAT AMENDMENT WAS RE-SIGNED on
            21 September 2026: 1.1 records the cost it carried while it was not -
            every dependant of 9 was barred from READY - and that bar is lifted. (Corrected at
            OQ-129 R1.2, which found this description still awaiting a signature given four days
            earlier.) The value is carried here because a transition nothing can trigger
            is the other half of the same inconsistency. It commits a ReturnRecord with
            originating_delivery_stop_id NULL and the same flat return fee as any other return
            (29.6, MSC-DEC-171) - no cause-based carve-out.
        reason: { type: string }
      description: |
        Scoped to the order's responsible_hub_id - AUTHORITY, not custody (29.6, MSC-DEC-142).
        **The disposition may be decided while the parcel is still with a rider**, and deciding it
        asserts no hub possession and rewrites no custody: custody_location keeps recording the
        truth until a later custody-transfer event. **For the end-of-run rider-to-hub return that
        event now exists** - ParcelCustodyReturn (domain-model.md 6.10, machine at
        state-machines.md 12.2), where the HUB's confirmation moves custody, not the rider's
        declaration. **OQ-129 stays open for two things that are not this gap**: 12.2 carries no
        signature, and a run whose rider declares nothing at all still produces no record for any
        filter to find. *Superseded reading, corrected at OQ-129 R1.2:* "which is OQ-129's artifact
        gap".
        Where the order is OUT_FOR_DELIVERY the stop follows state-machines.md 12.1's SIGNED
        SKIPPED semantics - recipient delivery terminated for that stop, no attempt consumed, not
        recorded as returned, no recipient handover.
        A RETURN_TO_VENDOR closes through
        return-to-vendor.md's OTP-gated handover, unchanged - what 29.6 means by "reusing the
        Section 28.4 OTP-based closure". **CONTINUE_HOLD sets no expiry**:
        29.6 states that no fixed maximum hold duration applies.

    HeldParcelEscalation:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string }
      description: |
        Platform Admin only. Escalates **a parcel** to a manual claims or security hold and does not
        create a vendor-level `SecurityRiskHold`, which `openSecurityRiskHold` and
        `clearSecurityRiskHold` write (MSC-DEC-414, closing `OQ-128`).

    VendorSuspensionHold:
      type: object
      required: [id, vendor_organization_id, order_id, responsible_hub_id, state, grounds, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        vendor_organization_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        responsible_hub_id:
          type: string
          format: uuid
          description: >-
            The hub ACCOUNTABLE for this item, derived from the order and immutable - the same
            meaning the term carries on Evidence, DeliveryCommitment and RoadExpense. Fixes the
            scope of the disposition. It does NOT say where the parcel is; custody_location does.
        custody_location:
          type: [string, 'null']
          description: >-
            Where the item ACTUALLY is, and the only field that says so - a shelf, a bay, or
            "with rider on run R". Null means the responsible hub holds it with no finer
            location recorded. 29.6's "identify where each held item physically is" is
            satisfied here, not by responsible_hub_id.
        state: { type: string, enum: [HELD, RESUMED, AUTHORIZED_EXCEPTION_DISPOSITION] }
        grounds:
          type: string
          enum: [NON_PAYMENT_OVERDUE, SUSPECTED_FRAUD_OR_ABUSE, SAFETY_OR_LEGAL_VIOLATION,
                 REPEATED_SERVICE_QUALITY_FAILURE]
        reason: { type: string }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        decided_by: { type: [string, 'null'], format: uuid }
        decided_at: { type: [string, 'null'], format: date-time }
        decision_reason: { type: [string, 'null'] }
      description: |
        Entity at domain-model.md 6.17. **One row per held non-terminal work item**, not one per
        suspension - 36.12's machine is titled "Vendor work during suspension" and its subject is
        NON_TERMINAL_WORK, and 29.6 requires the system to identify where EACH held item physically
        is. See 6.17 for why that reading wins over data-scope-registry.md 4.3's prose.

    VendorPickupLocationCreate:
      type: object
      required: [label, location]
      additionalProperties: false
      properties:
        label: { type: string }
        location: { $ref: '#/components/schemas/Location' }
      description: |
        **No is_default field, and the omission is the rule.** The FIRST location a vendor saves
        becomes the default automatically; every later one does not, and moving it is
        setDefaultVendorPickupLocation's job. Accepting a flag here would let a create silently
        demote the existing default.

        **No active field** - a created location is active. **No vendor id** either: for a
        Vendor it is the session's own, and for Ops it is the path.

    VendorPickupLocationUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        label: { type: string }
        location: { $ref: '#/components/schemas/Location' }
      description: |
        Label, address, or both. **Neither is_default nor active is editable here** - each has
        its own operation, because moving a default and retiring a location are decisions of a
        different kind from correcting an address, and 29.4's one-default rule needs an act
        that clears the previous holder in the same transaction.

    VendorPickupLocation:
      type: object
      required: [id, vendor_organization_id, label, location, is_default, active]
      properties:
        id: { type: string, format: uuid }
        vendor_organization_id: { type: string, format: uuid }
        label: { type: string }
        location: { $ref: '#/components/schemas/Location' }
        is_default: { type: boolean }
        active: { type: boolean }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_by: { type: [string, 'null'], format: uuid }
        updated_at: { type: [string, 'null'], format: date-time }
      description: |
        Entity at domain-model.md 6.18.

        **Exactly one active location per vendor has is_default true**, or none where the vendor
        has no active location. `is_default` is never null: a tri-state would make "no default"
        and "not the default" the same value.

        **This is an input at booking and never the authoritative origin.** That is
        PickupRequest.resolved_pickup_location, snapshotted at booking (3.7), which is why
        editing or retiring a location changes nothing already booked.

    VendorOperationalEligibility:
      type: object
      description: >-
        DERIVED and computed at read time. Not a source of truth, not persisted.
        Persisting it would create a second truth able to disagree with the four 35.12.8
        conditions it summarises, invisibly.
      required: [vendorOrganizationId, mayCreatePickup, requiresPrepayment, effectiveAt]
      properties:
        vendorOrganizationId: { type: string, format: uuid }
        mayCreatePickup: { type: boolean }
        mayConfirmVendorPaidOrder: { type: boolean }
        requiresPrepayment: { type: boolean }
        recipientPaidOrdersAllowed: { type: boolean }
        restrictionCategory:
          type: string
          nullable: true
          description: >-
            An approved HIGH-LEVEL category, only where disclosure is allowed. It never discloses
            that a security hold exists, who raised it or why.
        effectiveAt: { type: string, format: date-time }

    DailyOperationsCashReport:
      type: object
      description: >-
        DERIVED and computed at read time (domain-model.md 6.13, MSC-DEC-294's pattern). Not a
        source of truth, not persisted, creates no accounting entry. Every figure is
        read from an already-APPROVED entity at 6.11/6.12 - this schema adds no state of its own.
      required: [hubId, businessDate, generatedAt, operations, moneyFlow, unreconciledExceptionsOpen]
      properties:
        hubId: { type: string, format: uuid }
        businessDate: { type: string, format: date }
        generatedAt:
          type: string
          format: date-time
          description: When this projection was computed. Not a stored fact - recomputed on every read.
        unreconciledExceptionsOpen:
          type: boolean
          description: >-
            True whenever ANY RiderCashCustody for this hub-day is EXCEPTION_OPEN or the day's
            HubCashReconciliation is VARIANCE_OPEN (MSC-DEC-325, spec 16.3). A day is never
            presented as clean while either is true.
        operations:
          type: object
          required:
            - packagesReceivedCount
            - deliveryAttemptsCount
            - successfulDeliveriesCount
            - stationDropsCount
            - thirdPartyDispatchesCount
            - failedDeliveriesAwaitingReviewCount
            - returnsAwaitingReviewCount
            - heldAtHubCount
            - missedCommitmentsCount
          properties:
            packagesReceivedCount: { type: integer, description: PickupIntake reaching COUNTED or later today (domain-model.md 6.6). }
            deliveryAttemptsCount: { type: integer, description: DeliveryStop terminal outcomes today (domain-model.md 6.10). }
            successfulDeliveriesCount: { type: integer, description: DeliveryStop.state = DELIVERED today. }
            stationDropsCount: { type: integer, description: Order.commercial_mode = STATION_DROP reaching its terminal handoff today. }
            thirdPartyDispatchesCount: { type: integer, description: Order.commercial_mode = MELARC_COVERED_THIRD_PARTY_DELIVERY dispatched today. }
            failedDeliveriesAwaitingReviewCount: { type: integer, description: Order.fulfilment_state = AT_HUB_AFTER_FAILURE - undecided. }
            returnsAwaitingReviewCount: { type: integer, description: ReturnRecord not yet formally initiated. }
            heldAtHubCount: { type: integer, description: Custody with no scheduled onward movement today. }
            missedCommitmentsCount: { type: integer, description: delivery.commitment.breached events emitted today (sweep_missed_commitments). }
        moneyFlow:
          type: object
          required: [riderCashPositions, roadExpensesAppliedMinor, cashDispositions, revenueByType]
          properties:
            riderCashPositions:
              type: array
              description: One entry per CashHandover opened against this hub-day (domain-model.md 6.11).
              items:
                type: object
                required: [riderId, systemExpectedMinor, declaredTotalMinor, state]
                properties:
                  riderId: { type: string, format: uuid }
                  systemExpectedMinor: { type: integer, description: CashHandover.system_expected_minor - never rider- or caller-supplied. }
                  declaredTotalMinor: { type: integer, description: CashHandover.declared_total_minor. }
                  confirmedTotalMinor: { type: integer, nullable: true, description: CashHandover.confirmed_total_minor. Null before the hub counts. }
                  state: { type: string, description: CashHandover.state - state-machines.md 16.4. }
            roadExpensesAppliedMinor:
              type: integer
              description: Sum of RoadExpense.amount_minor applied to this hub-day's handovers (domain-model.md 6.12).
            hubCashReconciliation:
              type: object
              nullable: true
              description: Null where none has been opened yet for this hub-day.
              required: [state, expectedMinor]
              properties:
                state: { type: string, description: HubCashReconciliation.state - state-machines.md 20.2. }
                expectedMinor: { type: integer }
                countedMinor: { type: integer, nullable: true }
                varianceMinor: { type: integer, nullable: true }
            cashDispositions:
              type: array
              items:
                type: object
                properties:
                  amountMinor: { type: integer }
                  method: { type: string, enum: [BANK_DEPOSIT, MERCHANT_MOMO_TRANSFER, FINANCE_HANDOVER, SAFE_CUSTODY] }
            revenueByType:
              type: array
              description: >-
                One entry per PaymentDemandLine.obligation_type this contract models -
                DELIVERY_FEE, REDELIVERY_DELIVERY_FEE, REDELIVERY_FEE, SINGLE_PACKAGE_PICKUP_FEE,
                RETURN_FEE - with DELIVERY_FEE further split by commercialMode (Pass 2). Station
                Drop revenue is a commercialMode = STATION_DROP entry, not a fifth obligation_type
                - it is already DELIVERY_FEE (domain-model.md 6.12, Order.price_components_snapshot).
                RETURN_FEE (SLICE-006 Pass 1) covers only the ad-hoc-sender, immediate-demand
                settlement path (domain-model.md 6.14) - a registered vendor's return fee settles
                through the future VendorStatement mechanism and never appears here.
                OQ-123 is closed.
              items:
                type: object
                required: [obligationType, confirmedMinor]
                properties:
                  obligationType:
                    type: string
                    enum: [DELIVERY_FEE, REDELIVERY_DELIVERY_FEE, REDELIVERY_FEE, SINGLE_PACKAGE_PICKUP_FEE, RETURN_FEE]
                  commercialMode:
                    type: string
                    nullable: true
                    enum: [STATION_DROP, MELARC_COVERED_THIRD_PARTY_DELIVERY]
                    description: >-
                      Order.commercial_mode (domain-model.md 6.7), joined via
                      OperationalPaymentDemand.order_id. Present only on DELIVERY_FEE entries;
                      null means an ordinary DOORSTEP order, never "unknown." Never set on
                      REDELIVERY_DELIVERY_FEE, REDELIVERY_FEE, SINGLE_PACKAGE_PICKUP_FEE or
                      RETURN_FEE - those obligations do not vary by commercial_mode.
                  confirmedMinor:
                    type: integer
                    description: Sum of PaymentAllocation.amount_minor for this obligation type (and commercialMode, where present) - this hub and business date only.

    ReasonDefinition:
      type: object
      description: >-
        A reason drives validation (35.9.2). Any workflow that hardcodes "this reason needs a
        photo" - or "this reason costs an attempt" - contradicts it.
      required: [code, domain, label, attribution, active, consumesDeliveryAttempt]
      properties:
        code: { type: string, description: Stable. Never reused after deactivation }
        domain: { type: string }
        validCheckpoints:
          type: [array, 'null']
          items:
            type: string
            enum: [PRE_DISPATCH, NEXT_STOP, DOORSTEP]
          description: >-
            The recipient-contact checkpoints this reason may be selected at.
            **Non-empty where domain is RECIPIENT_CONTACT, null for every other domain**, which has
            no checkpoints. This is what REASON_NOT_VALID_FOR_CHECKPOINT evaluates, on
            recordConfirmationAttempt, recordNextStopContact and recordDoorstepContact.
            **Fielded at MSC-DEC-407, closing OQ-138's engineering half.** Named in this schema's camelCase, beside consumesDeliveryAttempt and requiresNote; domain-model.md 3.9 carries it as valid_checkpoints, which is that document's convention. domain-model.md 6.12's
            RecipientContactAttempt invariant already read "the catalogue carries the mapping" and
            errors-and-enums.md 6 that "a reason declares the checkpoints it is valid for" - and
            no field held it, so a declared refusal had nothing to read and a client had nothing to
            filter on. **The RECIPIENT_CONTACT contents are seeded by MSC-DEC-409**, closing
            OQ-142: NO_ANSWER, NUMBER_INCORRECT, RECIPIENT_DECLINED and CONTACT_NOT_POSSIBLE_MELARC
            at all three checkpoints, and RECIPIENT_NOT_AT_LOCATION at DOORSTEP only - it is the
            one that asserts physical presence. **Seeded defaults, not a closed set**: an approved
            operational reason may be added under settings.reason.manage without a contract
            change, on MSC-DEC-252's routing test.
        label: { type: string }
        attribution:
          type: string
          enum: [CUSTOMER, MELARC, EXTERNAL]
          description: Who caused it.
        consumesDeliveryAttempt:
          type: boolean
          description: >-
            Whether selecting this reason counts as a consumed physical delivery attempt
            - history and redelivery chargeability, never a count
            against a maximum, because none exists. A Melarc outage must not.
        requiresNote: { type: boolean }
        requiresPhoto: { type: boolean }
        requiresContactAttempt: { type: boolean }
        requiresApproval: { type: boolean }
        requiresOpsReview: { type: boolean }
        requiresEscalation: { type: boolean }
        active: { type: boolean, description: Deactivation never deletes }
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          enum: [ACCOUNT_OVERDUE, ALLOWANCE_DISABLED, ATTEMPTS_EXHAUSTED, BLIND_COUNT_VIOLATED, CARRIER_COST_REQUIRED, CARRIER_NOT_APPROVED, CASH_HANDOVER_VARIANCE, CHALLENGE_EXPIRED, CHALLENGE_UNUSABLE, CODE_EXPIRED, CODE_INVALID, COLLECTION_NOT_RECORDED, COMMITMENT_REASON_REQUIRED, COMMITMENT_SOURCE_UNRESOLVED, CORRIDOR_DAY_NOT_PERMITTED, CREDENTIAL_DELIVERY_FAILED, CREDENTIAL_LOCKED, CREDIT_LIMIT_EXCEEDED, CSRF_VALIDATION_FAILED, CUSTODY_NOT_RETURNED, DELIVERY_CHANNEL_FAILED, DESTINATION_UNRESOLVED, DEVICE_INTEGRITY_FAILED, DEVICE_NOT_ENROLLED, DEVICE_PROOF_INVALID, DEVICE_SECURITY_UNSUPPORTED, DISPATCH_NOT_CLEARED, DOORSTEP_WAIT_NOT_ELAPSED, EVIDENCE_NOT_STORED, EVIDENCE_REQUIRED, EVIDENCE_UPLOAD_EXPIRED, EXCEPTION_NOT_AVAILABLE_TO_SELF_SERVICE, EXPORT_FILE_EXPIRED, EXPORT_RETENTION_NOT_CONFIGURED, EXPORT_SOURCE_NOT_EVENT_COMPLETE, FALLBACK_AUTHORIZATION_ALREADY_CONSUMED, FALLBACK_AUTHORIZATION_DEMAND_MISMATCH, FALLBACK_AUTHORIZATION_METHOD_MISMATCH, FALLBACK_AUTHORIZATION_SUPERSEDED, FALLBACK_REQUIRES_AUTHORIZATION, FINANCIAL_CLOSURE_INCOMPLETE, HANDOFF_NOT_RECORDED, HANDSHAKE_NOT_VERIFIED, HUB_SCOPE_VIOLATION, IDEMPOTENCY_KEY_CONFLICT, INSUFFICIENT_AUTHORITY, INVALID_CREDENTIALS, MANIFEST_EMPTY, MANIFEST_NOT_STARTED, MARGIN_NOT_CONFIGURED, MFA_ENROLMENT_REQUIRED, MFA_PROOF_INVALID, MFA_REQUIRED, NOTIFICATION_FAILED, NOT_ASSIGNED_RIDER, NOT_CUSTODY_HOLDER, NOT_FOUND, NO_CHARGE_APPLIED, NO_PRICING_CHANGE, NO_REGISTERED_NUMBER, NO_SERVICEABLE_MOTORCYCLE, ORDER_NOT_COMMERCIALLY_CLEARED,
            ORDER_NOT_ON_RUN, ORDER_UNPRICED, OTP_INVALID, OUTBOUND_CHARGE_UNPAID, PARCEL_NOT_ACCEPTABLE, PARCEL_NOT_IN_HUB_CUSTODY, PARITY_NOT_MET, PAYMENT_ALREADY_PENDING, PAYMENT_ALREADY_SETTLED, PAYMENT_AMOUNT_MISMATCH, PAYMENT_COLLECTION_NOT_ALLOWED, PAYMENT_FALLBACK_NOT_VERIFIED, PAYMENT_NOT_CONFIRMED, PAYMENT_PROVIDER_UNAVAILABLE, PAYMENT_STATUS_UNKNOWN, PERIOD_NOT_RECONCILED, PERMISSION_DENIED, PICKUP_ATTEMPT_LIMIT_REACHED, PICKUP_MINIMUM_NOT_MET, RATE_LIMITED, REASON_NOT_ACTIVE, REASON_NOT_VALID_FOR_CHECKPOINT, REASON_REQUIRED, RECIPIENT_NOT_CONFIRMED, RECIPIENT_PAYMENT_OUTSTANDING, RECOVERY_TOKEN_INVALID, REPLACEMENT_REQUIRED, RETURN_FEE_OUTSTANDING, RIDER_UNAVAILABLE, ROAD_EXPENSE_ALREADY_APPLIED, ROAD_EXPENSE_NOT_APPROVED, RUN_ALREADY_STARTED, SELF_APPROVAL_FORBIDDEN, SELF_CANCEL_NOT_PERMITTED_AFTER_ASSIGNMENT, SENDER_IDENTITY_AMBIGUOUS, SENDER_SUSPENDED, SERVICE_DATE_NOT_PERMITTED, SERVICE_WINDOW_OVERRIDE_REASON_REQUIRED, SESSION_INVALID, SESSION_SUPERSEDED, SETTING_INVALID, SETTING_MISSING, SETUP_GRANT_INVALID, SINGLE_PACKAGE_APPROVAL_REQUIRED, SIZE_CLASS_REQUIRED, SMS_FALLBACK_LIMIT_REACHED, SOURCE_STILL_ACTIVE, STATE_CONFLICT, STOPS_UNRESOLVED, STOP_NOT_QUALIFYING, TERMINAL_FOR_STATION_DROP, TRUST_DATA_UNAVAILABLE, VALIDATION_FAILED, VALUE_DECLARATION_REQUIRED, VERIFICATION_FALLBACK_NOT_AUTHORIZED, WAYBILL_REQUIRED, WORK_EMAIL_IN_USE, ZERO_COLLECTION_IS_FAILURE, ZONE_NOT_SERVICED_ON_DATE]
          description: |
            Stable machine code — **the only field a client may branch on**. The enumeration is
            the whole point: errors-and-enums.md 2 calls a rename a breaking contract change, and
            until 23 Aug this was an unconstrained string, so nothing could detect one. A
            withdrawn code is absent here, which is what makes "never reused" structural.
        message:
          type: string
          description: |
            Diagnostic English. Never parsed, never shown to a vendor or rider — display copy
            is mapped from `code` by the surface (§36.13, OQ-037).
        details: { type: object, additionalProperties: true }
        request_id: { type: string }

    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
          description: |
            Minor units — Ghana pesewas. Never a float, never a decimal string. 2550 is GH₵25.50.
        currency:
          type: string
          enum: [GHS]
          description: Only launch currency. Present so multi-currency is a data change.

    Location:
      type: object
      required: [address]
      properties:
        address: { type: string }
        landmark: { type: string }
        map_link: { type: string, format: uri }
        latitude: { type: number }
        longitude: { type: number }
      description: |
        Coordinates are optional and must never be required for validity — the operation runs on
        landmarks and phone calls. Service zone is **resolved from** a location, never stored on
        it, because zones are hub-owned and versioned.

    PickupRequestCreate:
      type: object
      required: [pickup_intent, scheduled_service_date, declared_package_count, default_payer_intent]
      # Gate C R1: MSC-DEC-335's three intents were an enum nothing carried. The intent is
      # now the discriminator, and the invalid combinations are REJECTED rather than
      # tolerated - COLLECT_FOR_VENDOR without a collection point is not a pickup anyone
      # can execute, and OWN_PACKAGES carrying one is mis-declared.
      allOf:
        - if:
            properties: { pickup_intent: { const: OWN_PACKAGES } }
            required: [pickup_intent]
          then:
            required: [vendor_organization_id]
            properties:
              collection_point: { not: {} }
              collection_item: { not: {} }
        - if:
            properties: { pickup_intent: { const: COLLECT_FOR_VENDOR } }
            required: [pickup_intent]
          then:
            required: [vendor_organization_id, collection_point, collection_reference, collection_item]
            # A destination is mandatory. Either supplied here, or resolved to the
            # Vendor's DEFAULT saved location - `collect this from X` with nowhere to take
            # it is not an executable instruction.
            anyOf:
              - required: [destination_location_id]
              - required: [use_vendor_default_destination]
        - if:
            properties: { pickup_intent: { const: COLLECT_FOR_VENDOR } }
            required: [pickup_intent]
          then:
            properties:
              use_vendor_default_destination:
                type: boolean
                description: >-
                  Resolve the destination to the Vendor's default saved location. The
                  server refuses the request if that Vendor has none, rather than
                  accepting a collection with no destination.
        - if:
            properties: { pickup_intent: { const: ADHOC_SENDER } }
            required: [pickup_intent]
          then:
            properties:
              collection_point: { not: {} }
            # Exactly one identity source. A first-time sender has no id to supply, and
            # requiring one made the whole intent unexecutable.
            oneOf:
              - required: [ad_hoc_sender_id]
                properties: { new_ad_hoc_sender: { not: {} } }
              - required: [new_ad_hoc_sender]
                properties: { ad_hoc_sender_id: { not: {} } }
        - if:
            properties: { pickup_intent: { const: ADHOC_SENDER } }
            required: [pickup_intent]
          then:
            # Identity is reusable; today's goods are not. A returning sender is recognised
            # by verified phone, and their LAST shipment's description is not evidence about
            # this box.
            required: [current_item_description]
      properties:
        pickup_intent:
          type: string
          enum: [OWN_PACKAGES, COLLECT_FOR_VENDOR, ADHOC_SENDER]
          description: |
            MSC-DEC-335. OWN_PACKAGES reuses an established Vendor and asks only what
            changes today. COLLECT_FOR_VENDOR collects from a THIRD PARTY for a
            registered Vendor - it is not merchandise COD, and no rider is authorised to
            pay the seller. ADHOC_SENDER creates or REUSES the canonical AdHocSender
            and never auto-promotes it to a registered Vendor.
        vendor_organization_id: { type: string, format: uuid }
        ad_hoc_sender_id:
          type: string
          format: uuid
          description: >-
            An EXISTING AdHocSender, found by verified phone on a return visit. Supply
            this OR new_ad_hoc_sender, never both and never neither.
        new_ad_hoc_sender:
          $ref: '#/components/schemas/NewAdHocSender'
          description: >-
            First-use identity, for a sender who has never used Melarc. Creating the
            reusable profile and the request is one idempotent act.
        collection_point: { $ref: '#/components/schemas/CollectionPoint' }
        collection_reference: { $ref: '#/components/schemas/CollectionReference' }
        collection_item: { $ref: '#/components/schemas/CollectionItem' }
        destination_location_id:
          type: [string, 'null']
          format: uuid
          description: COLLECT_FOR_VENDOR destination - a Vendor saved location or an approved alternative.
        pickup_location:
          $ref: '#/components/schemas/Location'
          description: >-
            The sender's own pickup address. For COLLECT_FOR_VENDOR the collection point
            carries the address instead, and this is omitted.
        current_item_description:
          type: string
          description: >-
            Today's goods - women's shoes, clothes, phone accessories, books. REQUIRED for
            ADHOC_SENDER, because identity is reusable and goods are not. Optional for
            OWN_PACKAGES, where the Vendor's established goods profile satisfies 21.1 and
            an established Vendor is not re-onboarded daily.
        location_overrides:
          $ref: '#/components/schemas/Location'
          description: Transaction override — never updates saved sender defaults (§35.2.6).
        scheduled_service_date:
          type: string
          format: date
          description: Monday–Saturday only (§21.1, MSC-DEC-149). A date, not an instant.
        declared_package_count:
          type: integer
          minimum: 1
          description: |
            Minimum 2 unless an approved one-package exception exists (§35.2.3). Accepting 1 here
            lets the server return `PICKUP_MINIMUM_NOT_MET` with its reason rather than a bare
            schema rejection.
        default_payer_intent:
          type: string
          enum: [RECIPIENT_PAYS, SENDER_PAYS_FULL, SPLIT]
        split_basis: { type: string, enum: [FIXED_AMOUNT, PERCENTAGE] }
        split_sender_amount: { $ref: '#/components/schemas/Money' }
        split_sender_percentage: { type: number, minimum: 0, maximum: 100 }
        declared_value_minor:
          type: integer
          minimum: 0
          description: |
            Declared item value in pesewas. Required above `value_declaration_threshold`
            (23.4, MSC-DEC-212) - declared **at booking**, not at itemization, because booking is
            the last moment the sender can still decline the terms.
        liability_cap_acknowledged:
          type: boolean
          description: |
            The sender acknowledges liability is capped at `liability_cap_amount` **regardless of
            the value declared** (23.4, MSC-DEC-220). Mandatory once `declared_value_minor`
            exceeds the threshold; `VALUE_DECLARATION_REQUIRED` otherwise.

            **No field here states the cap amount, and that is the guard.** The server snapshots
            the cap in force at this moment. A client able to state the cap it acknowledged could
            acknowledge a figure that was never in force - and MSC-DEC-220 exists precisely so the
            customer learns the real limit BEFORE Melarc takes custody, not after a loss.
      description: |
        Carries payer **intent** only. No AUTHORITATIVE price field exists on this schema: the
        authoritative price is still set at itemization, because the size class is selected there
        by the receiving officer and cannot be known at booking.

        The response carries an indicative estimate, and **its composition depends on whether this
        booking has a destination**. A standard multi-package request has none (5.2.1),
        so the estimate is base fee x package count. A **one-package exception** carries a mandatory
        delivery address (21.1): the server resolves the service area and prices from the fee that
        actually applies - in-area, corridor batch day, or **corridor off-day**.

        **The estimate is absent for a known outside-Accra destination.** The carrier's charge is
        unknowable until itemization, and a number invented for it would be worse than
        no number: 23.6, MSC-DEC-175 showed nothing precisely to avoid that.

        It stays provisional either way, for the reason that survives - the size class is selected by
        a receiving officer at itemization.

        **The client sends an address and never a price** (42.3). The server resolves the area.

    PickupRequest:
      # Gate C R1.1: the intent was accepted on POST and lost from the resource, so a
      # caller reading a request could not tell which workflow created it - and
      # COLLECT_FOR_VENDOR's collection point had nowhere to be read back from.
      type: object
      required: [id, code, state, responsible_hub_id, scheduled_service_date, attempt_number]
      properties:
        id: { type: string, format: uuid }
        code:
          type: string
          pattern: '^[A-Z]{3}-(PR|MF|IN|OR|DR)-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{6}$'
          description: |
            Operational code per MSC-DEC-202. The pattern is the contract: an implementation
            emitting a code containing 0, O, 1, I or L fails validation, because these are
            read aloud on phone calls between Ops, riders and vendors.
        state: { type: string, enum: [PENDING, CONFIRMED, DECLINED, CANCELLED] }
        responsible_hub_id: { type: string, format: uuid }
        pickup_intent:
          type: string
          enum: [OWN_PACKAGES, COLLECT_FOR_VENDOR, ADHOC_SENDER]
          description: >-
            The workflow that created this request. Present on every read:
            an intent accepted at creation and absent from the resource is an intent the
            rest of the product cannot act on.
        vendor_organization_id: { type: [string, 'null'], format: uuid }
        ad_hoc_sender_id: { type: [string, 'null'], format: uuid }
        collection_point: { $ref: '#/components/schemas/CollectionPoint' }
        collection_reference: { $ref: '#/components/schemas/CollectionReference' }
        collection_item: { $ref: '#/components/schemas/CollectionItem' }
        destination_location_id:
          type: [string, 'null']
          format: uuid
          description: >-
            Resolved COLLECT_FOR_VENDOR destination. Never null on a COLLECT_FOR_VENDOR
            request: either supplied, or defaulted to the Vendor's default saved location.
        pickup_location:
          oneOf:
            - $ref: '#/components/schemas/Location'
            - type: 'null'
          description: >-
            The sender's OWN address as supplied. Null for COLLECT_FOR_VENDOR, where the
            parcel is at a third party. Read resolved_pickup_location to dispatch a rider.
        resolved_pickup_location:
          allOf:
            - $ref: '#/components/schemas/Location'
          readOnly: true
          description: >-
            THE authoritative place the rider is sent, server-derived from pickup_intent and
            never null: the Vendor's selected or default saved location for
            OWN_PACKAGES, the AdHocSender's for ADHOC_SENDER, and THE COLLECTION POINT for
            COLLECT_FOR_VENDOR. The Vendor's address is where that parcel is GOING.
        current_item_description:
          type: [string, 'null']
          description: >-
            Today's goods, captured on the request. Mandatory for ADHOC_SENDER: a returning
            sender's identity is reusable and last month's shoes are not
            evidence about this box. Optional for OWN_PACKAGES, where the Vendor's business
            goods profile already satisfies the intake requirement. Unused by
            COLLECT_FOR_VENDOR, whose collection_item carries description, quantity and picture.
        scheduled_service_date: { type: string, format: date }
        declared_package_count: { type: integer }
        default_payer_intent: { type: string }
        one_package_exception_id: { type: [string, 'null'], format: uuid }
        attempt_number:
          type: integer
          description: Capped at MELARC_MAX_PICKUP_ATTEMPTS (3) absent a force-extension.
        replaces_request_id: { type: [string, 'null'], format: uuid }
        cancelled_by_actor_type: { type: [string, 'null'], enum: [VENDOR, OPS, null] }
        declared_value_minor: { type: [integer, 'null'] }
        liability_cap_acknowledged_at: { type: [string, 'null'], format: date-time }
        liability_cap_snapshot:
          type: [object, 'null']
          description: |
            The cap **as it stood at acknowledgement** - amount, setting key and effective
            version, per domain model 3.7. Never a pointer to the live setting: a customer who
            acknowledged GH300 acknowledged that figure, and changing the setting later must not
            silently change what they agreed to.
          properties:
            amount_minor: { type: integer }
            setting_key: { type: string }
            effective_version: { type: string }
        cancellation_charge_outcome:
          type: [string, 'null']
          enum: [APPLIED, WAIVED, NOT_APPLIED, UNAVAILABLE, EXEMPT, null]
          description: |
            Non-null for **every** post-assignment cancellation. `UNAVAILABLE` means no charge
            amount is configured — the cancellation still proceeded. A null outcome on
            a post-assignment cancellation is indistinguishable from an unrecorded decision,
            which is what MSC-DEC-197 exists to prevent.
        cancellation_charge:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Set only when the outcome is `APPLIED`. Snapshotted per domain-model §3.7.
        created_at: { type: string, format: date-time }
        confirmed_at: { type: [string, 'null'], format: date-time }

    Approval:
      type: object
      required: [id, state, requested_by]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [REQUESTED, APPROVED, REJECTED] }
        requested_by: { type: string, format: uuid }
        approved_by: { type: [string, 'null'], format: uuid }
        reason_code: { type: string }
        note: { type: string }
      description: |
        The uniform maker-checker record (§37.4, MSC-DEC-135). `approved_by` may never equal
        `requested_by`.

    ContactAttempt:
      type: object
      required: [attempted_at, outcome]
      properties:
        attempted_at: { type: string, format: date-time }
        outcome: { type: string }
      description: Persisted, never kept only in transient UI state (§35.7.2).

    CollectionRecordCreate:
      type: object
      required: [collected_count, handshake_type]
      additionalProperties: false
      properties:
        collected_count:
          type: integer
          minimum: 0
          description: Zero is a failed pickup — `ZERO_COLLECTION_IS_FAILURE` (§36.4).
        variance_reason_code:
          type: string
          description: |
            Required when `collected_count < declared_count`. Its metadata may make a note or
            photo mandatory in turn (§35.9.2). Absent on a short count → `REASON_REQUIRED`.
        variance_note: { type: string }
        handshake_type:
          type: string
          enum: [VENDOR_ENTERED_RIDER_DISPLAYED, SENDER_SMS_RIDER_ENTERED]
          description: |
            Direction is fixed by 21.4, MSC-DEC-114–115 and may not be reversed: registered vendors
            enter a rider-displayed code; ad-hoc senders receive an SMS code the rider enters.
        handshake_channel:
          type: string
          enum: [PORTAL, SMS_FALLBACK, OPS_OVERRIDE]
          default: PORTAL
          description: |
            Which rung of the fallback ladder verified the handshake. **Recorded
            on every handshake, not only fallbacks** — the control is that persistent fallback
            use becomes visible, and a ratio needs both terms.
        evidence_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            Each id must name an evidence record in `STORED` (EVIDENCE_NOT_STORED otherwise).
        captured_at:
          type: string
          format: date-time
          description: |
            Field capture time, distinct from upload time. Preserved on sync along with ordering
            and conflict status (§35.3.9).

    CollectionRecord:
      allOf:
        - $ref: '#/components/schemas/CollectionRecordCreate'
        - type: object
          required: [id, pickup_stop_id, declared_count, variance]
          properties:
            id: { type: string, format: uuid }
            pickup_stop_id: { type: string, format: uuid }
            declared_count: { type: integer, description: 'As stated by the sender at the door.' }
            variance:
              type: string
              enum: [MATCH, SHORT]
              description: |
                Present on every collection, not only partials — a clean count is a recorded
                outcome, not an absence.
            office_notified_at:
              type: [string, 'null']
              format: date-time
              description: Set when the shortfall flag reached the Ops surface.

    PickupStop:
      type: object
      required: [id, pickup_manifest_id, pickup_request_id, sequence, state]
      properties:
        id: { type: string, format: uuid }
        pickup_manifest_id: { type: string, format: uuid }
        pickup_request_id: { type: string, format: uuid }
        sequence: { type: integer, description: 'Manual ordering — no route optimization (§35.3.2).' }
        state:
          type: string
          enum: [PENDING, ARRIVED, COLLECTED, PARTIALLY_COLLECTED, FAILED, SKIPPED]

    HubIntakeBase:
      type: object
      required: [id, code, state, hub_id, pickup_request_id, pickup_manifest_id, handed_over_by, handed_over_at, declaration_captured_at, count_phase]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        hub_id: { type: string, format: uuid }
        pickup_request_id: { type: string, format: uuid }
        pickup_manifest_id:
          type: string
          format: uuid
          description: The run whose hub handover opened this intake.
        handed_over_by:
          type: string
          format: uuid
          description: The custody holder who submitted the handover - the assigned rider, or whoever accepted a RunCustodyHandover.
        handed_over_at:
          type: string
          format: date-time
          description: Server receipt of the handover.
        declaration_captured_at:
          type: string
          format: date-time
          description: When the rider made the declaration on the device - distinct from handed_over_at.
        active_receiver_id:
          type: [string, 'null']
          format: uuid
          description: The receiver holding the advisory lock (§22.8), if anyone does.
        lock_acquired_at:
          type: [string, 'null']
          format: date-time
        state:
          type: string
          enum: [AWAITING_COUNT, COUNTED, RECONCILIATION_REQUIRED, READY_FOR_ITEMIZATION, ITEMIZING, CLOSED]
        count_phase: { type: string, enum: [PRE_COUNT, POST_COUNT] }

    HubIntakePreCount:
      allOf:
        - $ref: '#/components/schemas/HubIntakeBase'
        - type: object
          properties:
            count_phase: { const: PRE_COUNT }
      description: |
        **Deliberately has no `rider_declared_count` property.** This absence is the blind-count
        guarantee (§35.5.2, §43.2). Adding the field to this schema — even nullable, even
        "hidden by the UI" — breaks the contract.

    HubIntakePostCount:
      allOf:
        - $ref: '#/components/schemas/HubIntakeBase'
        - type: object
          required: [rider_declared_count, physical_count, count_variance, condition]
          properties:
            count_phase: { const: POST_COUNT }
            rider_declared_count: { type: integer }
            physical_count: { type: integer }
            count_variance:
              type: string
              enum: [MATCH, SHORT, OVER]
              description: |
                The comparison **outcome**, not the number. An enum because condition and dispute
                findings must be recordable even at `MATCH` (§35.5.4).
            count_difference: { type: integer, description: 'Signed numeric difference.' }
            condition:
              type: string
              enum: [OK, DAMAGED, TAMPERED, OTHER]
              description: |
                **HIGH-11 audit remediation, nullability corrected on review.** The fixed
                four-value classification domain-model.md's `PickupIntake.condition` defines and
                §22.5 requires — previously readable only by inspecting `condition_findings`'
                untyped contents, with no field stating the classification itself. Independent of
                `count_variance` (§35.5.4). **Non-nullable and required in this post-count
                projection**, because domain-model.md records the column as `Null: no` — it always
                carries one of the four values, `OK` included. *Superseded shape:* declared
                nullable with `null` in the enum, which contradicted that authority.
            condition_findings:
              type: array
              items: { type: object, additionalProperties: true }
              description: |
                Detail behind a non-`OK` condition — evidence and adjudication notes, not the
                classification itself, which is `condition` above. Independent of count_variance —
                the three OS&D dimensions never collapse.
            dispute_state: { type: [string, 'null'] }
            parity_exception_id: { type: [string, 'null'], format: uuid }

    OrderItemize:
      type: object
      required: [recipient, size_class]
      additionalProperties: false
      properties:
        recipient:
          type: object
          required: [name, phone, location]
          properties:
            name: { type: string }
            phone: { type: string, description: 'E.164, normalised. As-entered form retained server-side.' }
            location: { $ref: '#/components/schemas/Location' }
        size_class:
          type: string
          enum: [SMALL, MEDIUM, LARGE]
          description: |
            Selected by the receiving officer, not derived. MSC-DEC-209 establishes no weight or
            dimension thresholds, so no server rule can compute this. Surcharges apply only in
            MELARC_COVERED_THIRD_PARTY_DELIVERY; SMALL is always GH0.
        carrier_cost:
          $ref: '#/components/schemas/Money'
          description: |
            The third-party carrier's ACTUAL charge, transcribed from their waybill. Required
            exactly when commercial_mode is MELARC_COVERED_THIRD_PARTY_DELIVERY; rejected otherwise.
            This is an OBSERVED COST, not a price. The server still computes the price by applying
            the hub's configured margin. See the schema description below.
        is_high_value: { type: boolean, default: false }
        lane: { type: string, enum: [DOORSTEP, THIRD_PARTY_HANDOFF] }
        commercial_mode:
          type: string
          enum: [STATION_DROP, MELARC_COVERED_THIRD_PARTY_DELIVERY]
          description: Required exactly when lane is THIRD_PARTY_HANDOFF.
        payer_override:
          type: object
          description: Parcel-level override of the request's default intent (§5.2).
      description: |
        **No price and no destination zone.** Both are server-derived (§35.6.6, §42.3). A client
        that could send either could set its own price.

        `carrier_cost` is the one monetary value a client may submit, and it is deliberately not
        an exception to that rule. A price is a decision; a carrier cost is an observation with a
        waybill behind it. The client cannot influence the margin, the size surcharge or the total
        — the server applies the hub's configured margin to whatever cost is submitted, and the
        submitted figure is audited against the evidence.

        Had outside-Accra been quoted freely, as first proposed, this schema would have needed a
        settable price field — which would have dismantled the guard entirely.

    Order:
      type: object
      required: [id, code, commercial_state, fulfilment_state, size_class, lane]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        pickup_intake_id: { type: string, format: uuid }
        responsible_hub_id: { type: string, format: uuid }
        commercial_state:
          type: string
          enum: [PRICED, PAYMENT_REQUIRED, CREDIT_RESERVED, NO_VENDOR_CHARGE, PREPAID, CLOSED, REVERSED]
          description: |
            NO_VENDOR_CHARGE means the resolved vendor portion was zero, so the
            commercial gate had nothing to test. It is **not** a payment and **not** a
            reservation: counting it as revenue, as prepayment, or as consumed exposure is
            wrong in three different reports.
        fulfilment_state:
          type: string
          enum:
            [AWAITING_RECIPIENT_CONFIRMATION, READY_FOR_DISPATCH, ASSIGNED, OUT_FOR_DELIVERY,
             DELIVERED, ATTEMPT_FAILED, AT_HUB_AFTER_FAILURE, READY_FOR_REATTEMPT,
             HANDED_TO_CARRIER, RETURN_TO_VENDOR_IN_PROGRESS, RETURNED_TO_VENDOR]
        origin_zone_snapshot: { type: object, additionalProperties: true }
        destination_zone_snapshot: { type: object, additionalProperties: true }
        size_class: { type: string, enum: [SMALL, MEDIUM, LARGE] }
        size_class_selected_by: { type: [string, 'null'], format: uuid }
        carrier_cost: { $ref: '#/components/schemas/Money' }
        derived_delivery_date: { type: [string, 'null'], format: date }
        is_high_value: { type: boolean }
        lane: { type: string }
        commercial_mode: { type: [string, 'null'] }
        locked_price: { $ref: '#/components/schemas/Money' }
        price_components_snapshot:
          type: object
          additionalProperties: true
          description: |
            Each component carries HUB, setting key, effective version and value. Components:
            service-area base fee OR corridor off-day fee OR station-drop fee; size-class
            surcharge and carrier cost plus applied margin (third-party mode only).

            The HUB is part of each component since MSC-DEC-218 made fees hub-scoped. Version
            counters are per hub and collide — service_area_base_fee v3 is GH35 in Accra and may
            be GH45 in Kumasi — so key plus version no longer identifies a value on its own
            (§35.1.5, domain-model §3.7).
        delivery_attempt_count: { type: integer, maximum: 3 }
      description: |
        Two orthogonal state fields, not one (domain-model §5.9). An order may be commercially
        `PREPAID` while physically `AT_HUB_AFTER_FAILURE`; its commercial standing does not move
        as it travels.

    PickupManifestCreate:
      type: object
      required: [pickup_request_ids, service_date]
      additionalProperties: false
      properties:
        pickup_request_ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        service_date: { type: string, format: date }
      description: |
        No rider and no sequence at creation. Both are separate, separately permissioned steps
        because each carries its own rule — sequencing is manual, assignment closes vendor
        cancellation.

    PickupManifest:
      type: object
      required: [id, code, state, service_date, responsible_hub_id]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        state:
          type: string
          enum: [DRAFT, DISPATCHED, IN_PROGRESS, COMPLETED, CANCELLED]
          description: >-
            state-machines.md 4, SIGNED at MSC-DEC-233. **Rider assignment is not a state.** It is
            an action that sets assigned_rider_id and assigned_at and leaves the manifest DRAFT -
            MSC-DEC-195 makes that field the vendor self-cancellation cutoff, so the moment is
            recorded on the record rather than inferred from a state. A manifest is therefore DRAFT
            both before and after a rider is assigned, and leaves DRAFT only at dispatch.
            **ASSIGNED was removed at MSC-DEC-405**, where this enum carried six values
            against five in the signed machine, five in domain-model.md 6.3, five in
            errors-and-enums.md's enum index, and five in this file's own DeliveryRun - which
            state-machines.md 12 specifies as mirroring this machine.
        service_date: { type: string, format: date }
        responsible_hub_id: { type: string, format: uuid }
        assigned_rider_id: { type: [string, 'null'], format: uuid }
        assigned_at: { type: [string, 'null'], format: date-time }
        dispatched_at: { type: [string, 'null'], format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        stops:
          type: array
          items: { $ref: '#/components/schemas/PickupStop' }
      description: |
        **Hub-scoped, never vendor-scoped** (domain-model §4). A manifest spans vendors, so
        applying a vendor filter to it would leak one vendor's existence to another or return
        an incoherent partial manifest. A vendor sees their stop, never this.

        `assigned_at`, `dispatched_at` and `started_at` are three distinct moments and are
        stored separately because each governs a different rule.

    ManifestStopOrder:
      type: object
      required: [ordered_stop_ids]
      additionalProperties: false
      properties:
        ordered_stop_ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
      description: |
        The complete sequence, not a delta. Manual ordering only — Version 1 has no route
        optimisation and the sequence is a plan a rider may depart from.

    RiderAssignment:
      type: object
      required: [rider_id]
      additionalProperties: false
      properties:
        rider_id: { type: string, format: uuid }

    HubHandoverSubmit:
      type: object
      required: [rows, captured_at]
      additionalProperties: false
      properties:
        rows:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/HubHandoverRow' }
          description: |
            Exactly the run's collected pickup requests, each once. Anything else is
            VALIDATION_FAILED, naming the row.
        captured_at:
          type: string
          format: date-time
          description: |
            When the rider made the declaration on the device - the field time, distinct from the
            server's receipt (§35.3.9). Recorded on each intake as declaration_captured_at.
        note: { type: string }
      description: |
        One row per collected pickup request (§22.2, MSC-DEC-416), each pre-filled from that
        request's collected total and correctable before submission. Each row is stored on its
        intake as `rider_declared_count` and **withheld from every pre-count response**.
        *Superseded shape:* one `declared_count` for the whole run.

    HubHandoverRow:
      type: object
      required: [pickup_request_id, declared_count]
      additionalProperties: false
      properties:
        pickup_request_id: { type: string, format: uuid }
        declared_count:
          type: integer
          minimum: 0
          description: |
            The parcels the rider hands over for this request. **Zero is legal**: the request's
            intake still opens, and is routed to reconciliation after the blind count.

    Handshake:
      type: object
      required: [stop_id, state]
      properties:
        stop_id: { type: string, format: uuid }
        state:
          type: string
          enum: [PENDING, SENT, VERIFIED, EXPIRED, ATTEMPTS_EXHAUSTED, OVERRIDDEN, FAILED, CANCELLED]
        channel:
          type: [string, 'null']
          enum: [PORTAL, SMS, OPS_OVERRIDE, null]
        attempts: { type: integer }
        expires_at: { type: [string, 'null'], format: date-time }
        fallback_used: { type: boolean }
        authorised_by: { type: [string, 'null'], format: uuid }
      description: |
        **The code value never appears on this schema.** It is displayed to the rider at
        generation and never returned, logged, or written to an audit event. Audit records that
        a code was generated, never its value (§20.4, audit §9).

        `channel` is recorded on every path including the primary one, so that persistent
        fallback use is measurable rather than anecdotal.

    HandshakeVerify:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string }

    HandshakeOverride:
      type: object
      required: [reason_code, verification_note]
      additionalProperties: false
      properties:
        reason_code: { type: string }
        verification_note:
          type: string
          description: How Ops verified the vendor by other means. Mandatory.

    DiscrepancyAdjudication:
      type: object
      required: [outcome, reason_code]
      additionalProperties: false
      properties:
        outcome:
          type: string
          enum: [ACCEPTED, ESCALATED, WRITTEN_OFF, VENDOR_NOTIFIED]
        condition:
          type: string
          enum: [OK, DAMAGED, TAMPERED, OTHER]
          description: |
            **HIGH-11 audit remediation — the fixed four-value enum, matching domain-model.md's
            `PickupIntake.condition` and §22.5 exactly.** Valid on a MATCH variance; damage,
            tampering or dispute may be recorded independently of count. `DAMAGED` and `TAMPERED`
            require `evidence_ids` and route to Senior Ops. *Superseded enum:* `[INTACT, DAMAGED]`
            — two of the four approved values, `TAMPERED` and `OTHER`, could not be submitted
            through this operation at all, and `AC-SLICE-001-42` was not executable as written.
        evidence_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            **HIGH-11 audit remediation.** Required (`REASON_REQUIRED`) when `condition` is
            `DAMAGED` or `TAMPERED` (§22.5). Each id must name an evidence record in `STORED` —
            a `PENDING_UPLOAD` record is rejected with `EVIDENCE_NOT_STORED`, the same guard every
            other evidence-accepting operation carries.
        reason_code: { type: string }
        note: { type: string }
      description: |
        Adjudication never rewrites the counts. The declared count, the hub count and the
        variance survive it unchanged — this explains a discrepancy, it does not erase one.

    StaffSignIn:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password:
          type: string
          maxLength: 128
          description: |
            Capped at 128 so a hash is never asked to chew an unbounded input. **No minimum is checked here**:
            a short guess is a wrong password, answered `INVALID_CREDENTIALS` like any other.

    RiderSignIn:
      type: object
      required: [phone, pin, challenge, device_signature, client_root_signal]
      additionalProperties: false
      properties:
        phone: { type: string, description: 'E.164, normalised.' }
        pin: { type: string, pattern: '^[0-9]{6}$', description: 'Six numeric digits, a fixed policy that this schema makes structural.' }
        challenge: { type: string, description: The one-use nonce from requestRiderSignInChallenge }
        device_signature: { type: string, description: Signature over the challenge by the registered non-exportable private key }
        client_root_signal:
          type: string
          enum: [NOT_DETECTED, DETECTED, UNKNOWN]
          description: |
            The Rider app's own root-detection result.
            **Producer:** the app, at sign-in, which sends one of the three values and sends
            `UNKNOWN` when it could not establish a result. **Consumer:** the backend, which records
            it on the session and in the audit trail (`auth.session.issued`) for Ops follow-up.
            **It is never an authentication control.** `DETECTED` does not by itself block sign-in,
            `NOT_DETECTED` is not evidence that the device is trustworthy, and no value relaxes
            another check. The check runs in the process an attacker controls, which is why it
            records and does not refuse. Required, so that a missing value is a protocol error and
            not an unreported result.

    VendorSignIn:
      type: object
      required: [account_identifier, secret]
      additionalProperties: false
      properties:
        account_identifier:
          type: string
          maxLength: 64
          description: |
            The vendor account's own identifier (`VendorAccount.account_identifier`): server-generated,
            human-typeable, **not a secret**. Ops reads it from `getVendorAccount` and the vendor is told it
            in the setup message.
        secret:
          type: string
          maxLength: 128
          description: |
            Capped at 128 so a hash is never asked to chew an unbounded input. No minimum is checked here.

    MfaChallenge:
      type: object
      required: [challenge_id, expires_at]
      additionalProperties: false
      properties:
        challenge_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
      description: |
        Returned instead of a Session when the role requires a second factor. **Grants nothing.**
        It is not a partial session and carries no authority; the session is created only when the
        factor is accepted.

    MfaSignInComplete:
      type: object
      required: [challenge_id, code]
      additionalProperties: false
      properties:
        challenge_id: { type: string, format: uuid }
        code: { type: string }

    SessionRevoke:
      type: object
      required: [reason_code]
      additionalProperties: false
      properties:
        reason_code: { type: string }
        note: { type: string }

    Session:
      type: object
      required: [id, principal_type, state, expires_at]
      properties:
        id: { type: string, format: uuid }
        principal_type:
          type: string
          enum: [STAFF, RIDER, VENDOR]
        principal_id: { type: string, format: uuid }
        state:
          type: string
          enum: [ACTIVE, TERMINATED]
        authorized_hub_ids:
          type: array
          items: { type: string, format: uuid }
        registered_device_id: { type: [string, 'null'], format: uuid }
        issued_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: 'Absolute expiry, per-tier.'
        last_activity_at:
          type: string
          format: date-time
          description: |
            Basis for the browser idle timeout. The approved 30/15-minute idle limits
            had NO field to evaluate against before Gate A, so an approved control was
            unimplementable. Non-null for EVERY session and initialised at issue (R1). Rider sessions record it and
            are never terminated by it - the rider exemption is from EVALUATION, not from recording.
        termination_reason:
          type: [string, 'null']
          enum: [SIGNED_OUT, SUPERSEDED_BY_NEW_LOGIN, REPLACED_BY_NEW_SESSION, EXPIRED, CREDENTIAL_CHANGED, SUSPENDED, OFFBOARDED, ADMIN_REVOKED, AUTHORITY_CHANGED, HUB_SCOPE_CHANGED, DEVICE_REVOKED, DEVICE_REPLACED, MFA_RESET, null]
      description: |
        **No session credential appears on this schema, ever**, and only its hash (`token_hash`) is
        persisted. Transport is now DEFINED rather than deferred: an HttpOnly, Secure,
        SameSite=Lax cookie for the browser surfaces and an opaque Bearer secret in Android secure
        storage for Melarc Rider.

        **The precise rule**: a raw Session credential never appears in an ORDINARY
        Session resource representation - this schema, getCurrentSession, any listing. Browser
        credentials travel only as Set-Cookie. **Rider Session issuance returns the opaque Bearer
        credential exactly once**, through the dedicated RiderSessionIssued response, because a
        native client has no Set-Cookie equivalent and there is no other moment at which it can
        receive it.

        *Superseded phrasing:* "never in a response body" - which read as an absolute and was
        contradicted by the one response that must return it. The distinction is between a
        RESOURCE representation and an ISSUANCE response, not between bodies and headers.

        Never in a log and never in an audit event, in every case. Audit records that a session
        was issued, not its material - the same rule 20.4 applies to OTPs.

        **No bundle contents either.** The session snapshots the bundle server-side so authority
        is evaluated against what was held at issue; publishing it would invite a client to
        decide its own permissions from it. A client asks the server what it may do.

        There is no elevation field. MSC-DEC-228 makes MFA a sign-in gate for Senior Ops and
        Platform Admin, so a session that exists is already privileged to whatever its bundle allows.

    DeviceRevocation:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          description: Why the binding is being revoked - lost, stolen or otherwise compromised. Audited. Replacement is not a revocation reason; a handset replaced through reregisterRiderDevice leaves REPLACED, and the two stay distinguishable.
      description: |
        **No device identifier and no replacement device appear on this schema, and that is the
        guard.** The rider is the subject; the binding to revoke is whichever one is current.

        A schema that accepted a replacement device would collapse revocation and re-registration
        into one call - and with it the asymmetry MSC-DEC-235 is built on, where revoking is
        unverified because it grants nothing and re-registering is gated because it grants
        everything. One operation doing both would have to be gated at the higher level, which
        is exactly what makes reporting a loss slow.

    PickupEscalation:
      type: object
      required: [reason_code]
      additionalProperties: false
      properties:
        reason_code: { type: string }
        note: { type: string }
      description: |
        **No `resolution` field, and that is deliberate.** Escalation is the terminal Ops
        resolution; reschedule and cancel are `cancelPickupRequest`. Collapsing all three into
        one enum-carrying endpoint would put the escalation-only rule for `REFUSED_COLLECTION`
        behind a runtime branch instead of behind a separate permissioned call.

    AttemptExtension:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          description: Mandatory and immutable once recorded (21.6, MSC-DEC-116).
      description: |
        **No `new_ceiling` field.** The extension is granted for this request, once; it is not a
        per-request configuration value. A settable ceiling would let one Senior Ops action
        create an effectively uncapped request, which is what the cap exists to prevent.

    CancellationChargeWaiver:
      type: object
      required: [reason_code]
      additionalProperties: false
      properties:
        reason_code: { type: string }
        note: { type: string }
      description: |
        **No `amount` field.** A waiver removes the applied charge in full or is not a waiver.
        A partial waiver would be a repricing of a snapshotted charge, which 3.7 forbids.

    RunCustodyHandoverCreate:
      type: object
      required: [reason_code]
      additionalProperties: false
      properties:
        to_rider_id: { type: string, format: uuid }
        to_hub_id: { type: string, format: uuid }
        reason_code: { type: string }
        note: { type: string }
      description: |
        **Exactly one of `to_rider_id` and `to_hub_id` is set**, and the schema carries no field for the
        original rider. A handover names where custody is **going**; where it comes **from** is read
        from the run. A settable origin would be a rider-ID edit wearing another name, and 36.14 forbids
        that outright because completed-stop attribution depends on it.

    RunCustodyHandoverAccept:
      type: object
      required: [parcel_count_taken]
      additionalProperties: false
      properties:
        parcel_count_taken:
          type: integer
          minimum: 0
          description: |
            What the receiver physically took. **A custody record, not a count.** The hub blind count
            runs independently at intake and is never seeded from this figure.

    RunCustodyHandover:
      type: object
      properties:
        id: { type: string, format: uuid }
        manifest_id: { type: string, format: uuid }
        from_rider_id: { type: string, format: uuid }
        to_rider_id: { type: [string, 'null'], format: uuid }
        to_hub_id: { type: [string, 'null'], format: uuid }
        state: { type: string, enum: [PENDING, COMPLETED, FAILED] }
        parcel_count_taken: { type: [integer, 'null'] }
        initiated_at: { type: string, format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }

    RecoveryRequestCreate:
      type: object
      required: [principal_type, identifier]
      additionalProperties: false
      properties:
        principal_type:
          type: string
          enum: [STAFF, VENDOR]
        identifier:
          type: string
          description: |
            The account identifier or work email. **Not a destination.** The channel is resolved
            from the principal's registered contact; nothing here influences where the token goes.
      description: |
        **No destination field exists on this schema, and that is the guard.** A recovery request
        that could name its own delivery address is a redirect waiting to happen. RIDER is absent
        from the enum by design — there is no rider self-service path.

    RecoveryComplete:
      type: object
      required: [token, new_credential]
      additionalProperties: false
      properties:
        token: { type: string }
        new_credential:
          type: string
          minLength: 12
          maxLength: 128
          description: |
            12 to 128 characters, counted in Unicode code points after NFKC normalisation.
            Spaces are permitted and no composition rule applies: no mandatory case, digit or symbol.
            Never trimmed, truncated or echoed. Argon2id-hashed server-side.
            `minLength` and `maxLength` check the string as sent and are a pre-filter; the service
            applies the rule after normalisation and is the authority (Gate PD-3R2).

    CredentialRecoveryInitiation:
      type: object
      required: [reason_code]
      additionalProperties: false
      properties:
        reason_code: { type: string }
        note: { type: string }
      description: |
        Replaces the polymorphic `OpsRecovery` (Gate PD-3R1, `PDA-62`). **No `principal_type`, no
        `principal_id`**: the path already names the staff member or vendor account, so the body
        carried two fields no operation read and one of them could disagree with the path. Taken by
        `recoverStaffCredential` and `recoverVendorCredential`, which each create a `RecoveryRequest`.

    RiderDeviceReregistration:
      type: object
      required: [reason_code, verification_note]
      additionalProperties: false
      properties:
        reason_code: { type: string }
        verification_note:
          type: string
          minLength: 1
          description: |
            How Senior Ops verified the rider's identity in person. **Required**, because the rider's
            recovery path is a human verification step and the audit record must say how it was done.
      description: |
        Taken by `reregisterRiderDevice` only. The path names the rider; **no device identifier and no
        principal fields** appear.

    RiderSummary:
      type: object
      required: [id, full_name, phone, status, primary_hub_id, pin_established, has_active_device]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        phone: { type: string, description: 'E.164, normalised.' }
        status: { type: string, enum: [ACTIVE, INACTIVE, TEMPORARILY_UNAVAILABLE, SUSPENDED, OFFBOARDED] }
        primary_hub_id: { type: string, format: uuid }
        pin_established: { type: boolean, description: 'Whether the rider has set a PIN. The PIN itself is never represented.' }
        has_active_device: { type: boolean, description: 'Whether exactly one `ACTIVE` RegisteredDevice exists.' }
      description: |
        Entity at domain-model.md 6.8 (`RiderIdentity`). **Identity and readiness only**: no PIN, no
        public key, no failed-attempt count and nothing about the rider's work. A rider is
        authentication-ready when `status` is `ACTIVE`, `pin_established` and `has_active_device` are both
        true. Rider *administration* (onboarding, suspension, offboarding) is `SLICE-009`; this is the read
        the device operations need to find their target.

    RiderDetail:
      type: object
      required: [rider, devices]
      properties:
        rider: { $ref: '#/components/schemas/RiderSummary' }
        devices:
          type: array
          items: { $ref: '#/components/schemas/RegisteredDevice' }
          description: Every device the rider has held, `ACTIVE`, `REPLACED` and `REVOKED`, newest first.
      description: |
        The record `getRider` returns, with the `ETag` that `reregisterRiderDevice` takes as `If-Match`.
        Neither secret a device holds is represented (see RegisteredDevice).

    VendorAccountSummary:
      type: object
      required: [id, account_identifier, vendor_organization_id, legal_name, responsible_hub_id, status, credential_established, active_device_count, has_recovery_email, has_recovery_phone]
      properties:
        id: { type: string, format: uuid }
        account_identifier: { type: string, description: 'What the vendor types at sign-in. Not a secret.' }
        vendor_organization_id: { type: string, format: uuid }
        legal_name: { type: string }
        responsible_hub_id: { type: string, format: uuid, description: "The linked VendorOrganization's responsible hub - the value the caller's scope is decided on (MSC-DEC-442; domain-model.md 6.16)." }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        credential_established: { type: boolean, description: 'Whether the vendor has set a shared secret. The secret is never represented.' }
        active_device_count: { type: integer, minimum: 0 }
        has_recovery_email: { type: boolean }
        has_recovery_phone: { type: boolean }
      description: |
        Entity at domain-model.md 6.8 (`VendorAccount` and `VendorCredential`). **Authentication
        status only.** The recovery channel is shown as *whether* one exists and never as an address,
        so a reader learns that a grant can be delivered without learning where.

    VendorAccountDetail:
      type: object
      required: [account, devices]
      properties:
        account: { $ref: '#/components/schemas/VendorAccountSummary' }
        devices:
          type: array
          items: { $ref: '#/components/schemas/RegisteredDevice' }
      description: |
        The record `getVendorAccount` returns, with the `ETag` that `recoverVendorCredential` and
        `reissueVendorCredentialSetup` take as `If-Match`.

    RecoveryRequest:
      type: object
      required: [id, principal_type, channel, state, expires_at]
      properties:
        id: { type: string, format: uuid }
        principal_type:
          type: string
          enum: [STAFF, RIDER, VENDOR]
        channel:
          type: string
          enum: [EMAIL, SMS, OPS_VERIFIED]
        state:
          type: string
          enum: [PENDING, CONSUMED, EXPIRED, SUPERSEDED]
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        consumed_at: { type: [string, 'null'], format: date-time }
        initiated_by: { type: [string, 'null'], format: uuid }
      description: |
        **The token never appears here.** Not on issue, not on read, not in an audit event — the
        same rule 20.4 applies to OTPs. A response carrying a recovery token would put it in logs,
        proxies and browser history.

        `initiated_by` is null for self-service and holds the authorising actor otherwise.

    SetupGrantReissue:
      type: object
      required: [reason_code]
      additionalProperties: false
      properties:
        reason_code: { type: string }
        note: { type: string }
      description: |
        MED-10 audit remediation. **No `purpose` or `principal_type` field** — both are fixed by
        which reissue operation is called and the target named in the path, exactly as
        CancellationChargeWaiver carries no amount. A settable purpose would let this operation
        issue a grant for an act the caller was never authorised to reissue.

    SetupGrant:
      type: object
      required: [id, principal_type, principal_id, purpose, state, issued_at]
      properties:
        id: { type: string, format: uuid }
        principal_type:
          type: string
          enum: [STAFF, RIDER, VENDOR]
        principal_id: { type: string, format: uuid }
        purpose:
          type: string
          enum: [STAFF_CREDENTIAL_SETUP, MFA_ENROLMENT, MFA_REENROLMENT, BOOTSTRAP_SETUP,
                 RIDER_DEVICE_ENROLMENT, RIDER_DEVICE_REREGISTRATION, VENDOR_CREDENTIAL_SETUP,
                 VENDOR_DEVICE_ENROLMENT]
        state:
          type: string
          enum: [PENDING, CONSUMED, EXPIRED, SUPERSEDED]
        issued_at: { type: string, format: date-time }
        expires_at:
          type: [string, 'null']
          format: date-time
          description: Null only for BOOTSTRAP_SETUP, which has no expiry
        consumed_at: { type: [string, 'null'], format: date-time }
      description: |
        MED-10 audit remediation — the first API-exposed shape for domain-model.md §6.8's
        `SetupGrant`, which existed as a signed entity and a signed machine (state-machines.md §19,
        MSC-DEC-274) with no schema a response could reference. **The token never appears here**,
        for the identical reason `RecoveryRequest` above omits it — never on issue, on read, or in
        an audit event (20.4).

    ConfirmationAttempt:
      type: object
      required: [outcome]
      additionalProperties: false
      properties:
        outcome:
          type: string
          enum: [confirmed, reschedule, address_correction, unreachable]
        reason_code:
          type: string
          description: >-
            **Mandatory on `unreachable` and not carried on the other three**. Must
            be an ACTIVE RECIPIENT_CONTACT reason whose validCheckpoints include PRE_DISPATCH -
            REASON_REQUIRED without one, REASON_NOT_VALID_FOR_CHECKPOINT for a reason seeded
            elsewhere. **The four outcomes map onto domain-model.md 6.12's two**: confirmed,
            reschedule and address_correction are SUCCESSFUL contacts - the person WAS reached,
            and a reschedule or a correction is a held order rather than a failed call, recorded
            by delivery_commitment_id or location_change_request_id - while unreachable is the
            UNSUCCESSFUL one. **Added at MSC-DEC-409**: state-machines.md 11's SIGNED
            AWAITING_ATTEMPT to ATTEMPTED_NO_ANSWER row guards on "an active PRE_DISPATCH reason",
            this operation has always declared REASON_REQUIRED, and the schema had no field to
            carry one. The seeded five are NO_ANSWER, NUMBER_INCORRECT, RECIPIENT_DECLINED,
            RECIPIENT_NOT_AT_LOCATION (DOORSTEP only, so not selectable here) and
            CONTACT_NOT_POSSIBLE_MELARC.
        refined_location_note:
          type: string
          description: |
            Captured on the call and **copied onto the delivery stop** (24.2, 24.4). This is often
            the only thing standing between a rider and a wasted attempt in an area without
            addresses.
        corrected_address:
          $ref: '#/components/schemas/Location'
        note: { type: string }
      description: |
        One attempt, one record. **Not a counter increment** - 24.2 requires attempts persisted
        rather than "kept only in transient UI state", and a count cannot say when or what happened.

        A corrected_address that resolves to a different SERVICE AREA after price freeze triggers
        the 35.6.8 repricing path; it does not silently reprice.

    RecipientConfirmationEscalation:
      type: object
      required: [reason_code]
      additionalProperties: false
      properties:
        reason_code: { type: string }
        note: { type: string }
      description: |
        **No attempt count and no threshold.** Escalation is Ops judgement that the contact avenues
        are exhausted; a field carrying a count would reintroduce the retired ceiling
        as a request parameter. The attempt rows are the evidence, and the reason is mandatory.

    OperationalPaymentDemand:
      type: object
      required: [id, currency, total_due_minor, status, lines]
      properties:
        id: { type: string, format: uuid }
        payer_type: { type: string, enum: [RECIPIENT, VENDOR], readOnly: true }
        order_id: { type: [string, 'null'], format: uuid, readOnly: true }
        currency: { type: string, enum: [GHS], readOnly: true }
        total_due_minor:
          type: integer
          readOnly: true
          description: >-
            THE SUM OF THE LINES, server-computed and never supplied. A redelivery is
            3500 + 2000 = 5500 - one prompt, not two.
        status:
          type: string
          enum: [OPEN, PARTIALLY_SETTLED, SETTLED, VOID]
          readOnly: true
          description: >-
            OPEN: nothing confirmed yet. PARTIALLY_SETTLED: confirmed_receipts_minor is
            GREATER THAN ZERO and LESS THAN total_due_minor, and NO line allocation has been
            finalised - the demand is partially FUNDED, not partially settled.
            SETTLED: cumulative principal reached the total and every frozen line was
            allocated its exact amount in one act. VOID: the obligations were withdrawn.
            IT IS NOT DERIVED FROM LINE STATES ALONE - OPEN and PARTIALLY_SETTLED have
            IDENTICAL line states, and only the receipt total distinguishes them.
        confirmed_receipts_minor:
          type: integer
          readOnly: true
          description: >-
            CUMULATIVE confirmed eligible principal received against this demand, across ALL
            receipts. This is the figure atomic settlement watches - not any single
            receipt. GH50 then GH5 reads 5500 here.
        allocated_minor:
          type: integer
          readOnly: true
          description: >-
            Principal actually allocated to lines. ZERO until atomic settlement fires: a short
            payment settles no line, so this stays 0 while confirmed_receipts_minor is positive.
        remaining_due_minor:
          type: integer
          readOnly: true
          description: >-
            THE CANONICAL FORMULA, stated once and nowhere else:
              remaining_due_minor = max(total_due_minor - confirmed_receipts_minor, 0)
            where confirmed_receipts_minor is the cumulative ELIGIBLE confirmed principal received
            against this demand. THE NEXT COLLECTION REQUESTS THIS, not the total again - GH55 owed
            and GH50 received prompts for GH5.
            It is compatible with atomic settlement by construction: a short receipt REDUCES the
            remaining due while settling NO line, and the floor at zero means EXCESS never becomes
            new remaining due - excess is retained on its receipt and raises an adjustment.
            Server-derived; no caller supplies it and no rider chooses it.
        excess_minor:
          type: integer
          readOnly: true
          description: >-
            Confirmed principal above total_due_minor. It is NEVER allocated to a line or to
            another order - it stays on its receipt and raises a FinancialAdjustmentRequired.
        lines:
          type: array
          readOnly: true
          items: { $ref: '#/components/schemas/PaymentDemandLine' }
        frozen_at:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: >-
            Set when a PaymentAttempt is created against it. FROZEN means amount and line
            composition cannot move while a customer is being asked to pay them - no Rider or Ops
            screen can edit either.
      description: |
        **The exact amount being asked of one payer in one interaction.** It is NOT a ledger: it
        answers *what are we asking this payer for right now* and stops. Accounting & Reporting owns
        the general ledger, receivables, statements and settlement.

        **It is also the collision boundary for every payment method** - provider
        collection, Merchant MoMo and cash all consult it, so no method decides independently that
        the obligation looks unpaid.

        **A short payment funds it and settles nothing**. GH50 against GH55
        is real money on a real receipt; **no line settles**, no priority is applied, and
        handover stays blocked. Receipts accumulate, and when cumulative confirmed principal
        reaches the frozen total **every line settles atomically for its exact amount**.

        **Five figures, deliberately, and not one ambiguous amount_due.** total_due is what
        was frozen; confirmed_receipts is what arrived; allocated is what reached lines;
        remaining_due is what to ask for next; excess is what is owed back.

    PaymentDemandLine:
      type: object
      required: [id, obligation_type, principal_due_minor, status]
      properties:
        id: { type: string, format: uuid }
        obligation_type:
          type: string
          enum: [DELIVERY_FEE, REDELIVERY_DELIVERY_FEE, REDELIVERY_FEE, SINGLE_PACKAGE_PICKUP_FEE, RETURN_FEE]
          description: >-
            RETURN_FEE is materialised only where ReturnRecord.settlement_path =
            IMMEDIATE_DEMAND (an ad-hoc sender, SLICE-006 Pass 1). A registered vendor's return
            fee settles through the future VendorStatement mechanism and never appears
            as a line here.
        obligation_ref: { type: string, readOnly: true }
        description_code: { type: string, readOnly: true }
        principal_due_minor: { type: integer, readOnly: true }
        principal_settled_minor: { type: integer, readOnly: true }
        status: { type: string, enum: [OPEN, SETTLED, VOID], readOnly: true }
        pricing_snapshot_ref: { type: string, readOnly: true }
      description: |
        One operational obligation. **Lines are filled together or not at all**.
        Once the demand's CUMULATIVE eligible confirmed principal reaches total_due_minor, the
        settlement engine atomically fills every frozen line for its authoritative amount, and
        PaymentAllocation records preserve which receipt contributed which principal.
        **That may be one receipt or several** - GH55 at once, or GH50 then GH5.
        *Superseded description:* a single provider success allocates across every line, which
        assumed every payment arrives exact and made a short receipt unrepresentable.

    FallbackAuthorizationRequest:
      type: object
      required: [unresolved_payment_attempt_id, fallback_method, reason_code, duplicate_risk_acknowledged]
      additionalProperties: false
      properties:
        unresolved_payment_attempt_id:
          type: string
          format: uuid
          description: The attempt that is CREATED, PENDING or STATUS_UNKNOWN.
        fallback_method: { type: string, enum: [MERCHANT_MOMO, CASH] }
        reason_code: { type: string }
        note: { type: string }
        duplicate_risk_acknowledged:
          type: boolean
          description: >-
            MUST be true. The authorising officer states that the customer may already have been
            debited and that a later provider success will raise a FinancialAdjustmentRequired.
      description: |
        **No amount field.** The demand already knows what is owed, and an officer who could type an
        amount here could settle GH55 with GH5.

    AdjustmentResolutionProposal:
      type: object
      required: [resolution_class]
      additionalProperties: false
      properties:
        resolution_class:
          type: string
          enum: [REFUND, CREDIT, ALLOCATION, UNCLAIMED_DISPOSITION]
        method:
          type: [string, 'null']
          enum: [MERCHANT_MOMO_TRANSFER, BANK_TRANSFER, CASH_AT_HUB, VENDOR_BALANCE_CREDIT, NONE, null]
          description: Mandatory for REFUND and CREDIT. NONE where nothing moves.
        destination:
          type: [string, 'null']
          description: Account - wallet or party as the method requires. Mandatory for REFUND.
        reference:
          type: [string, 'null']
          description: Mandatory for MERCHANT_MOMO_TRANSFER and BANK_TRANSFER.
        evidence_id: { type: [string, 'null'], format: uuid }
        reason_code:
          type: [string, 'null']
          description: >-
            Mandatory for UNCLAIMED_DISPOSITION, and for REFUND where the payer is a registered
            vendor - the vendor's request is what displaces the CREDIT default.
      description: |
        **No amount field.** The adjustment already knows what is owed back, and partial
        resolution is not permitted - one adjustment resolves once, wholly. A
        proposer who could type an amount here could resolve GH55 with GH5.

    AdjustmentResolutionDecision:
      type: object
      required: [outcome]
      additionalProperties: false
      properties:
        outcome: { type: string, enum: [APPROVED, REJECTED] }
        reason_code:
          type: [string, 'null']
          description: Mandatory on REJECTED - a refusal that records no reason teaches nothing.

    FinancialAdjustmentResolution:
      type: object
      required: [id, financial_adjustment_required_id, resolution_class, amount_minor, currency, status]
      description: >-
        What was done about money owed back (domain-model.md 6.15, MSC-DEC-395). One per
        adjustment. This record creates NO accounting entry - Sec14.1 places general accounting
        outside Version 1 - and Melarc records this money rather than moving it, the same
        boundary CashDisposition holds.
      properties:
        id: { type: string, format: uuid }
        financial_adjustment_required_id: { type: string, format: uuid, readOnly: true }
        hub_id: { type: string, format: uuid, readOnly: true }
        resolution_class:
          type: string
          enum: [REFUND, CREDIT, ALLOCATION, UNCLAIMED_DISPOSITION]
          readOnly: true
        amount_minor:
          type: integer
          readOnly: true
          description: Equals the adjustment's own amount. Partial resolution is not permitted.
        currency: { type: string, enum: [GHS], readOnly: true }
        method:
          type: [string, 'null']
          enum: [MERCHANT_MOMO_TRANSFER, BANK_TRANSFER, CASH_AT_HUB, VENDOR_BALANCE_CREDIT, NONE, null]
          readOnly: true
        destination: { type: [string, 'null'], readOnly: true }
        reference: { type: [string, 'null'], readOnly: true }
        evidence_id: { type: [string, 'null'], format: uuid, readOnly: true }
        reason_code: { type: [string, 'null'], readOnly: true }
        status:
          type: string
          enum: [PROPOSED, APPROVED, REJECTED]
          readOnly: true
          description: >-
            The adjustment reaches RESOLVED only on APPROVED. A REJECTED record is kept and leaves
            the adjustment OPEN for a fresh proposal.
        proposed_by_staff_id: { type: string, format: uuid, readOnly: true }
        proposed_at: { type: string, format: date-time, readOnly: true }
        decided_by_staff_id:
          type: [string, 'null']
          format: uuid
          readOnly: true
          description: Never equal to proposed_by_staff_id.
        decided_at: { type: [string, 'null'], format: date-time, readOnly: true }

    FinancialAdjustmentRequired:
      type: object
      required: [id, payment_demand_id, reason, amount_minor, currency, status]
      properties:
        id: { type: string, format: uuid }
        payment_demand_id: { type: string, format: uuid, readOnly: true }
        payment_attempt_id: { type: [string, 'null'], format: uuid, readOnly: true }
        order_id: { type: [string, 'null'], format: uuid, readOnly: true }
        reason:
          type: string
          enum: [DUPLICATE_PAYMENT, OVERPAYMENT, PAID_OBLIGATION_VOIDED, LATE_PROVIDER_SUCCESS_AFTER_FALLBACK]
          readOnly: true
        amount_minor: { type: integer, readOnly: true }
        currency: { type: string, enum: [GHS], readOnly: true }
        raised_at: { type: string, format: date-time, readOnly: true }
        status:
          type: string
          enum: [OPEN, RESOLVED]
          readOnly: true
          description: >-
            OPEN is the only status Gate C writes. Refund, credit and allocation are
            Accounting & Reporting's; deciding them here would put refund policy in a delivery
            specification. RESOLVED is written by that domain when a
            FinancialAdjustmentResolution is APPROVED - never by a Gate C operation, so the
            original rule still holds exactly as written.
        source_key:
          type: string
          readOnly: true
          description: >-
            Idempotent. One source condition raises ONE record - a late-success callback delivered
            three times produces one receipt effect and one adjustment.
      description: |
        **The fact that money is owed back. Not the remedy.** No payment is reversed or deleted to
        raise one: both receipts stand, and this record is what points at the difference.

    StopPaymentView:
      type: object
      required: [collection_allowed]
      properties:
        payment_demand:
          oneOf:
            - $ref: '#/components/schemas/OperationalPaymentDemand'
            - type: 'null'
          readOnly: true
          description: >-
            THE PRODUCER. This is where payment_demand_id comes from. Null only
            where nothing is currently payable for the stop.
        collection_allowed:
          type: boolean
          readOnly: true
          description: >-
            Whether a collection may be offered NOW. False while an attempt is unresolved,
            while the demand is SETTLED or VOID, and where nothing is outstanding. TRUE for a
            PARTIALLY_SETTLED demand with remaining due: a partially funded demand
            is exactly when the next collection - for the remainder - must be offered.
        collection_blocked_reason:
          type: [string, 'null']
          enum: [NOTHING_OUTSTANDING, ALREADY_SETTLED, DEMAND_VOID, ATTEMPT_UNRESOLVED, HUB_CASH_DISABLED, null]
          readOnly: true
          description: >-
            An actual inability to collect. PARTIALLY_SETTLED is deliberately NOT a value here -
            it is a demand status, and it means the remainder is collectable, not blocked.
            HUB_CASH_DISABLED blocks the cash method only; a digital collection stays offered.
        unresolved_payment_attempt_id:
          type: [string, 'null']
          format: uuid
          readOnly: true
          description: >-
            The attempt blocking an ordinary fallback - CREATED, PENDING or STATUS_UNKNOWN. This
            is the id an Ops officer authorises against.
        active_fallback_authorization:
          oneOf:
            - $ref: '#/components/schemas/PaymentFallbackAuthorization'
            - type: 'null'
          readOnly: true
          description: The unspent Ops grant, where one exists. This is where its id comes from.
        receipts:
          type: array
          readOnly: true
          items: { $ref: '#/components/schemas/PaymentReceipt' }
          description: >-
            What has actually been received against this demand. TWO real payment events appear
            as TWO receipts - a fallback and a late provider success are both true.
      description: |
        **The Rider's and Ops's payment view of one stop, and the only documented source of a
        payment_demand_id.** Before this, initiatePaymentCollection required an id no operation
        produced: a rider had a screen, a permission, an uneditable amount, and **no way to obtain
        the identifier the request would not work without**. A database lookup, an undocumented
        admin call or a typed UUID were the only routes left, and all three mean the path does not
        exist.

        **Reading resolves; it does not invent.** Where a payable obligation has no demand yet, the
        server materialises the one its obligations already determine, under the same business key
        - **opening this screen five times produces one GH55 demand, not five**.

        **Nothing here is writable.** The amount, the lines, the settlement state and the
        permission to collect are all the server's.

    PaymentReceipt:
      type: object
      required: [id, payment_demand_id, method, received_principal_minor, currency, confirmed_at, status]
      properties:
        id: { type: string, format: uuid }
        payment_demand_id: { type: string, format: uuid, readOnly: true }
        method:
          type: string
          enum: [HUBTEL, MERCHANT_MOMO, CASH]
          readOnly: true
          description: >-
            The already-authorised methods and no other. HUBTEL and MERCHANT_MOMO are confirmed
            DIGITAL and create NO rider cash; CASH additionally moves
            RiderCashCustody, which is a separate record and not this one.
        payment_attempt_id: { type: [string, 'null'], format: uuid, readOnly: true }
        manual_source_ref:
          type: [string, 'null']
          readOnly: true
          description: The verified Merchant MoMo reference or the doorstep cash record.
        rider_cash_custody_id:
          type: [string, 'null']
          format: uuid
          readOnly: true
          description: >-
            CASH only, and then mandatory: the RiderCashCustody this receipt increased.
            Null for HUBTEL and MERCHANT_MOMO, which create no custody.
        fallback_authorization_id:
          type: [string, 'null']
          format: uuid
          readOnly: true
          description: Set where this receipt was taken under an Ops duplicate-risk grant.
        received_principal_minor:
          type: integer
          readOnly: true
          description: >-
            WHAT ACTUALLY ARRIVED. Not the amount requested, and NEVER net of provider_fee_minor
            - processing cost is not deducted from what a customer owes.
        currency: { type: string, enum: [GHS], readOnly: true }
        provider_transaction_id: { type: [string, 'null'], readOnly: true }
        provider_reference: { type: [string, 'null'], readOnly: true }
        payer_msisdn_masked: { type: [string, 'null'], readOnly: true }
        confirmed_at: { type: string, format: date-time, readOnly: true }
        received_by_principal_type:
          type: [string, 'null']
          enum: [RIDER, STAFF, SYSTEM, null]
          readOnly: true
          description: >-
            The actor for cash and manual confirmation; SYSTEM for provider truth applied by the
            trusted service. A Rider is not a Staff member.
        received_by_principal_id: { type: [string, 'null'], format: uuid, readOnly: true }
        source_key:
          type: string
          readOnly: true
          description: >-
            IDEMPOTENT IDENTITY. The same provider success delivered three times produces ONE
            receipt.
        status: { type: string, enum: [CONFIRMED, REVERSED_BY_PROVIDER], readOnly: true }
        allocations:
          type: array
          readOnly: true
          items: { $ref: '#/components/schemas/PaymentAllocation' }
      description: |
        **Money Melarc has confirmed receiving through one method.** It is NOT a general-ledger
        entry: Accounting & Reporting owns the ledger, receivables and settlement.

        **A confirmed receipt is never deleted because the obligation behind it was later voided.**
        The money arrived. Deleting the record is how a customer's payment quietly becomes
        Melarc's - the condition FinancialAdjustmentRequired exists to make visible.

        **Two real payment events are two receipts.** A Merchant MoMo fallback of GH55 and a late
        Hubtel success of GH55 are BOTH true, and collapsing them destroys the evidence that a
        refund is owed. **The demand still settles once**, and the excess becomes an adjustment
        fact.

        **A receipt SHORT of the demand total is still a receipt.** A provider that
        authoritatively transferred GH50 against GH55 transferred GH50, and recording that as a
        failure would model money that arrived as money that did not. The receipt
        is created at what arrived; what it does NOT do is settle a line.

        **No operator creates one.** A receipt is the recorded consequence of a method confirming.

    PaymentAllocation:
      type: object
      required: [id, payment_receipt_id, payment_demand_line_id, amount_minor, allocated_at]
      properties:
        id: { type: string, format: uuid }
        payment_receipt_id: { type: string, format: uuid, readOnly: true }
        payment_demand_line_id: { type: string, format: uuid, readOnly: true }
        amount_minor: { type: integer, readOnly: true }
        allocated_at: { type: string, format: date-time, readOnly: true }
        source_key: { type: string, readOnly: true }
      description: |
        **What a receipt settled.** One receipt may allocate across SEVERAL lines: GH55 becomes
        GH35 to the delivery-fee line and GH20 to the redelivery-fee line, both SETTLED, ONE
        provider prompt.

        **Bounded by the money, not by the obligation.** The sum of a receipt's allocations never
        exceeds its received principal, and a line's settled principal never exceeds its due
        principal. **An excess is not allocated anywhere** - not spread onto unrelated orders or
        lines - and the difference becomes a FinancialAdjustmentRequired.

        **Server-authoritative.** No screen allocates, re-allocates or un-allocates, and no
        permission represents the act.

        **A confirmed receipt SHORT of the demand total allocates NOTHING**.
        The demand records PARTIALLY_SETTLED, the receipt stands at its confirmed amount, no
        line is settled and handover stays blocked. **No allocation priority exists** - not
        delivery-fee-first, not redelivery-fee-first, not pro rata. Atomic settlement removes
        the question rather than answering it, which is what the Product Owner ruled when
        closing OQ-111.

        **Settlement is ATOMIC and may draw on SEVERAL receipts.** When cumulative confirmed
        principal reaches total_due_minor, every frozen line is allocated its exact
        principal_due_minor in ONE act. GH50 then GH5 against GH35 and GH20 produces three
        allocations - R1 to L1 3500, R1 to L2 1500, R2 to L2 500 - and both lines SETTLED.

        **Provenance is preserved**. Every allocation names one receipt and one
        line; receipts are drawn in confirmed_at order and lines in frozen order, so a replay
        produces the same records. **A single anonymous GH55 allocation would erase the fact
        that two payments were involved**, which is the fact a refund argument turns on. The
        ordering decides WHICH RECEIPT'S MONEY reaches a line, never WHICH LINE GETS PAID.

    PaymentFallbackAuthorization:
      type: object
      required: [id, payment_demand_id, unresolved_payment_attempt_id, fallback_method, status, created_at]
      properties:
        id: { type: string, format: uuid }
        payment_demand_id: { type: string, format: uuid, readOnly: true }
        unresolved_payment_attempt_id: { type: string, format: uuid, readOnly: true }
        fallback_method:
          type: string
          enum: [MERCHANT_MOMO, CASH]
          readOnly: true
          description: >-
            THE FALLBACK TAKEN MUST BE THE FALLBACK AUTHORISED. A CASH grant cannot settle a
            Merchant MoMo payment - FALLBACK_AUTHORIZATION_METHOD_MISMATCH.
        authorized_by_staff_id:
          type: string
          format: uuid
          readOnly: true
          description: Authorised Ops. NEVER a Rider - a rider may report and request, never authorise.
        reason_code: { type: string, readOnly: true }
        note: { type: [string, 'null'], readOnly: true }
        duplicate_risk_acknowledged: { type: boolean, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        status:
          type: string
          enum: [ACTIVE, CONSUMED, SUPERSEDED]
          readOnly: true
          description: >-
            SINGLE USE. A consumed grant is refused - FALLBACK_AUTHORIZATION_ALREADY_CONSUMED.
            Consumption is a system effect of the fallback receipt being written; nobody marks it
            consumed by hand.
            VALID BY EVENT, NOT BY CLOCK. It becomes SUPERSEDED the moment the
            condition it was granted for stops existing: the attempt reaches SUCCEEDED, FAILED,
            EXPIRED or CANCELLED, or the demand becomes SETTLED or VOID. There is NO TTL - the
            previous EXPIRED state had no duration, so nothing could enter or test it.
        superseded_at: { type: [string, 'null'], format: date-time, readOnly: true }
        superseded_reason:
          type: [string, 'null']
          enum: [ATTEMPT_RESOLVED_SUCCEEDED, ATTEMPT_RESOLVED_SAFE, DEMAND_SETTLED, DEMAND_VOID, null]
          readOnly: true
          description: >-
            ATTEMPT_RESOLVED_SUCCEEDED - the money arrived, so a grant issued against *we cannot
            tell* must not authorise a second full payment. ATTEMPT_RESOLVED_SAFE - the provider
            is definitively terminal, the duplicate risk is gone, and ORDINARY fallback rules
            apply rather than this grant. DEMAND_SETTLED / DEMAND_VOID - nothing left to collect.
        consumed_at: { type: [string, 'null'], format: date-time, readOnly: true }
        consumed_by_receipt_id: { type: [string, 'null'], format: uuid, readOnly: true }
      description: |
        **A grant that is consumed, not a line in an audit log**. MSC-DEC-357 created
        the duplicate-risk exception and **nothing could spend it**: both fallback operations
        refused an unresolved attempt outright, so the officer's authorisation reached nothing and
        the one controlled way through the settlement gate ended at a 201.

        **An audit log is not an authorisation database.** Audit records that a decision was taken;
        it cannot be asked *is this grant still available*, and a settlement path must never query
        it for permission.

        **One active grant per demand, attempt and method.** A repeat request returns the existing
        one rather than accumulating grants.

        **VALIDITY IS EVALUATED AT THE MOMENT OF USE**, never assumed from the stored status.
        All six must hold: status ACTIVE; the referenced attempt still unresolved
        in an allowed state; the demand neither SETTLED nor VOID; the method matches the fallback
        being taken; not already consumed; and the demand it names is the demand being settled.
        **A stale duplicate-risk grant must never take a second full payment.**

    PaymentCollectionRequest:
      type: object
      required: [payment_demand_id, payer_msisdn]
      additionalProperties: false
      properties:
        payment_demand_id:
          type: string
          format: uuid
          description: >-
            The OperationalPaymentDemand to collect. The server requests its
            REMAINING DUE at this moment - total_due_minor minus what has already been confirmed
            - and never the total again once a receipt exists.
            A success creates a receipt for what actually arrived. It settles lines only when the
            demand's CUMULATIVE confirmed principal reaches the total, and then it settles ALL of
            them at once. *Superseded description:* the server requests total_due_minor and a
            success allocates across every line, which was true only while every payment was
            exact.
        payer_msisdn:
          type: string
          description: >-
            The payer's mobile-money number, canonically normalised. It is NOT necessarily the
            recipient's contact number, and using it here never rewrites the recipient record.
      description: |
        **Two fields, deliberately.** No amount, no currency, no hub, no status, no provider
        transaction id, no `paid`, no confirmed amount and NO PIN - every one of those is either
        server-derived or nobody's business but the provider's.

        **payment_demand_id comes from getStopPaymentDemand or listOperationalPaymentDemands**,
        never from a client's own construction. Until C1.6 this list required
        `obligation_ref`, **which is not a property of this schema** - the request could not be
        satisfied as written, and the id it does require had no producer at all.

    PaymentCollection:
      type: object
      required: [id, state, principal_amount_minor, currency, created_at]
      properties:
        id: { type: string, format: uuid }
        payment_demand:
          allOf:
            - $ref: '#/components/schemas/OperationalPaymentDemand'
          readOnly: true
          description: The frozen demand, with its lines and total.
        initiator_principal_type:
          type: string
          enum: [RIDER, STAFF]
          readOnly: true
          description: >-
            A RIDER is not a STAFF member. The record required a Staff id while
            permitting a Rider surface, which left the rider path unbuildable without forging
            a StaffIdentity. Exactly one initiator, immutable, coherent with the surface.
        order_id: { type: [string, 'null'], format: uuid, readOnly: true }
        delivery_stop_id: { type: [string, 'null'], format: uuid, readOnly: true }
        initiating_surface:
          type: string
          enum: [RIDER, OPS]
          readOnly: true
          description: One engine, two surfaces.
        payer_msisdn_masked:
          type: string
          readOnly: true
          description: Masked for display. The full number is never returned to a client.
        principal_amount_minor:
          type: integer
          readOnly: true
          description: >-
            THE DEMAND'S REMAINING DUE AT THE MOMENT THIS ATTEMPT WAS CREATED, snapshotted and
            immutable thereafter. NOT total_due_minor: a demand of GH55 with GH50
            already confirmed creates an attempt for GH5, and prompting for GH55 again would take
            GH105 for a GH55 delivery. The demand's own total is preserved separately on the
            demand, so the original obligation is never lost.
            SERVER-DERIVED and never caller-supplied. It is the figure this attempt
            asks for - not the amount charged to the payer, and not net of any provider fee.
            What it CONFIRMS may be less, more or equal, and confirmed_principal_minor
            carries that; settlement is decided by the demand's cumulative total, never by one
            attempt.
        currency: { type: string, enum: [GHS], readOnly: true }
        state:
          type: string
          enum: [CREATED, PENDING, STATUS_UNKNOWN, SUCCEEDED, FAILED, EXPIRED, CANCELLED, REVERSED]
          readOnly: true
          description: >-
            STATUS_UNKNOWN means TRANSMITTED AND UNANSWERED - not failed. No retry is
            permitted from it, because that is precisely the case where the customer may already
            have been debited.
        ui_instruction:
          type: string
          readOnly: true
          description: >-
            Safe text for the operator. For STATUS_UNKNOWN it says to wait and NOT to request
            payment again; it never offers a retry.
        client_reference: { type: string, readOnly: true }
        provider_transaction_id: { type: [string, 'null'], readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        expires_at: { type: [string, 'null'], format: date-time, readOnly: true }
        provider_confirmed_at: { type: [string, 'null'], format: date-time, readOnly: true }
        confirmed_principal_minor: { type: [integer, 'null'], readOnly: true }
        provider_fee_minor:
          type: [integer, 'null']
          readOnly: true
          description: >-
            An external provider fact where returned. It NEVER reduces the obligation and is not a
            rider Road Expense.
        net_settlement_minor: { type: [integer, 'null'], readOnly: true }
        reconciliation_status: { type: string, enum: [NOT_REQUIRED, REQUIRED, IN_PROGRESS, RESOLVED], readOnly: true }
      description: |
        **Every field is readOnly.** A client observes a collection; it never states one. There is
        no field a caller could set to make an unpaid obligation look paid, and **no PIN field
        exists**.

    ProviderPaymentCallback:
      type: object
      required: [client_reference, provider_status]
      additionalProperties: false
      properties:
        client_reference: { type: string }
        provider_transaction_id: { type: string }
        provider_status: { type: string }
        amount_minor: { type: integer }
        currency: { type: string }
        payer_msisdn: { type: string }
      description: |
        **A notification, not an authority**. Every value here is checked against the
        frozen attempt, and where callback authenticity cannot be cryptographically trusted the
        attempt is confirmed by an independent server-to-server status query before SUCCEEDED.

        **Nothing here can create an obligation, change an amount or name a different order.**

    RedeliveryCancellationRequest:
      type: object
      additionalProperties: false
      required: [reason_code]
      properties:
        reason_code:
          type: string
          description: >-
            An ACTIVE reason from the redelivery-cancellation domain - REASON_NOT_ACTIVE
            otherwise. 36.12: a reason is a governed record, never free text, because the
            reason is what makes the obligation VOID rather than merely unpaid.
        note:
          type: string
          maxLength: 500
          description: Optional operator note. Never a substitute for the reason code.
    RedeliveryScheduleRequest:
      type: object
      required: [originating_delivery_stop_id, scheduled_date]
      additionalProperties: false
      properties:
        originating_delivery_stop_id:
          type: string
          format: uuid
          description: >-
            The QUALIFYING FAILED PHYSICAL DeliveryStop this answers. STOP_NOT_QUALIFYING where the
            stop was skipped at NEXT_STOP or held at PRE_DISPATCH - neither is a physical attempt.
        scheduled_date: { type: string, format: date }
        scheduled_window: { type: string }
        destination_location_id: { type: [string, 'null'], format: uuid }
        note: { type: string }
      description: |
        **No fee field exists here, deliberately**. Both amounts are SERVER-SNAPSHOTTED
        at scheduling - the applicable delivery fee from the ordinary pricing rules, the redelivery
        fee from the hub setting. **No payer field exists either**: it is always RECIPIENT, and
        ordinary Ops cannot change it.

    Redelivery:
      type: object
      required: [id, order_id, originating_delivery_stop_id, sequence, scheduled_at, payer, chargeable, status]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        originating_delivery_stop_id:
          type: string
          format: uuid
          description: >-
            The qualifying failed physical DeliveryStop this trip answers. NOT unique across
            Redelivery records: a trip cancelled before it departed (Sec20.5, SCHEDULED ->
            CANCELLED) leaves the same failed stop as the only qualifying one, so a later
            redelivery references it again. Concurrency is guarded by the order's own
            AT_HUB_AFTER_FAILURE -> READY_FOR_REATTEMPT transition, not by a constraint here.
        sequence:
          type: integer
          minimum: 1
          description: >-
            1 for the first redelivery, 2 for the next. NO MAXIMUM - each further trip needs its own
            Ops approval, and no Product decision sets a ceiling.
        scheduled_by_staff_id: { type: string, format: uuid, readOnly: true }
        scheduled_at:
          type: string
          format: date-time
          readOnly: true
          description: The snapshot moment. The charge is created here and nowhere earlier.
        delivery_commitment_id:
          type: string
          format: uuid
          readOnly: true
          description: The NEW commitment. The original is preserved and never overwritten.
        applicable_delivery_fee_minor:
          type: integer
          readOnly: true
          description: >-
            SNAPSHOTTED at scheduling from the ordinary pricing rules applied to the new trip -
            destination, service type, corridor rules, approved location changes. Not a fixed figure.
        redelivery_fee_minor:
          type: integer
          readOnly: true
          description: >-
            SNAPSHOTTED from the HUB's redelivery_fee_minor setting (GH20 at Accra launch). A later
            setting change never reprices a scheduled redelivery. DISTINCT from flat_return_fee_amount,
            which governs a different act and happens to share the launch value.
        total_due_minor:
          type: integer
          readOnly: true
          description: The two above. GH35 + GH20 = GH55 in the Accra example.
        payer:
          type: string
          enum: [RECIPIENT]
          readOnly: true
          description: >-
            ALWAYS the recipient. Not the Vendor, not the original payer, not an
            Ops-selected party. Ordinary Ops cannot change it.
        chargeable:
          type: boolean
          readOnly: true
          description: >-
            DERIVED FROM THE ORIGINATING REASON, never chosen by the scheduling officer. False where
            the failure is attributed to Melarc - a rider breakdown, a provider outage, an OTP
            failure that was not the recipient's doing - and both fees are then 0.
        payment_state: { type: string, enum: [NOT_REQUIRED, DUE, SETTLED] }
        delivery_run_id: { type: [string, 'null'], format: uuid }
        delivery_stop_id: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED] }

    CarrierHandoffCapture:
      type: object
      required: [identity_mode, handed_to, evidence_id]
      additionalProperties: false
      description: |
        **What the rider captured at the station or the carrier's counter**.

        **Version 1 permits BOTH carrier identity modes** (MSC-DEC-413, closing OQ-140): a
        registered active courier or station, and an approved informal driver/agent. **What must
        arrive therefore depends on the mode.** handed_to and evidence_id are required in both.
        **waybill_reference is the REGISTERED mode's requirement** - 24.7.3 and 35.9(9) both scope
        it there, and WAYBILL_REQUIRED has always read *registered handoff without a waybill* -
        and it is not carried for an agent handoff. 24.7.1 earns Melarc's fee against a waybill AND
        a receipt/handoff photo on a registered handoff, so for that mode a partial capture is
        still not a handoff. **The conditional lives in the declared refusal rather than the
        required list**, as it does for variance_reason_code on a parcel-custody confirmation.

        **No state field, and no COMMERCIAL mode field** - and identity_mode is not an exception
        to that rule but a different fact (MSC-DEC-413, amended). The state this produces is fixed
        by the operation, and commercial_mode is snapshotted server-side from the order: a client
        able to send either could declare a Station Drop complete, or turn a covered delivery into
        one. **commercial_mode is a property of the ORDER**, decided before dispatch.
        **identity_mode is a property of the ACT at the counter** - who the rider actually handed
        to - which the client necessarily reports, exactly as it reports handed_to. **The server
        validates the declared mode against the approved identity; it does not infer the mode from
        which optional fields arrived.** A future reader tempted to delete this field as *the mode
        field we said we do not have* should read this paragraph first.
      properties:
        identity_mode:
          type: string
          enum: [REGISTERED, APPROVED_AGENT]
          description: >-
            **Which of 24.7.3's two carrier identity modes this handoff is** (MSC-DEC-413, amended
            before commit). Version 1 permits both, so **the request must say which** rather than
            leave the server to infer it from which optional fields arrived - an inference that
            would make a capture with neither a provider id nor an agent identity ambiguous instead
            of invalid.

            **REGISTERED** requires courier_provider_id naming an ACTIVE approved CourierProvider
            or station record, and waybill_reference. **APPROVED_AGENT** requires agent_phone,
            which the server resolves to an ACTIVE ApprovedAgent at the rider's hub whose
            identity photo is stored (MSC-DEC-417, closing OQ-133), and carries no waybill. **Both require evidence_id, the same custody authority, the same
            idempotency and the same audit record**: the mode changes what identifies the carrier,
            nothing else.

            **NEITHER MODE PERMITS AN UNAPPROVED THIRD PARTY TO RECEIVE CUSTODY.**
            CARRIER_NOT_APPROVED refuses a REGISTERED capture whose provider is absent or inactive,
            and an APPROVED_AGENT capture whose agent is not validly approved under the
            informal-agent rules. A declared mode whose own required identity is missing is
            VALIDATION_FAILED, not an implicit switch to the other mode.
        handed_to:
          type: object
          required: [name]
          description: >-
            The station or carrier ACTUALLY handed to, captured at the act (36.10). Distinct from
            Order.carrier_identity, which records what was planned.
          properties:
            name: { type: string, description: The station or carrier as identified at handoff }
            reference:
              type: [string, 'null']
              description: Their own counter, desk or agent reference where one is given.
        courier_provider_id:
          type: [string, 'null']
          format: uuid
          description: >-
            The approved courier or station from 24.7's register, where the handoff is to a
            **registered** courier or station. **Null for an approved informal agent handoff**,
            which MSC-DEC-413 permits in Version 1 - which is why this field is NOT required.

            **The signed guard requires an approved courier or station CAPTURED, in both modes** -
            state-machines.md 10 names no commercial mode - and it does not say that the capture is
            always this foreign key. 24.7.3 separates the **carrier identity mode** from the
            commercial mode and names two: a *"registered active courier/station"*, and an
            *"approved informal agent mode"* whose *"approved driver/agent identity and evidence"*
            are *"defined by technical design"*. 35.9(9) repeats the pair.

            **So this is optional in the schema and that is not a weakening.** Making it required
            would forbid the informal-agent mode the frozen specification contemplates, and
            MSC-DEC-413 (closing OQ-140) decided that **Version 1 permits BOTH modes**.
            **Validation is possible**: MSC-DEC-417 (closing OQ-133) gave the courier and station
            register and the hub's approved-agent register their operations, so
            CARRIER_NOT_APPROVED is enforceable in both modes. *Superseded:* whether Version 1
            permits the informal-agent mode was a PRODUCT decision owned by OQ-140, and the
            capture was unvalidatable because CourierProvider had no operations.

            5.50 read *"Required by the signed guard in both modes"* beside a nullable optional
            field. Corrected at Rider Four-Pass R1.1: the guard requires a capture, this field is
            one way to make it, and the set of permitted ways was decided at MSC-DEC-413.
        agent_phone:
          type: [string, 'null']
          description: >-
            APPROVED_AGENT mode only - the agent's phone number, which the server resolves to an
            ACTIVE ApprovedAgent at the rider's hub whose identity photo is stored.
            The rider never reads the agent register.
        waybill_reference:
          type: string
          minLength: 1
          description: The third party's own waybill - REGISTERED mode only. WAYBILL_REQUIRED refuses a registered capture without one.
        evidence_id:
          type: string
          format: uuid
          description: >-
            The mandatory receipt/handoff photograph (34.5, 24.7.1). **Must already be STORED** -
            state-machines.md 17 forbids referencing a PENDING_UPLOAD record, so a photo still
            uploading cannot complete a handoff.

    HandoffOutcomeRecord:
      type: object
      required: [outcome]
      additionalProperties: false
      description: |
        A covered-mode outcome, recorded by Ops. reason_code comes from the
        DELIVERY_FAILURE catalogue and is required for FAILED, and for RETURNED unless the record
        is already FAILED with a reason.
      properties:
        outcome:
          type: string
          enum: [IN_TRANSIT, DELIVERED, FAILED, RETURNED]
        reason_code: { type: [string, 'null'] }
        note: { type: [string, 'null'] }

    CourierProvider:
      type: object
      required: [id, name, kind, status, registered_at]
      description: |
        An entry in 24.7's approved courier/station register. **Approved while
        ACTIVE**; deactivation never deletes.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [COURIER, STATION] }
        contact_phone: { type: [string, 'null'] }
        location_note: { type: [string, 'null'] }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        registered_by: { type: string, format: uuid }
        registered_at: { type: string, format: date-time }
        status_changed_by: { type: [string, 'null'], format: uuid }
        status_changed_at: { type: [string, 'null'], format: date-time }
        status_reason: { type: [string, 'null'] }

    CourierProviderRegister:
      type: object
      required: [name, kind]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        kind: { type: string, enum: [COURIER, STATION] }
        contact_phone: { type: [string, 'null'] }
        location_note: { type: [string, 'null'] }

    ApprovedAgent:
      type: object
      required: [id, approving_hub_id, full_name, phone, status, approved_at]
      description: |
        An informal driver or agent approved by hub Senior Ops. **Cannot take
        custody until identity_evidence_id is set**, and only for the approving hub's handoffs.
      properties:
        id: { type: string, format: uuid }
        approving_hub_id: { type: string, format: uuid }
        full_name: { type: string }
        phone: { type: string }
        identity_evidence_id: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [ACTIVE, WITHDRAWN] }
        approved_by: { type: string, format: uuid }
        approved_at: { type: string, format: date-time }
        withdrawn_by: { type: [string, 'null'], format: uuid }
        withdrawn_at: { type: [string, 'null'], format: date-time }
        withdrawal_reason: { type: [string, 'null'] }

    ApprovedAgentApprove:
      type: object
      required: [full_name, phone]
      additionalProperties: false
      properties:
        full_name: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
        identity_evidence_id:
          type: [string, 'null']
          format: uuid
          description: A STORED COMPLIANCE_DOCUMENT photo of the agent's ID document - required before the agent can take custody, and attachable later.

    ThirdPartyHandoff:
      type: object
      description: |
        **The evidence-backed custody transfer to an approved courier or station** (34.5, 24.7).
        Entity at domain-model.md 6.10, machine at state-machines.md 10 - **SIGNED 26 August 2026**,
        and without an operation until MSC-DEC-402.

        **The two modes diverge here and the divergence is the most missed rule in the domain**.
        For STATION_DROP, HANDED_OVER is TERMINAL: Melarc's service completes and
        its fee is earned at verified handoff, and the third party's onward delivery is outside
        Melarc's tracked lifecycle entirely. For MELARC_COVERED_THIRD_PARTY_DELIVERY it is NOT
        terminal: Ops records the third party's outcome with recordHandoffOutcome, and FAILED is
        followed by RETURNED when the parcel is back (MSC-DEC-417, closing OQ-135). *Superseded:*
        the operations that would carry it further did not exist.
      required: [id, order_id, commercial_mode, state]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid, readOnly: true }
        delivery_stop_id: { type: [string, 'null'], format: uuid, readOnly: true }
        commercial_mode:
          type: string
          enum: [STATION_DROP, MELARC_COVERED_THIRD_PARTY_DELIVERY]
          readOnly: true
          description: >-
            Snapshotted from the order at creation, never read live. It decides whether
            HANDED_OVER is terminal, which is to say it decides what a closed record means.
        handed_to:
          type: [object, 'null']
          readOnly: true
          description: >-
            The station or carrier name and its reference, as captured at the handoff.
            Non-null from HANDED_OVER. The registry link, where one applies, is the
            sibling courier_provider_id, which is a foreign key and not a capture.
          properties:
            name: { type: string }
            reference: { type: [string, 'null'] }
        courier_provider_id: { type: [string, 'null'], format: uuid, readOnly: true }
        identity_mode: { type: [string, 'null'], enum: [REGISTERED, APPROVED_AGENT, null], readOnly: true }
        approved_agent_id: { type: [string, 'null'], format: uuid, readOnly: true }
        waybill_reference: { type: [string, 'null'], readOnly: true }
        evidence_id: { type: [string, 'null'], format: uuid, readOnly: true }
        state:
          type: string
          enum: [PENDING_HANDOFF, HANDED_OVER, IN_TRANSIT, DELIVERED, FAILED, RETURNED, CANCELLED]
          readOnly: true
          description: >-
            state-machines.md 10. PENDING_HANDOFF to HANDED_OVER is reached through
            recordCarrierHandoff; the outcome states are Ops' and are reached through
            recordHandoffOutcome (MSC-DEC-417, closing OQ-135). *Superseded:* only the first was
            reachable through this contract, and the outcome states had no operation.
        handed_over_by_rider_id: { type: [string, 'null'], format: uuid, readOnly: true }
        handed_over_at:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: >-
            Non-null from HANDED_OVER. **For a STATION_DROP this is the instant Melarc's fee is
            earned** (24.7.1) - the fee itself was collected before dispatch, so this marks the
            earning and never a collection.
        final_outcome_recorded_by_staff_id: { type: [string, 'null'], format: uuid, readOnly: true }
        final_outcome_at: { type: [string, 'null'], format: date-time, readOnly: true }
        reason_snapshot:
          type: [object, 'null']
          readOnly: true
          description: Why a handoff reached FAILED or the parcel RETURNED (3.9). Mandatory on both.

    SecurityRiskHold:
      type: object
      description: |
        **A vendor-level security/risk hold** (domain-model.md, machine at state-machines.md 21 -
        SIGNED, MSC-DEC-414). **Never readable by the vendor it concerns** (data-scope-registry.md
        4.3). An OPEN hold stops new business and keeps work in flight.
      required: [id, vendor_organization_id, state, opened_by, opened_at, open_reason]
      properties:
        id: { type: string, format: uuid }
        vendor_organization_id: { type: string, format: uuid, readOnly: true }
        state:
          type: string
          enum: [OPEN, CLEARED]
          readOnly: true
        opened_by: { type: string, format: uuid, readOnly: true, description: Platform Admin }
        opened_at: { type: string, format: date-time, readOnly: true }
        open_reason: { type: string, readOnly: true }
        cleared_by: { type: [string, 'null'], format: uuid, readOnly: true }
        cleared_at: { type: [string, 'null'], format: date-time, readOnly: true }
        clear_reason: { type: [string, 'null'], readOnly: true }

    ParcelCustodyReturn:
      type: object
      description: |
        **Undelivered parcels coming back from a delivery run to the responsible hub**
        (domain-model.md 6.10, machine at state-machines.md 12.2 - SIGNED, MSC-DEC-410).
        Mirrors CashHandover: the rider declares, the hub receives, a mismatch opens a variance.
      required: [id, delivery_run_id, rider_id, responsible_hub_id, state, declared_at]
      properties:
        id: { type: string, format: uuid }
        delivery_run_id: { type: string, format: uuid, readOnly: true }
        rider_id: { type: string, format: uuid, readOnly: true }
        responsible_hub_id: { type: string, format: uuid, readOnly: true }
        state:
          type: string
          enum: [DECLARED, RECEIVED, VARIANCE_OPEN, CLOSED]
          readOnly: true
        declared_at: { type: string, format: date-time, readOnly: true }
        received_by_staff_id:
          type: [string, 'null']
          format: uuid
          readOnly: true
          description: >-
            Hub Ops, and **never the rider_id**. Non-null from RECEIVED or VARIANCE_OPEN.
        confirmed_at:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: >-
            **When Hub Ops recorded the physical comparison.** Non-null from RECEIVED or
            VARIANCE_OPEN. **Not a custody instant for the whole record**: a received line transfers
            custody at this moment, a MISSING line transfers none, and a line later dispositioned
            RECEIVED_LATE transfers at resolved_at. Renamed from received_at at OQ-129 R1.1, which
            found the old name asserting a transfer even where the hub received nothing.
        variance_reason_code: { type: [string, 'null'], readOnly: true }
        resolved_by_staff_id: { type: [string, 'null'], format: uuid, readOnly: true }
        resolved_at: { type: [string, 'null'], format: date-time, readOnly: true }
        lines:
          type: array
          readOnly: true
          items: { $ref: '#/components/schemas/ParcelCustodyReturnLine' }

    ParcelCustodyReturnLine:
      type: object
      required: [id, order_id, declared_by_rider, line_state]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        declared_by_rider: { type: boolean }
        received_by_hub: { type: [boolean, 'null'] }
        line_state:
          type: string
          enum: [DECLARED, RECEIVED, MISSING, UNDECLARED, RESOLVED]
          description: >-
            MISSING is a named parcel the hub cannot find; UNDECLARED is one it holds that was not
            named. **Kept apart deliberately** - collapsing them hides a loss inside a clerical
            error.
        disposition:
          type: [string, 'null']
          enum: [RECEIVED_LATE, CONFIRMED_NOT_RECEIVED, DECLARATION_CORRECTED, null]
          description: >-
            **What was decided about an open line.** Mandatory at RESOLVED and null before it. A
            reason says why the line is open; this says what was decided (OQ-129 R1).
        reason_code: { type: [string, 'null'] }
        note: { type: [string, 'null'] }

    ParcelCustodyReturnCreate:
      type: object
      required: [delivery_run_id, order_ids]
      additionalProperties: false
      properties:
        delivery_run_id: { type: string, format: uuid }
        order_ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
          description: >-
            Every undelivered order still aboard. **No state field and no received flag**: the
            rider declares what they are carrying and the hub decides what it received.

    ParcelCustodyReturnConfirm:
      type: object
      required: [received_order_ids]
      additionalProperties: false
      properties:
        received_order_ids:
          type: array
          items: { type: string, format: uuid }
          description: >-
            What the hub physically has. May be empty, and may include orders the rider did not
            name - **each of which must still be eligible for this run**, or ORDER_NOT_ON_RUN.
        variance_reason_code:
          type: [string, 'null']
          description: '**Mandatory where the received set differs from the declared set** - REASON_REQUIRED otherwise.'
        note: { type: [string, 'null'] }

    ParcelCustodyVarianceResolution:
      type: object
      required: [lines]
      additionalProperties: false
      description: |
        **A reason explains why a line is open; a disposition records what was decided about it.**
        The terminal state says the decision is recorded, so the schema must be able to tell the
        decisions apart - a reason code alone cannot.
      properties:
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [order_id, disposition, reason_code]
            properties:
              order_id: { type: string, format: uuid }
              disposition:
                type: string
                enum: [RECEIVED_LATE, CONFIRMED_NOT_RECEIVED, DECLARATION_CORRECTED]
                description: >-
                  **What was decided, and each value is a different custody outcome.**
                  RECEIVED_LATE - the parcel was produced and custody transferred; the line becomes
                  RESOLVED and, where the order is ATTEMPT_FAILED, it moves to AT_HUB_AFTER_FAILURE
                  as a confirmed line does. CONFIRMED_NOT_RECEIVED - custody did **not** reach the
                  hub; the line is RESOLVED as a recorded non-arrival and **no order state moves**.
                  DECLARATION_CORRECTED - the line was a clerical error and **no parcel moved**:
                  either a named parcel that was never aboard, or an UNDECLARED one reconciled to
                  the run it belongs to.
                  **What follows a CONFIRMED_NOT_RECEIVED is not decided here** - the damage, loss
                  and claims apparatus is OQ-004's, and this field records the custody fact rather
                  than opening a claim.
              reason_code: { type: string }
              note: { type: [string, 'null'] }

    ReturnRecord:
      type: object
      description: >-
        The sibling record to Redelivery at the identical decision point, AT_HUB_AFTER_FAILURE
        (domain-model.md 6.14, MSC-DEC-332). SLICE-006 Pass 1 models Sec28.1-28.4; MSC-DEC-394
        (17 September 2026) decided and built partial waiver and no-cancellation into this schema,
        and decided a vendor's refusal as policy (escalates to Senior Ops, Sec28.7) without a
        schema change. Invalid/inaccessible phone number and exceptional OTP recovery (Sec28.5)
        and the damage/loss/claims apparatus (Sec28.6) remain OQ-004/OQ-042/OQ-084's, not this
        schema's.
      required: [id, order_id, committed_at, settlement_path, return_fee_minor, waiver_status, effective_return_fee_minor, status]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        originating_delivery_stop_id:
          type: [string, 'null']
          format: uuid
          description: >-
            The most recent failed physical DeliveryStop, where one exists. Null when the order
            reached AT_HUB_AFTER_FAILURE via a cancelled Redelivery rather than a
            fresh failed attempt - the failed stop of record is already linked from that Redelivery.
        committed_by_staff_id: { type: string, format: uuid, readOnly: true }
        committed_at:
          type: string
          format: date-time
          readOnly: true
          description: The snapshot moment. The obligation is created here and nowhere earlier.
        settlement_path:
          type: string
          enum: [STATEMENT, IMMEDIATE_DEMAND]
          readOnly: true
          description: >-
            DERIVED from which of the order's vendor_organization_id / ad_hoc_sender_id is set
            (Sec5.2.4, Sec28.4). Never chosen by Ops. STATEMENT settles through the future
            VendorStatement mechanism and creates no OperationalPaymentDemand here.
        return_fee_minor:
          type: integer
          readOnly: true
          description: >-
            SNAPSHOTTED from the hub's flat_return_fee_amount at commit. Always populated - the
            fee is charged by default, never conditionally zeroed the way
            Redelivery.chargeable is.
        waiver_status: { type: string, enum: [NOT_REQUESTED, REQUESTED, APPROVED, REJECTED] }
        waiver_reason_code:
          type: [string, 'null']
          description: A ReturnFeeWaiverReason value. Mandatory from REQUESTED onward.
        waiver_amount_minor:
          type: [integer, 'null']
          description: >-
            Proposed by Ops at REQUESTED. Senior Ops approves or rejects it as a whole at
            APPROVED/REJECTED - never edits it. 0 < waiver_amount_minor <=
            return_fee_minor. Mandatory from REQUESTED onward.
        waiver_requested_by_staff_id: { type: [string, 'null'], format: uuid }
        waiver_approved_by_staff_id:
          type: [string, 'null']
          format: uuid
          description: Never equal to waiver_requested_by_staff_id (Sec28.4, MSC-DEC-163).
        waiver_decided_at: { type: [string, 'null'], format: date-time }
        effective_return_fee_minor:
          type: integer
          readOnly: true
          description: >-
            DERIVED - return_fee_minor minus waiver_amount_minor where waiver_status = APPROVED
            (a full waiver is waiver_amount_minor = return_fee_minor, giving zero), else
            return_fee_minor. Never independently set. Senior Ops discretion, no formula
            (Sec5.2.4, MSC-DEC-394).
        delivery_run_id: { type: [string, 'null'], format: uuid }
        delivery_stop_id: { type: [string, 'null'], format: uuid, description: Set when the return trip is built - the existing transport machinery - not a new one. }
        otp_validated_at: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [COMMITTED, IN_TRANSIT, COMPLETED], description: 'No CANCELLED value - decided by MSC-DEC-394, not omitted: a committed ReturnRecord always runs to completion.' }

    RecipientContactRecord:
      type: object
      required: [outcome]
      additionalProperties: false
      properties:
        outcome: { type: string, enum: [SUCCESSFUL, UNSUCCESSFUL] }
        reason_code:
          type: string
          description: >-
            Mandatory when UNSUCCESSFUL. Must be an ACTIVE reason valid for THIS checkpoint -
            REASON_NOT_VALID_FOR_CHECKPOINT otherwise. A PRE_DISPATCH
            reason is not selectable at a doorstep. **The seeded five**:
            NO_ANSWER, NUMBER_INCORRECT, RECIPIENT_DECLINED and CONTACT_NOT_POSSIBLE_MELARC at all
            three checkpoints, **RECIPIENT_NOT_AT_LOCATION at DOORSTEP only**.
            **consumes_delivery_attempt is false on all five and nothing reads it here**: only a
            DeliveryStop outcome increments Order.delivery_attempts, so a DOORSTEP contact failure
            is not a physical delivery attempt - the wait expiring and failDeliveryStop is.
        contact_number_used: { type: string }
        note: { type: string }
      description: |
        **No timer field exists here, deliberately**. wait_started_at and
        wait_expires_at are server-written; a client cannot post an expiry, and the failure guard
        reads authoritative time rather than a rider's claim that ten minutes passed.

    RecipientContactAttempt:
      type: object
      required: [id, order_id, checkpoint, performed_by_actor_type, performed_at, outcome]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        delivery_stop_id: { type: [string, 'null'], format: uuid }
        checkpoint:
          type: string
          enum: [PRE_DISPATCH, NEXT_STOP, DOORSTEP]
          description: >-
            THREE CONTACT CHECKPOINTS, NOT THREE DELIVERY TRIPS. Only DOORSTEP is
            reached by a rider who travelled, and only DOORSTEP can consume a physical attempt.
        performed_by_staff_id: { type: string, format: uuid }
        performed_by_actor_type:
          type: string
          enum: [RIDER, OPS]
          description: >-
            Either may perform PRE_DISPATCH, on the same canonical record. A rider is
            never made to repeat a call Ops already made.
        performed_at: { type: string, format: date-time }
        contact_number_used: { type: [string, 'null'] }
        outcome: { type: string, enum: [SUCCESSFUL, UNSUCCESSFUL] }
        reason_code: { type: [string, 'null'] }
        vendor_notification_state:
          type: [string, 'null']
          enum: [NOT_REQUIRED, REQUIRED, QUEUED, SENT, FAILED, ACKNOWLEDGED, null]
          description: >-
            A FAILED send is a visible operational state, never a deletion. The contact event
            survives a notification that never arrived.
        ops_followup_state:
          type: [string, 'null']
          enum: [NOT_REQUIRED, REQUIRED, IN_PROGRESS, RESOLVED, null]
        wait_started_at:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: DOORSTEP only. SERVER-SET.
        wait_expires_at:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: >-
            DOORSTEP only. SERVER-DERIVED as wait_started_at + doorstep_wait_minutes. The failure
            guard reads this, and DOORSTEP_WAIT_NOT_ELAPSED refuses an early failure.
        note: { type: [string, 'null'] }

    VendorContactAssistance:
      type: object
      required: [response_type]
      additionalProperties: false
      properties:
        response_type: { type: string, enum: [CORRECTED_NUMBER, ALTERNATIVE_CONTACT, CLARIFICATION, NO_FURTHER_INFORMATION] }
        contact_number: { type: string }
        contact_name: { type: string }
        note: { type: string }
      description: |
        **An input awaiting Ops, not a correction applied on arrival**. Nothing here
        mutates the recipient record.

    DeliveryLocationChangeRequest:
      type: object
      required: [requested_location]
      additionalProperties: false
      properties:
        requested_location: { $ref: '#/components/schemas/Location' }
        requested_by: { type: string, enum: [RECIPIENT, VENDOR] }
        note: { type: string }
      description: |
        **The original destination is never overwritten**. This records what was
        asked for; Ops decides what is authorised.

    RecipientConfirmation:
      type: object
      required: [order_id, state]
      properties:
        order_id: { type: string, format: uuid }
        state:
          type: string
          enum: [AWAITING_ATTEMPT, ATTEMPTED_NO_ANSWER, CONFIRMED, DETAILS_CORRECTION_REQUIRED, REFUSED, ESCALATED, MAX_ATTEMPTS_REACHED]
        # Renamed from `attempts` by MSC-DEC-310. Confirmation attempts and physical
        # delivery attempts are separate counters; an unqualified name lets three
        # unanswered calls exhaust a customer's doorstep entitlement.
        confirmation_attempts:
          type: array
          items:
            type: object
            properties:
              attempted_at: { type: string, format: date-time }
              actor_id: { type: string, format: uuid }
              performed_by_actor_type:
                type: string
                enum: [RIDER, OPS]
                description: >-
                  Who made the PRE_DISPATCH call. The rider's queue shows
                  'confirmed by Ops' from this, and does not call again.
              outcome: { type: string }
              note: { type: string }
        refined_location_note: { type: [string, 'null'] }
        escalated_at:
          type: [string, 'null']
          format: date-time
          description: >-
            Set when OPS JUDGES the contact avenues exhausted - never by a call
            count reaching a number. MAX_ATTEMPTS_REACHED remains in the enum for 36.8 and no
            current transition enters it.
      description: |
        **Only CONFIRMED makes an order run-eligible.** Reschedule, address correction and
        unreachable all hold it - three outcomes, one effect, and none of them a failure.

        **Either the assigned Rider or authorised Ops writes this record**; the
        canonical per-attempt row is RecipientContactAttempt with checkpoint PRE_DISPATCH, and
        confirmation_attempts is its projection here. **There is no fixed call ceiling**.
        

        36.8 warns that the approved product policy "does not approve the complete state model".
        The machine at state-machines.md 11 was signed by MSC-DEC-233 on 21 August against a
        three-call ceiling; MSC-DEC-351 retired it, and **seven rows are AMENDED and await
        Product Owner re-signature**. *Superseded description:* a reasoned set rather than a
        signed one.

    DeliveryRunCreate:
      type: object
      required: [order_ids, service_date]
      additionalProperties: false
      properties:
        order_ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        service_date: { type: string, format: date }
        courier_provider_id:
          type: string
          format: uuid
          description: >-
            24.4's registered courier for the run, where Ops selects one. Must name an ACTIVE
            CourierProvider, and dispatch revalidates it (24.5).
      description: |
        No rider and no sequence at creation - both are separately permissioned steps, because
        each carries its own rule.

    DeliveryStopOrder:
      type: object
      required: [ordered_stop_ids]
      additionalProperties: false
      properties:
        ordered_stop_ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
      description: The complete sequence, not a delta. Manual ordering only.

    DeliveryRun:
      type: object
      required: [id, code, state, service_date, responsible_hub_id]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        state:
          type: string
          enum: [DRAFT, DISPATCHED, IN_PROGRESS, COMPLETED, CANCELLED]
        service_date: { type: string, format: date }
        responsible_hub_id: { type: string, format: uuid }
        assigned_rider_id: { type: [string, 'null'], format: uuid }
        courier_provider_id: { type: [string, 'null'], format: uuid }
        assigned_at: { type: [string, 'null'], format: date-time }
        dispatched_at: { type: [string, 'null'], format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        stops:
          type: array
          items: { $ref: '#/components/schemas/DeliveryStop' }
      description: |
        **Hub-scoped, never vendor-scoped** - a run spans vendors.

        assigned_at, dispatched_at and started_at are **three distinct moments** stored
        separately, because each governs a different rule.

    DeliveryStop:
      type: object
      required: [id, order_id, sequence, state]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        sequence: { type: integer }
        state:
          type: string
          enum: [PENDING, ARRIVED, AWAITING_RECIPIENT, DELIVERED, FAILED, SKIPPED, HANDED_OVER]
          description: >-
            SIX states (state-machines.md 12.1). AWAITING_RECIPIENT is the server-timed doorstep
            wait after a failed DOORSTEP contact; the stop returns to ARRIVED when
            the recipient appears before expiry, or may FAIL after it.
        refined_location_note: { type: [string, 'null'] }
        arrived_at: { type: [string, 'null'], format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }
        failure_reason_code:
          type: [string, 'null']
          description: >-
            The ACTIVE Delivery Failure Reason Catalog code selected at the door, snapshotted.
            Not a closed enum: the five seeded defaults are
            RECIPIENT_UNAVAILABLE, ACCESS_DENIED, RECIPIENT_REFUSED, PAYMENT_NOT_COMPLETED and
            OTP_NOT_VERIFIED, and an approved operational reason may be added without a
            contract change. Mandatory on FAILED.
        consumed_delivery_attempt:
          type: [boolean, 'null']
          readOnly: true
          description: >-
            Snapshot of the selected reason's consumes_delivery_attempt at the moment of failure.
            History, never a position against a maximum - none
            exists.
        payment_taken: { type: boolean }
        otp_overridden: { type: boolean }
      description: |
        Six states - PickupStop's five plus AWAITING_RECIPIENT.
        Payment and OTP are **guards** on ARRIVED -> DELIVERED, not states, and the payment guard
        is the OperationalPaymentDemand being SETTLED. *Superseded description:*
        five states.

        **payment_taken may be true on a FAILED stop, and that is why the field exists.** A rider
        takes payment, the OTP will not validate, 36.9 forbids handover, and the stop fails
        carrying cash. The money is held for hub reconciliation, not refunded at the door.

        **Nothing may read `state` to decide what a rider is holding.** A FAILED delivery stop and
        a FAILED pickup stop are identical here and are not identical in fact.

        **failure_reason_code is a catalogue reference, not a closed enum**. The five
        seeded reasons were chosen because each ROUTES differently at the Ops queue,
        since 25.3 requires the reason to be adjudicable - and that routing test governs what may
        be ADMITTED to the catalogue, not whether anything may be. *Superseded description:* a
        closed enum of five.

        **otp_overridden is not the same thing as failure_reason_code OTP_NOT_VERIFIED.** One
        records a stop that COMPLETED without OTP, the other a stop that FAILED. Collapsing them
        hides every override inside the failure statistics - exactly where MSC-DEC-197's frequency
        control would stop working.

        `sequence` is a plan, not a constraint - a rider may work stops out of order.

    AssignableStaffRoleBundle:
      type: object
      required: [id, name, requires_platform_admin_approval]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: 'The value createStaffIdentity takes as role_bundle_id.' }
        name: { type: string, description: 'The display name the maker sees.' }
        requires_platform_admin_approval: { type: boolean, description: 'True when approving a profile that holds this bundle needs a Platform Admin.' }
      description: |
        The minimal projection `listAssignableStaffRoleBundles` returns (MSC-DEC-439; `RoleBundle` at
        domain-model.md 6.9). **No permission, no permission count and no holder is ever represented**:
        neither is needed to fill a form, and a maker below Platform Admin does not hold `permission.read`;
        the read that returns this projection is gated by `permission.assignable_bundle.read`.

        `requires_platform_admin_approval` reports the approval policy and grants nothing - the same
        flag that makes a Senior Ops approver `INSUFFICIENT_AUTHORITY` at `approveStaffIdentity`.

    StaffIdentityCreate:
      type: object
      required: [work_email, full_name, role_bundle_id]
      additionalProperties: false
      properties:
        work_email: { type: string, format: email }
        full_name: { type: string }
        phone: { type: string, description: E.164 }
        role_bundle_id: { type: string, format: uuid, description: 'An id returned by listAssignableStaffRoleBundles. One that names no bundle currently valid for human staff is VALIDATION_FAILED.' }
        primary_hub_id: { type: string, format: uuid }
      description: |
        **No `status` property, and that is the guard.** A settable status would let a caller create
        a record directly in `ACTIVE` and bypass 30.8's independent approval entirely - the whole
        control this operation exists to implement. Creation always lands in `PENDING_APPROVAL`.

        **No `created_by` either.** The maker is the authenticated caller, read from the session.
        A settable creator would defeat the same-actor exclusion by letting an approver name someone
        else as the creator and then approve their own work.

        `role_bundle_id` is required because `StaffIdentity.role_bundle_id` is non-null: 30.8 has the
        checker approve the person and their authority together. **Its producer is
        `listAssignableStaffRoleBundles`**.

    StaffIdentityApproval:
      type: object
      required: [approved]
      additionalProperties: false
      properties:
        approved: { type: boolean }
        reason_code: { type: string }
        note: { type: string }
      description: |
        `approved: false` rejects, and `reason_code` becomes mandatory - `REASON_REQUIRED`.

        **The bundle cannot be changed here.** There is no `role_bundle_id` property: an approver who
        could substitute a different bundle at the moment of approval would be granting authority
        nobody proposed and nobody else reviewed, which is single-actor authority wearing a
        maker-checker shape. Approving a different bundle means rejecting and creating again.

    BundleChangeProposal:
      type: object
      required: [to_role_bundle_id, reason_code]
      additionalProperties: false
      properties:
        to_role_bundle_id: { type: string, format: uuid }
        reason_code: { type: string }
        note: { type: string }
      description: |
        **No `from_role_bundle_id`.** The bundle in force is read from the record, never submitted.
        A client-supplied origin is the field that makes a stale proposal apply silently against a
        bundle that has since changed - the same reasoning that keeps an origin off
        `RunCustodyHandoverCreate`.

        Confirmed 26 August 2026 - MSC-DEC-248, signed under MSC-DEC-253.

    BundleChangeApproval:
      type: object
      required: [approved]
      additionalProperties: false
      properties:
        approved: { type: boolean }
        note: { type: string }
      description: |
        Ratifies or refuses the proposal as made. **No bundle field**, for the reason
        `StaffIdentityApproval` carries none: an approver who can alter what they approve is not a
        checker.

        Confirmed 26 August 2026 - MSC-DEC-248, signed under MSC-DEC-253.

    BundleChange:
      type: object
      required: [id, staff_identity_id, from_role_bundle_id, to_role_bundle_id, state, proposed_by]
      properties:
        id: { type: string, format: uuid }
        staff_identity_id: { type: string, format: uuid }
        from_role_bundle_id: { type: string, format: uuid }
        to_role_bundle_id: { type: string, format: uuid }
        state:
          type: string
          enum: [PROPOSED, APPROVED, REJECTED]
        proposed_by: { type: string, format: uuid }
        approved_by: { type: string, format: uuid, nullable: true }
        reason_code: { type: string }
        proposed_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time, nullable: true }
      description: |
        The permission-review record 30.3 requires - "permission-review history" - carrying both
        actors so the same-actor exclusion is auditable after the fact rather than only enforced at
        the call. It feeds `StaffIdentity.permission_review_history`.

    StaffIdentity:
      type: object
      required: [id, work_email, full_name, status, role_bundle_id, mfa_enrolled, created_by]
      properties:
        id: { type: string, format: uuid }
        work_email: { type: string, format: email }
        full_name: { type: string }
        phone: { type: string, nullable: true }
        status:
          type: string
          enum: [PENDING_APPROVAL, ACTIVE, REJECTED, SUSPENDED, OFFBOARDED]
        role_bundle_id: { type: string, format: uuid }
        primary_hub_id: { type: string, format: uuid, nullable: true }
        mfa_enrolled: { type: boolean }
        created_by: { type: string, format: uuid }
        approved_by: { type: string, format: uuid, nullable: true }
      description: |
        Entity at domain-model.md 6.8; machine at state-machines.md 13.3.

        **`PENDING_APPROVAL` and `REJECTED` were added on 24 August**. The enum began
        at `ACTIVE`, so a profile created under 30.8 and awaiting its independent approval had no
        state to occupy and the rule was inexpressible in the contract - CONFLICT-036.

        **No credential property, ever.** Hashed, never retrievable, never logged (6.8).

    PickupRequestHubReassignment:
      type: object
      required: [target_hub_id]
      additionalProperties: false
      properties:
        target_hub_id: { type: string, format: uuid }
      description: |
        **The target hub and nothing else - and at R1.1 that is now literally true.** R1 declared
        the rule and carried a second free-text `note` property beside it, so the guard the
        schema stated was not the guard it implemented. `responsible_hub_id` is not accepted,
        and neither is any other input: the server derives the resulting scope from the target
        hub it validated the actor against, and `additionalProperties: false` now stops a
        caller smuggling anything alongside the one property the operation reads.

        **No reason-code vocabulary is invented here**. Where the canonical override
        and audit rules already impose a reason, that rule applies unchanged.

    EvidenceRetrievalAuthorization:
      type: object
      required: [method, url, expires_at]
      additionalProperties: false
      properties:
        method: { type: string, description: HTTP method the client uses to fetch the one object }
        url:
          type: string
          description: |
            **Opaque, single-object, short-lived.** The client does not parse, modify or construct
            it. Changing the object key invalidates the signature; it confers no listing authority
            and expires with `expires_at`.
        headers:
          type: object
          additionalProperties: { type: string }
          description: Non-secret request headers the client must echo. Never a credential
        expires_at:
          type: string
          format: date-time
          description: |
            `evidence_retrieval_authorization_ttl_minutes` from issue - **5 minutes**.
            
      description: |
        **A temporary bearer capability, and it is treated as one.** It is never logged, never
        cached, never persisted and never returned in an audit payload - the same rule the session
        credential and the OTP already follow (38.2, 20.4).

        **`storage_ref` is still absent**, here as everywhere. Returning it would hand a client the
        address to construct its own retrieval and bypass `access_rule` entirely, which is the
        reason it is absent from both the create and the read schema.

    EvidenceCreate:
      type: object
      required: [owner_type, owner_id, purpose, captured_at, content_type, byte_size, checksum_sha256]
      additionalProperties: false
      properties:
        owner_type:
          type: string
          enum: [PICKUP_STOP, PICKUP_INTAKE, ORDER, DELIVERY_STOP, THIRD_PARTY_HANDOFF, MOTORCYCLE, FUEL_RECORD, VENDOR_ORGANIZATION, APPROVED_AGENT]
        owner_id: { type: string, format: uuid }
        purpose:
          type: string
          enum: [COLLECTION_PROOF, CONDITION, OSD, HANDOFF_RECEIPT, DELIVERY_PROOF, RETURN_PROOF, MAINTENANCE, FUEL, COMPLIANCE_DOCUMENT]
        captured_at:
          type: string
          format: date-time
          description: |
            **Field capture time, not upload time** (3.6). The rider app works under unreliable
            connectivity (7.8) and evidence routinely arrives hours later. Rejected if in the future.
        device_context: { type: object, additionalProperties: true }
        content_type: { type: string }
        byte_size: { type: integer, minimum: 1 }
        checksum_sha256: { type: string }
      description: |
        **No `storage_ref` property, and that is the guard.** The storage reference is assigned by the
        server. A client that could set it could point an evidence record at an object belonging to
        another vendor, another hub, or another parcel - and the record would look entirely legitimate.

        **No `access_rule` or `retention_policy` either.** Both are derived server-side from
        `owner_type` and `purpose`. A caller choosing its own retention would be setting data-protection
        policy per upload; periods are OQ-028 and the classification is not the client's.

        **No `state`.** Creation always lands in `PENDING_UPLOAD`.

    EvidenceUploadTicket:
      type: object
      required: [evidence, upload]
      properties:
        evidence: { $ref: '#/components/schemas/Evidence' }
        upload: { $ref: '#/components/schemas/EvidenceUploadInstruction' }

    EvidenceUploadInstruction:
      type: object
      required: [method, url, expires_at]
      properties:
        method: { type: string, description: HTTP method the client uses to send the bytes }
        url: { type: string, description: Opaque destination. The client does not parse or construct it }
        headers:
          type: object
          additionalProperties: { type: string }
        form_fields:
          type: object
          additionalProperties: { type: string }
          description: Present for form-style uploads; absent otherwise
        expires_at: { type: string, format: date-time }
      description: |
        **Deliberately opaque, and this is the design decision worth reviewing.** 39.4 requires the
        contract to define **upload initiation**, and OQ-048 recorded that the operation's shape
        "depends on the storage mechanism, presigned upload versus multipart."

        This envelope satisfies the first without deciding the second: a presigned `PUT`, a presigned
        form `POST`, and a direct multipart endpoint all express as `method` + `url` + optional
        `headers`/`form_fields`. **The client follows instructions rather than knowing a mechanism**,
        so choosing the provider later changes no schema and breaks no client.

        **The provider choice remains OQ-048.** What left OQ-048 is the *initiation contract*, which
        39.4 assigns to this document and 50.2 files as approved downstream design.

    Evidence:
      type: object
      required: [id, owner_type, owner_id, purpose, captured_at, captured_by_actor, state, access_rule, retention_policy]
      properties:
        id: { type: string, format: uuid }
        owner_type: { type: string }
        owner_id: { type: string, format: uuid }
        responsible_hub_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: |
            **Derived from the owner at creation and immutable**. The field the
            Hub row-level-security policy reads. Absent from EvidenceCreate for the same reason
            storage_ref is: a client that could set it would place a record in another hub's scope.

            **NULL exactly when `owner_type = VENDOR_ORGANIZATION`**. That owner
            has no hub, and R0's non-null rule forced an implementer to invent one - an invented
            hub is a real access grant, because whichever hub was chosen could read the object
            and the vendor's other hubs could not. Vendor ownership is the whole boundary there.
        vendor_organization_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: |
            **Derived from the owner at creation and immutable.** Null where the owner is
            vendor-neutral - MOTORCYCLE, FUEL_RECORD and APPROVED_AGENT evidence belongs to no
            vendor, and domain-model.md 4 already records PickupManifest and DeliveryRun as
            deliberately not vendor-owned.
        purpose: { type: string }
        captured_at: { type: string, format: date-time }
        captured_by_actor: { type: string, format: uuid }
        device_context: { type: object, additionalProperties: true, nullable: true }
        state:
          type: string
          enum: [PENDING_UPLOAD, STORED, EXPIRED]
        access_rule: { type: string }
        retention_policy: { type: string }
        content_type: { type: string, nullable: true }
        byte_size: { type: integer, nullable: true }
        uploaded_at: { type: string, format: date-time, nullable: true }
      description: |
        Entity at domain-model.md 3.6; lifecycle at state-machines.md 17.

        **`storage_ref` is absent from the read schema as well as the write schema.** 34.7 calls it an
        opaque storage reference; returning it would hand every client a key to construct its own
        retrieval URL, bypassing `access_rule` entirely. Retrieval is a separate operation gated by
        that rule - **and it is not written**, because 39.4's "access URLs" element binds to the
        storage service. OQ-091.

        **The two scope columns are read-only and derived, and they duplicate a fact the owner
        already holds.** That duplication is deliberate. 5.6 chose one polymorphic
        entity and recorded the cost as a reference "the database cannot constrain by foreign
        key" - a modelling inconvenience. Under row-level security it is a security property: a
        policy cannot follow owner_type/owner_id into eight different parent tables, so with no
        direct column the only enforceable answer is application-level filtering, which
        SOLUTION_ARCHITECTURE.md 6 rejects by name.

        **Gate B hardens the envelope and does not touch the lifecycle.** state-machines.md 17
        remains UNSIGNED.

        **`owner_type` and `owner_id` are immutable after creation.** Re-pointing evidence at a
        different record rewrites what the record proves, which 35.1.5 forbids for historical
        transactions.

    CashCollection:
      type: object
      required: [amount_minor]
      additionalProperties: false
      properties:
        amount_minor: { type: integer, minimum: 1 }
        fallback_authorization_id:
          type: string
          format: uuid
          description: >-
            REQUIRED where a provider attempt is unresolved. Created by authorised
            OPS - a rider supplies the id and can never issue one. The grant must authorise CASH
            for this demand and that attempt, and this collection CONSUMES it.
        note: { type: string }
      description: |
        **amount_minor is the physical tender actually taken, and nothing else.** It may be short
        of the demand's remaining due, equal to it, or over it: a short
        tender is preserved as a receipt and custody of that amount, never refused. What the
        rider may not do is record more than they physically hold - custody is accountability.

        **No expected_minor field.** The expectation was snapshotted at dispatch (domain-model.md
        6.11) and comparing the collection against a client-supplied expectation would make the
        check a transcription rather than a comparison - the same reasoning that keeps the rider's
        declared parcel count off HubIntakePreCount.

        **No order_id either** - the stop identifies the order. A settable order would let a
        collection be recorded against a parcel the rider is not standing in front of.

    DeliveryOtpSubmission:
      type: object
      required: [otp]
      additionalProperties: false
      properties:
        otp: { type: string }
      description: |
        **The OTP is submitted and never returned, logged or audited** (20.4). The audit records that
        validation occurred, with actor and timestamp, and never the value - the identical rule the
        collection handshake carries.

        **No recipient identity fields.** 25.1 rules out receiver name, relationship, signature and
        delivery photograph for Version 1. Possession and validation of the OTP IS the approved
        authorization and proof; adding a second identity capture would create a competing
        authorization model beside the approved one.

    OtpOverrideAuthorisation:
      type: object
      required: [reason_code]
      additionalProperties: false
      properties:
        reason_code: { type: string }
        note: { type: string }
      description: |
        Senior Ops authorising 25.1's extraordinary handover.

        **No otp field.** This operation exists precisely because no valid OTP is available; a
        schema accepting one would let the override be used to submit a code the backend would
        otherwise have rejected.

        **Reason is mandatory and the emitted event is enhanced.** The control on this path is that
        its FREQUENCY stays visible, not that its reason text is persuasive.

    DeliveryFailure:
      type: object
      required: [reason_code]
      additionalProperties: false
      properties:
        reason_code:
          type: string
          description: >-
            An ACTIVE code from the Delivery Failure Reason Catalog. The server
            rejects an unknown code, an INACTIVE code, and a code belonging to another reason
            domain. The reason - not this request - decides whether the customer's delivery
            attempt is consumed.
        note: { type: string }
        contact_attempts:
          type: array
          items: { $ref: '#/components/schemas/ContactAttempt' }
        evidence_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            Each id must name an evidence record in STORED (EVIDENCE_NOT_STORED otherwise).
            Whether evidence is REQUIRED is read from the reason definition.
      description: |
        **The reason is a catalogue reference, not a closed enum** - amended at Gate C R1.
        The five seeded reasons remain and remain routing-distinct; what changed is
        that adding an approved operational reason no longer requires a code deployment, and the
        CONSEQUENCE of a reason is read from the reason.

        **Attempt consumption is not in this payload and never was a rider's choice.** The
        catalogue entry carries `consumes_delivery_attempt`, so a Melarc outage records a failure
        without consuming a physical attempt against the customer - and a consumed
        attempt is history, not a position against a ceiling, because none exists.

        **The selected code is snapshotted onto the record** (3.7). Deactivating a reason later
        never makes an old failure unreadable, and a changed display label never rewrites history.

        **No terminal flag and no return trigger.** RECIPIENT_REFUSED consumes an attempt because
        its catalogue entry says so, and routes to the Ops decision queue. **Formal Return starts
        only when authorised Ops commits a ReturnRecord** - never because a counter
        reached three.

    NewAdHocSender:
      type: object
      description: >-
        First-use identity for a sender who has never used Melarc. Creating the
        reusable AdHocSender profile and the PickupRequest is one idempotent act - a retry must
        not mint a second sender identity.
      required: [name, phone]
      additionalProperties: false
      properties:
        name: { type: string }
        phone:
          type: string
          description: >-
            E.164, normalised; as-entered form retained server-side - the same shape every other
            phone field in this contract declares. It carried a $ref to a `Phone` schema that
            HAS NEVER EXISTED here, so a generated client broke on it (Gate C C1.6, Check 45).
            The verified phone identity. 29.6,
            MSC-DEC-172 makes this the sender's identity and
            MSC-DEC-258 attaches blocking to it, so it is also how a returning sender is found.
        business_name: { type: [string, 'null'] }
        pickup_contact_name: { type: [string, 'null'] }
        pickup_location: { $ref: '#/components/schemas/Location' }

    CollectionPoint:
      type: object
      description: >-
        The third party a COLLECT_FOR_VENDOR pickup collects from. Required for that intent and
        forbidden for the others.
      required: [contact_name, phone, location]
      additionalProperties: false
      properties:
        contact_name: { type: string, description: Pickup person or business }
        phone:
          type: string
          description: >-
            E.164, normalised. Second of the two dangling `Phone` references corrected at
            Gate C C1.6.
        location: { $ref: '#/components/schemas/Location' }
        landmark: { type: [string, 'null'], description: Where coordinates are unavailable }

    CollectionReference:
      type: object
      required: [reference_name]
      additionalProperties: false
      properties:
        reference_name: { type: string, description: The name the seller holds the item under }
        seller_order_reference: { type: [string, 'null'] }

    CollectionItem:
      type: object
      required: [description, quantity]
      additionalProperties: false
      properties:
        description: { type: string }
        quantity: { type: integer, minimum: 1 }
        evidence_id:
          type: [string, 'null']
          format: uuid
          description: Picture of the item, where the sender supplied one.
        handling_note: { type: [string, 'null'] }

    CashHandoverOpen:
      type: object
      required: [hub_id, declared_total_minor, custody_ids]
      additionalProperties: false
      properties:
        hub_id: { type: string, format: uuid }
        declared_total_minor: { type: integer, minimum: 0 }
        custody_ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
      description: |
        **The server applies eligible COLLECTION_CASH road expenses as part of opening**, and
        returns the handover already carrying applied_road_expense_ids, applied_expense_minor
        and system_expected_minor. No field here supplies any of them.

        **declared_total_minor is stated by the rider and is not validated against the sum of
        custody_ids.** The two figures exist to be compared by the hub (26.3); making the system
        derive one from the other would destroy the comparison it is required to perform.

    CashHandoverConfirm:
      type: object
      required: [confirmed_total_minor]
      additionalProperties: false
      properties:
        confirmed_total_minor: { type: integer, minimum: 0 }
        variance_reason_code: { type: string }
        note: { type: string }
      description: |
        The hub's own figure. **variance_reason_code is mandatory when confirmed_total_minor
        differs from system_expected_minor** - REASON_REQUIRED otherwise.

        **Variance is counted MINUS system expected, never counted minus declared**.
        Expected 125 / declared 125 / counted 125 is clean. Expected 125 / declared 100 /
        counted 100 is a variance of -25 even though the rider and the hub agree - agreement
        between two figures neither of which is authoritative proves nothing. Expected 125 /
        declared 125 / counted 120 is a variance of -5 the rider never disclosed.

        **The rider's declaration is a separate assertion**, kept and separately auditable: it
        is what the rider SAID, and a shortfall against it is a disclosure, not the variance.

        **The declared total is visible to the confirming officer** (MSC-DEC-254, closing OQ-092).
        This diverges from 22.4's blind parcel count deliberately: two actors survive, blindness does
        not, and unlike parcels, cash stays countable after receipt.

    CashVarianceResolution:
      type: object
      required: [reason_code]
      additionalProperties: false
      properties:
        reason_code: { type: string }
        note: { type: string }
      description: |
        **No adjustment amount.** The variance is already recorded as the difference between two
        stated figures; a settable amount here would let the disposition silently rewrite what was
        counted. 26.3 requires collection, custody, handover, receipt, variance, correction and
        closure to be separate auditable events - not one field that reconciles itself.

    RiderCashCustody:
      type: object
      required: [id, order_id, rider_id, expected_minor, state]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        rider_id: { type: string, format: uuid }
        expected_minor:
          type: integer
          description: >-
            Snapshotted at dispatch: the recipient amount then due for the trip, less anything
            already confirmed against the demand. A comparison figure, never a gate on custody.
            
        collected_minor:
          type: [integer, 'null']
          readOnly: true
          description: >-
            THE SUM of the confirmed CASH PaymentReceipts linked through cash_receipt_ids.
            GH50 then GH5 reads 5500. May be below expected_minor while the
            remainder is due or was paid digitally, and above it on an over-tender.
        cash_receipt_ids:
          type: array
          readOnly: true
          items: { type: string, format: uuid }
          description: >-
            Every CASH PaymentReceipt that increased this custody, in confirmed_at order. The
            provenance that traces GH55 in a pannier to two receipt facts.
        state:
          type: string
          enum: [EXPECTED, COLLECTED_BY_RIDER, HANDED_TO_HUB, RECONCILED, EXCEPTION_OPEN, RESOLVED]
        cash_handover_id: { type: [string, 'null'], format: uuid }
        collected_at: { type: [string, 'null'], format: date-time }
        resolution_reason_code: { type: [string, 'null'] }
      description: |
        Entity at domain-model.md 6.11; machine at state-machines.md 16.3, whose collection row
        was AMENDED at C1.9 and RE-SIGNED by the Product Owner on 4 September 2026,
        one of that package's 27 rows. Corrected at OQ-129 R1.2.

        **Custody accumulates by receipt and is not settlement**. A
        short tender is preserved as exactly what was taken; the delivery gate is the demand
        reaching SETTLED, never this record's state.

        **expected_minor is snapshotted at DISPATCH, not at the door** (35.1.5). Resolving it live
        would compare today's price against yesterday's collection and make every post-hoc repricing
        look like a rider shortage.

        **rider_id survives a RunCustodyHandover.** MSC-DEC-246 moves PARCELS between riders and says
        nothing about cash: money in a stranded rider's pocket does not move because their parcels
        did. Anything reading the run to find who holds the money is wrong on the day it matters.

        **A record exists whenever cash is due, whether or not the stop succeeded** (12.1.1).
        Creating custody only on DELIVERED loses precisely the cash hardest to account for.

    CashHandover:
      type: object
      required: [id, rider_id, hub_id, system_expected_minor, declared_total_minor, state]
      properties:
        id: { type: string, format: uuid }
        rider_id: { type: string, format: uuid }
        hub_id: { type: string, format: uuid }
        system_expected_minor:
          type: integer
          readOnly: true
          description: >-
            SERVER-DERIVED and never caller-supplied: gross cash collected minus
            applied approved COLLECTION_CASH road expenses. The rider supplies one figure and the
            hub supplies one; this third belongs to neither.
        gross_cash_minor:
          type: integer
          readOnly: true
          description: Gross recipient cash. Never rewritten by an expense.
        applied_expense_minor:
          type: integer
          readOnly: true
          description: Approved COLLECTION_CASH road expenses applied to THIS handover, once each.
        applied_road_expense_ids:
          type: array
          readOnly: true
          items: { type: string, format: uuid }
          description: >-
            Each expense is stamped with this handover and can never reduce another.
            
        declared_total_minor: { type: integer, description: Rider-declared }
        confirmed_total_minor: { type: [integer, 'null'], description: Hub-counted }
        variance_minor:
          type: [integer, 'null']
          readOnly: true
          description: >-
            confirmed_total_minor MINUS system_expected_minor. Signed. Measured against the SYSTEM
            figure, not against the rider's declaration - measuring it against what the rider said
            would let the rider set the target they are then measured against.
        state:
          type: string
          enum: [OPEN, CONFIRMED, VARIANCE_OPEN, CLOSED]
        variance_reason_code: { type: [string, 'null'] }
        custody_transferred_at:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: >-
            When the hub physically accepted the counted cash. Set on CONFIRMED AND on
            VARIANCE_OPEN - a variance is a financial state, not a reason to
            leave money attributed to a rider who no longer has it. PHYSICAL custody and
            FINANCIAL resolution are separately observable, and `state` carries the second.
        opened_at: { type: string, format: date-time }
        decided_at: { type: [string, 'null'], format: date-time }
      description: |
        A coined record (GLOSSARY.md) - 26.3 requires the comparison and names nothing to hold it.
        Machine at state-machines.md 16.4, AMENDED at Gate C R1 and RE-SIGNED by the Product
        Owner on 4 September 2026, three of that package's 27 rows. Corrected at
        OQ-129 R1.2.

        **The reconciliation is three-way, and R1 made it so.** The signed guard required only that
        the hub's count equal the rider's declaration - two figures, both supplied by parties who
        can both be wrong. Expected 125, declared 100, counted 100 reached CONFIRMED cleanly and a
        GH25 shortage left no trace. A clean handover now requires
        system_expected_minor = declared_total_minor = confirmed_total_minor.

        **confirmed_total_minor is written by a hub actor and never by the rider** (26.3). Enforced
        by payment.cash.confirm, which no rider bundle holds.

        **declared_total_minor IS visible to the confirming officer** (MSC-DEC-254, closing OQ-092)
        - a deliberate divergence from 22.4's blind parcel count. Separation of actors survives;
        independence of the second figure does not. Unlike parcels, cash stays countable.

        **A rider under-declaring against a correct system figure produces a variance AND a
        disclosure**, and both are kept: the declaration stays separately auditable.

    CredentialSetup:
      type: object
      required: [setup_token, password]
      additionalProperties: false
      properties:
        setup_token:
          type: string
          description: 'The single-use grant token. Never returned, never logged.'
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: |
            12 to 128 characters, counted in Unicode code points after NFKC normalisation.
            Spaces are permitted and no composition rule applies: no mandatory case, digit or symbol.
            Never trimmed, truncated or echoed. Argon2id-hashed server-side.
            `minLength` and `maxLength` check the string as sent and are a pre-filter; the service
            applies the rule after normalisation and is the authority (Gate PD-3R2).
      description: |
        **No identity id.** The principal is resolved from the grant, which is principal-bound. A
        settable identity would let a grant issued for one employee establish another's credential.

        **No bundle, status or mfa_enrolled.** Setup establishes a credential and changes no
        authority whatever.

    CredentialSetupResult:
      type: object
      required: [authentication_ready]
      properties:
        authentication_ready: { type: boolean, description: True for ordinary Ops Staff; false for privileged identities until MFA is proven }
        mfa_enrolment_required: { type: boolean }
        mfa_provisioning:
          $ref: '#/components/schemas/MfaProvisioning'
        mfa_setup_token:
          type: [string, 'null']
          description: 'The MFA_ENROLMENT continuation grant, present only for privileged identities.'
      description: |
        **No session, no token, for either path**. Establishing a credential is not
        authenticating, and a privileged identity is deliberately still unable to hold a session
        here.

    MfaProvisioning:
      type: object
      required: [otpauth_uri]
      properties:
        otpauth_uri: { type: string, description: Standard otpauth:// provisioning URI for the authenticator app }
      description: |
        Returned **once**, at provisioning, so the authenticator can be configured. The seed is
        stored encrypted server-side because verification requires recomputing codes
        from it - the one credential here that cannot be hashed - and is **never** returned again,
        logged, or written to an audit event.

    MfaEnrolment:
      type: object
      required: [setup_token, totp_code]
      additionalProperties: false
      properties:
        setup_token: { type: string }
        totp_code: { type: string }
      description: |
        **The code is proof, not configuration.** A factor provisioned but never proven stays
        PENDING and is not MFA.

    MfaEnrolmentResult:
      type: object
      required: [authentication_ready]
      properties:
        authentication_ready: { type: boolean }
      description: |
        **No session.** The identity now signs in normally with password plus TOTP. Issuing a
        session here would make enrolment an authentication path that skipped the password.

    MfaReset:
      type: object
      required: [reason_code]
      additionalProperties: false
      properties:
        reason_code: { type: string }
        note: { type: string }
      description: |
        **No disable flag and no factor field.** Reset revokes and re-issues; there is no shape in
        which this operation leaves a privileged identity able to authenticate without a factor.
        

    MfaResetResult:
      type: object
      required: [sessions_terminated]
      properties:
        sessions_terminated: { type: integer, description: Terminated with MFA_RESET }
        reenrolment_grant_issued: { type: boolean }
      description: |
        The re-enrolment grant is delivered to the target's verified work email, **never returned in
        this response** - the acting Platform Admin must not be able to complete the target's
        enrolment.

    DeviceEnrolmentGrant:
      type: object
      required: [enrolment_uri, expires_at]
      additionalProperties: false
      properties:
        enrolment_uri:
          type: string
          description: |
            The deep link the Ops Portal renders as a QR code for the rider to scan. Carries the
            single-use RIDER_DEVICE_ENROLMENT grant, and the single-use attestation challenge the
            handset binds into its key attestation. Never logged, audited or cached.
        expires_at:
          type: string
          format: date-time
          description: Ordinary SetupGrant lifetime - recovery_link_ttl_minutes, 30.
        rider_id:
          type: string
          format: uuid
          description: The rider this grant is bound to. Display only, so the officer can confirm.
      description: |
        **The in-person enrolment handoff**.

        **This schema previously returned `expires_at` and nothing else**, on the reasoning that
        an officer holding the token could enrol a device the rider never touched. The reasoning
        was sound and the consequence was that **the flow could not be completed at all**:
        completeRiderDeviceEnrolment requires a `setup_token`, and no operation, response or
        documented transport ever put one in the rider's hands. Both rider lifecycles terminated
        here.

        **The resolution keeps the property the omission was protecting.** The officer's screen
        shows a QR code, not a secret to transcribe; the credential travels from the Ops Portal
        display to the rider's own handset by scan, in the officer's presence - which is the
        in-person ceremony MSC-DEC-235 already requires. Senior Ops is the authority approving
        this binding, so displaying the QR discloses nothing to them they do not already control.

        **What Senior Ops still never learns:** the rider's PIN, the rider's private key, and the
        rider's Session credential. The grant authorises enrolment completion and nothing else -
        it is not a session, and it carries no business authority.

        Responses carrying it set `Cache-Control: no-store` and are excluded from logs, analytics
        and audit payloads.

    RiderDeviceEnrolment:
      type: object
      required: [setup_token, public_key, pin, key_attestation]
      additionalProperties: false
      properties:
        setup_token:
          type: string
          description: |
            From the QR the Ops Portal displayed at registerRiderDevice or reregisterRiderDevice.
            Purpose RIDER_DEVICE_ENROLMENT or RIDER_DEVICE_REREGISTRATION,
            rider-bound and single-use.
        public_key: { type: string, description: Public half only. The private key is non-exportable and never leaves the handset }
        pin:
          type: string
          pattern: '^[0-9]{6}$'
          description: |
            Established by the rider: six numeric digits. Argon2id-hashed with a server-side
            pepper. Setting it resets the credential's failed-attempt count.
        key_attestation:
          type: object
          required: [certificate_chain]
          additionalProperties: false
          properties:
            certificate_chain:
              type: array
              minItems: 1
              maxItems: 10
              items: { type: string, description: One base64 DER certificate - leaf first }
          description: |
            The Android Key Attestation chain for the key in `public_key`, produced by the handset
            for this enrolment with the attestation challenge issued with the grant.
            **Producer:** the Rider app. **Verifier:** the backend, before the device is registered;
            the handset's say-so is never trusted. **Lifecycle:** used once, at enrolment or
            replacement; the chain is not stored by value and is never logged. Required, so a
            client that cannot produce one cannot enrol. **The chain is bounded at ten certificates**:
            an Android attestation chain is a handful, so ten is a generous bound and not a measured
            one - an engineering parameter the Backend Engineer confirms. A longer chain is
            `VALIDATION_FAILED` and is not parsed.
      description: |
        **No private key field exists and never will.** A schema able to accept one would defeat
        hardware-backed possession entirely.

        **The PIN arrives from the rider's own device**, not from the registering officer's screen.

    RiderChallengeRequest:
      type: object
      required: [phone]
      additionalProperties: false
      properties:
        phone: { type: string, description: E.164 }
      description: |
        **Deliberately minimal, and deliberately uninformative in reply.** See the operation: a
        challenge is issued the same way whether or not the number is a registered rider.

    RiderChallenge:
      type: object
      required: [challenge, expires_at]
      properties:
        challenge: { type: string, description: Single-use nonce to be signed by the registered private key }
        expires_at: { type: string, format: date-time }
      description: |
        **Carries no account state** - no name, no hub, no device status, no indication that the
        number is known. Anything more would make this an enumeration endpoint (37.7).

    VendorCredentialSetup:
      type: object
      required: [setup_token, secret]
      additionalProperties: false
      properties:
        setup_token: { type: string }
        secret:
          type: string
          minLength: 12
          maxLength: 128
          description: |
            12 to 128 characters, counted in Unicode code points after NFKC normalisation.
            Spaces are permitted and no composition rule applies: no mandatory case, digit or symbol.
            Never trimmed, truncated or echoed. Argon2id-hashed server-side.
            `minLength` and `maxLength` check the string as sent and are a pre-filter; the service
            applies the rule after normalisation and is the authority (Gate PD-3R2).
      description: |
        **No device identifier field.** The server generates the browser device credential and
        delivers it as a cookie; nobody types one.

        **No administrator supplies the secret** - it is set here by the vendor and never learned by
        Melarc staff.

    AdditionalDeviceEnrolment:
      type: object
      required: [setup_token]
      additionalProperties: false
      properties:
        setup_token: { type: string }
      description: |
        **The token is the only field, and the omissions are the design.** No account identifier -
        the `VENDOR_DEVICE_ENROLMENT` grant is principal-bound, and accepting one would let a
        caller nominate whose browser is registered. No secret - this operation registers a
        browser and **does not rotate the shared secret** (vendor-authentication.md 5.5). No device
        identifier - the server generates the credential and delivers it as a cookie, the same rule
        `VendorCredentialSetup` follows.

    RegisteredDevice:
      type: object
      required: [id, principal_type, principal_id, device_kind, status]
      properties:
        id: { type: string, format: uuid }
        principal_type: { type: string, enum: [RIDER, VENDOR] }
        principal_id: { type: string, format: uuid }
        device_kind: { type: string, enum: [RIDER_ANDROID_KEYPAIR, VENDOR_BROWSER_CREDENTIAL] }
        status: { type: string, enum: [ACTIVE, REPLACED, REVOKED] }
        registered_at: { type: string, format: date-time }
        registered_by: { type: [string, 'null'], format: uuid }
      description: |
        Entity at domain-model.md 6.8.

        **Neither secret is ever returned.** `public_key` is not exposed because nothing outside the
        server needs it, and `device_credential_hash` is a hash the client must never see - the
        vendor's browser holds the credential itself in a cookie it cannot read either.

        **The record is identified by `id`, and nothing a client sends selects it**.
        Possession is proved by signature for a rider and by the device-credential cookie for a
        vendor browser. The former `device_identifier` string proved nothing and is retired.

    RiderSessionIssued:
      type: object
      required: [session, access_token, token_type]
      properties:
        session:
          $ref: '#/components/schemas/Session'
        access_token:
          type: string
          description: 'The newly issued opaque Session secret. Returned exactly once, here.'
        token_type:
          type: string
          enum: [Bearer]
      description: |
        **The only response in the contract that returns a raw Session credential** (MSC-DEC-261, R1).

        Gate A returned the canonical `Session` resource from rider sign-in while deliberately
        keeping the credential off that schema - which left Melarc Rider correctly authenticated and
        holding nothing to send on the next request.

        **This does not weaken the rule; it states it precisely**. Canonical
        `Session` resource representations never contain raw credentials - getCurrentSession and
        any session listing return `Session`, never this. A credential-ISSUANCE response
        necessarily returns the opaque token once, because there is no other moment at which the
        client can receive it.

        The browser surfaces have the equivalent moment too, and it is a `Set-Cookie` header rather
        than a body field - which is why they need no schema like this one.

        **No CSRF token accompanies it.** A Bearer credential is not attached automatically by a
        browser, so a rider request is not cross-site-forgeable and carries no synchronizer token.

        `access_token` is stored on Android **only** in OS-backed secure credential storage, is
        never persisted server-side in plaintext, and never appears in logs, audit payloads,
        diagnostics or analytics.

    MfaReenrolmentBegin:
      type: object
      required: [setup_token]
      additionalProperties: false
      properties:
        setup_token:
          type: string
          description: 'The MFA_REENROLMENT grant issued by resetStaffMfa.'
      description: |
        **No TOTP code.** This operation provisions a factor; it cannot activate one. Activation
        requires the continuation grant plus a proven code at completeMfaEnrolment.

    MfaReenrolmentBegun:
      type: object
      required: [mfa_provisioning, mfa_setup_token]
      properties:
        mfa_provisioning:
          $ref: '#/components/schemas/MfaProvisioning'
        mfa_setup_token:
          type: string
          description: 'Short-lived MFA_ENROLMENT continuation grant. Ordinary security-link lifetime.'
      description: |
        **No session, and no authentication readiness yet.** The factor is `PENDING` until a code is
        proven. A response that made the principal ready here would let a reset authorisation stand
        in for possession of the new authenticator.

    CsrfIssued:
      type: object
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
          description: 'Echo this in X-CSRF-Token on unsafe cookie-authenticated requests.'
      description: |
        **Documented for completeness; the browser normally reads it from the `melarc_csrf` cookie**
        rather than from a body.

        That cookie is deliberately **not** `HttpOnly` - the page must read it to echo it, which is
        what makes a synchronizer token work. It is safe precisely because it is useless without the
        `HttpOnly` session cookie that JavaScript cannot read.

    AccountingExport:
      type: object
      required: [id, scope, period_from, period_to, schema_version, status, requested_by_staff_id, requested_at]
      properties:
        id: { type: string, format: uuid }
        scope:
          type: string
          enum: [SINGLE_HUB, ALL_HUBS]
          description: |
            `AccountingExportScope` (errors-and-enums.md §6). **`ALL_HUBS` requires the all-hubs
            scope of `payment.ledger.export`**, and `SINGLE_HUB` requires it too — no hub-scoped
            variant of the key exists.
        hub_id:
          type: [string, 'null']
          format: uuid
          description: '**Mandatory for `SINGLE_HUB`, null for `ALL_HUBS`.**'
        period_from:
          type: string
          format: date
          description: |
            First day of the closed hub-day range, **inclusive**.
        period_to:
          type: string
          format: date
          description: |
            Last day of the closed hub-day range, **inclusive**. **Every day in the range must
            have a closed `HubCashReconciliation`** or the request is refused
            with `PERIOD_NOT_RECONCILED`.
        schema_version:
          type: string
          description: |
            **The EXPORT-FORMAT version, versioned independently of this contract's
            `info.version`.** A consumer pins the format it parses here; bumping `openapi.yaml`
            does not change a package, and changing the package format does not bump
            `openapi.yaml`.
        status:
          type: string
          enum: [REQUESTED, GENERATED, FAILED]
          description: |
            `AccountingExportStatus` (errors-and-enums.md §6). **No machine**, and
            state-machines.md §20.7 records why: no transition after creation is any actor's
            decision. **A retry is a new record, never a transition** — there is deliberately no
            `REGENERATING` state and no path back to `REQUESTED`.
        requested_by_staff_id:
          type: string
          format: uuid
          description: The holder of `payment.ledger.export` who requested it.
        requested_at: { type: string, format: date-time }
        generated_at:
          type: [string, 'null']
          format: date-time
          description: Non-null from `GENERATED`.
        failure_reason_code:
          type: [string, 'null']
          description: '**Mandatory on `FAILED`**, null otherwise.'
        manifest_digest:
          type: [string, 'null']
          description: |
            SHA-256 of the package manifest. Non-null from `GENERATED`. **SURVIVES FILE
            EXPIRY** — it is how the content of a vanished package stays attestable.
        row_counts:
          type: [object, 'null']
          additionalProperties: { type: integer, minimum: 0 }
          description: |
            Per-record-type row counts, keyed by `record_type` and **mirroring the manifest**.
            **SURVIVES FILE EXPIRY.**
        file_available_until:
          type: [string, 'null']
          format: date-time
          description: |
            Computed at generation from `accounting_export_file_retention_days`; **null before
            generation**, and null-valued settings are why `requestAccountingExport` refuses
            with `EXPORT_RETENTION_NOT_CONFIGURED` rather than generating a file with no stated
            expiry.

            **AVAILABILITY IS DERIVED BY COMPARISON, NOT BY A STATUS.** Past this instant the
            package is gone and `createAccountingExportRetrievalAuthorization` returns
            `EXPORT_FILE_EXPIRED`, while this record and every field above it stay readable.
      description: |
        **A canonical extract of payment facts for a closed period. Creates no accounting entry
        and moves no money**. Entity at domain-model.md §6.12, whose field table
        this mirrors.

        **THE RECORD IS PERMANENT; THE FILE IS NOT.** `manifest_digest` and `row_counts` outlive
        `file_available_until`, so the fact that an export happened — and what it contained —
        is answerable after the package is gone.

        **A package is never regenerated in place.** A re-run is a **new record**, which is
        §5.5's own rule that a fact is never rewritten and a correction is a new record.

        **`storage_ref` IS ABSENT, AND THE OMISSION IS THE CONTRACT** (rule 2 of this document's
        §42.3 rules; the same absence `Evidence` takes). The entity carries it and describes it
        as *"never returned to a client"* — returning it would hand a caller the address to
        construct its own retrieval and bypass the authorization entirely. Retrieval is a
        short-lived authorization over one object, never a stored URL.

    AccountingExportRequest:
      type: object
      required: [scope, period_from, period_to, schema_version]
      additionalProperties: false
      properties:
        scope:
          type: string
          enum: [SINGLE_HUB, ALL_HUBS]
        hub_id:
          type: [string, 'null']
          format: uuid
          description: |
            **Required when `scope` is `SINGLE_HUB`; must be absent or null for `ALL_HUBS`.**
            Conditional on another property, so it is not in `required` — the invalid
            combinations are refused with `VALIDATION_FAILED` rather than tolerated.
        period_from: { type: string, format: date }
        period_to: { type: string, format: date }
        schema_version:
          type: string
          description: |
            The export format the caller intends to receive. **Part of the idempotency key** —
            the same period at a different schema version is a different package.
      description: |
        **The request carries what an export is OF, and nothing about what it becomes.**

        **No `status`, no `id`, no `generated_at`, no `manifest_digest`, no `row_counts`, no
        `file_available_until` and no `storage_ref`.** Every one of those is derived by the
        server, and `additionalProperties: false` stops a caller smuggling one alongside the
        four properties this operation reads — a caller able to set `status` could declare an
        export `GENERATED` that was never generated.

        **IDEMPOTENT ON (`scope`, `hub_id`, `period_from`..`period_to`, `schema_version`) WHILE
        A `REQUESTED` RECORD EXISTS.** A retry returns that record and queues no second package.

    AccountingExportManifest:
      type: object
      required: [schema_version, scope, period_from, period_to, generated_at, files]
      properties:
        schema_version:
          type: string
          description: |
            **The export-format version, versioned independently of `openapi.yaml`, and carried
            in the package name as well as here.**

            **Four of the format's cross-cutting representations are ALREADY FIXED by approved
            contract, and a package follows them rather than restating them.** They are named
            here so that no export-format version can quietly choose differently, and so that a
            reader does not mistake a settled convention for an open one:

            - **Money** — a **minor-unit integer** with its currency code alongside; `GHS` is
              the only value Version 1 permits. **Never a float, never a decimal string**
              (domain-model.md §3.2, §34.6, `MSC-DEC-179`).
            - **Timestamps and zone** — stored and exported as **UTC instants**, and **an
              export carries an explicit offset**. domain-model.md §3.3 says so directly:
              *"Exports and anything readable outside Ghana carry an explicit offset."* The
              operating timezone is **`Africa/Accra`** (47.1, `MSC-DEC-035`–`037`), and the
              no-timezone-label display convention of `MSC-DEC-203` is a **display** rule that
              this exception explicitly removes an export from.
            - **Dates** — a calendar date is a `date`, **not an instant** (§3.3), which is why
              `period_from` and `period_to` are dates and `generated_at` is not.
            - **Identifiers** — the exported identifier is the **UUID v7** primary identifier,
              never the human-readable operational code, which domain-model.md 3.1 makes an attribute rather
              than an identifier precisely because it is mutable.

            **What `schema_version` itself pins is what no approved decision has yet fixed**,
            and it is what a consumer keys its parser on: the exact ordered column list for each
            of the twelve record types, the CSV dialect (delimiter, quoting, escaping, line
            terminator and encoding — stated, not assumed), the single unambiguous null
            representation and how it is distinguished from an empty string, the serialised
            token for every boolean and enumeration, the deterministic row ordering, and the
            compatibility rule for what may be added within a version and what forces a new one.
            **Those tables are the export-format specification's, not this contract's** — a
            column list that lived in two documents would drift between them, and **inventing
            values for them here would put unapproved facts into an `APPROVED` document.**
        scope:
          type: string
          enum: [SINGLE_HUB, ALL_HUBS]
        hub_id:
          type: [string, 'null']
          format: uuid
          description: '**Mandatory for `SINGLE_HUB`, null for `ALL_HUBS`** — the same rule the record carries.'
        period_from: { type: string, format: date }
        period_to: { type: string, format: date }
        generated_at:
          type: string
          format: date-time
          description: |
            When this package was generated. **Deliberately excluded from the reproducibility
            guarantee below** — it is the one field that legitimately differs between two runs
            over identical source facts.
        files:
          type: array
          description: |
            One entry per record type in the package. `row_count` mirrors the record's
            `row_counts`, and `sha256` is the guarantee's unit.
          items:
            type: object
            required: [record_type, filename, row_count, sha256, representation]
            properties:
              record_type:
                type: string
                description: The canonical source record type this file carries, e.g. `PaymentAllocation`.
              filename:
                type: string
                description: |
                  **Stable and deterministic, carrying scope and period**, so that two packages
                  for the same period are comparable by name before they are opened.
              row_count: { type: integer, minimum: 0 }
              sha256:
                type: string
                description: |
                  SHA-256 of **this file's canonical CSV payload**, not of the container. This
                  is the value the reproducibility guarantee is about.
              representation:
                type: string
                enum: [EVENT_COMPLETE, CREATION_ONLY]
                description: |
                  `RecordRepresentation` (errors-and-enums.md §6). **`EVENT_COMPLETE` means
                  every state change of the type is emitted as an event row; `CREATION_ONLY`
                  means only the creating event is emitted and post-creation transitions of the
                  type are NOT represented in the package.**

                  **`EVENT_COMPLETE` IS EARNED PER FIELD AND NEVER INFERRED FROM TIMESTAMP
                  COVERAGE.** A type whose every transition is stamped still fails where one
                  exported field cannot be reconstructed as at that instant —
                  `FinancialAdjustmentResolution` is exactly that case, complete in timestamps
                  and blocked by a single `reason_code` written by both the proposal and the
                  decision.

                  **While ANY entry here reads `CREATION_ONLY`, canonical generation is
                  unavailable** and `requestAccountingExport` refuses with
                  `EXPORT_SOURCE_NOT_EVENT_COMPLETE`. Four of the twelve types are
                  `EVENT_COMPLETE` today.
      description: |
        **The package manifest** — what this export contains, at what format version, and how
        completely each record type is represented. The digest of this document is the record's
        `manifest_digest`, which outlives the package itself.

        Regenerated canonical CSV payloads for the same hub, period, schema version and closure instant
        are byte-identical, and therefore reproduce the same per-file sha256 values. generated_at may
        differ between runs, and the ZIP container's own bytes and hash are NOT guaranteed stable.

        **That paragraph is the guarantee in full, and its last clause is load-bearing.** ZIP
        containers carry their own timestamps and ordering, so a container hash asserted as
        stable would be an assurance that fails the first time anyone tests it — **an
        overstated guarantee is worse than none.** A consumer that needs to prove two runs
        agree compares the per-file `sha256` values, never the archive.

    AccountingExportEventRow:
      type: object
      required: [record_type, record_id, event_type, effective_at, attributes]
      properties:
        record_type:
          type: string
          description: The canonical source record type, e.g. `PaymentAllocation`.
        record_id:
          type: string
          format: uuid
          description: |
            The source record this event belongs to.

            **THIS IS NOT A PRIMARY KEY.** It **recurs once per lifecycle event**, and across
            periods — a record created in one period and settled in the next appears in both
            packages under the same `record_id`. **A consumer that keys on it silently drops
            transitions**, which is a defect that shows up as a reconciliation that is quietly
            short rather than as an error. The key is (`record_type`, `record_id`,
            `event_type`, `effective_at`).
        event_type:
          type: string
          description: |
            The lifecycle event this row is emitted for — **named for the state reached**, or
            `CREATED` where the record carries no status.
        effective_at:
          type: string
          format: date-time
          description: |
            **THE MELARC-AUTHORITATIVE OCCURRENCE TIMESTAMP DEFINED FOR THAT EVENT TYPE, AND
            NOTHING ELSE.** It is named per record type and per event type — `created_at` for a
            demand's `CREATED`, `frozen_at` for its `FROZEN`, the linked
            `PaymentReceipt.confirmed_at` for a `PaymentAttempt`'s `SUCCEEDED` because that is
            **Melarc's acceptance rather than the provider's clock**.

            **THIS ROW'S `effective_at` DECIDES ITS PERIOD, AND NOTHING ELSE DOES.** A provider
            timestamp may be exported as data in its own column under `attributes` and **must
            never determine the accounting-export period**: a backdated provider success routing
            a row into a closed period is the exact failure the late-facts rule prohibits — late
            facts are recognised in the period they become authoritative **in Melarc**, never
            back-posted, and a closed period is never rewritten.

            **`PaymentAttempt.PENDING` IS CARRIED AS UNSETTLED, NOT AS SETTLED.**
            `provider_initiated_at` is written by the adapter at `CREATED → PENDING`, so the
            *event* is Melarc's — but **the field is provider-named and nothing states whether
            the value is Melarc's clock or the provider's payload**, and that difference decides
            whether it may determine a period at all. It is recorded here as an open question
            rather than resolved by this contract, and an implementer must not read its presence
            in the matrix as an approval.

            **An event with no authoritative effective timestamp is not emitted.** That is why
            eight of the twelve record types are `CREATION_ONLY` rather than partially complete.
        status_after:
          type: [string, 'null']
          description: |
            The status the record holds **after** this event. **Null for the two record types
            that carry no status at all** — a tri-state would make "no status" and "status
            unknown" the same value.
        attributes:
          type: object
          additionalProperties: true
          description: |
            **The record type's allowlisted columns, valued AS AT this event's `effective_at`**
            — not as at generation time. The exact ordered column list per record type is fixed
            by `schema_version` and lives in the export-format specification.

            **The allowlist excludes contact data and free text** (`payer_msisdn`,
            `payer_msisdn_masked`, `payer_context`, `destination`, `note`, `failure_detail`,
            `terminal_reason`), **idempotency keys** (`business_key`, `source_key`) and
            **deprecated fields** (`PaymentAttempt.obligation_ref`). **Controlled identifiers
            are kept** — `hub_id`, `order_id`, `rider_id`, `*_staff_id`, `payer_ref`, record
            foreign keys and `evidence_id` — because the export uses controlled identifiers and
            carries no name, phone number, address or `Evidence` content.

            **A Melarc transition timestamp is never an attribute column.** It appears only as
            the `effective_at` of its own event row. The exception is a timestamp that is **not**
            a Melarc event stamp — a provider-supplied one such as
            `PaymentAttempt.provider_confirmed_at` — which is exported here as data and never
            determines the period.
      description: |
        **One row of one record type's file: a LIFECYCLE EVENT, not a current-state snapshot.**
        Rendering a status is not exporting a change, and a period's package has to carry what
        happened in that period rather than what is true today.

        **Row ordering within a file is deterministic and fixed by `schema_version`**, which is
        what makes two runs byte-identical and the per-file `sha256` reproducible.

        **Where a record type's `representation` is `CREATION_ONLY`, only its creating event
        appears here** and its post-creation transitions are absent from the package — declared
        in the manifest rather than left to be discovered.

    AccountingExportRetrievalAuthorization:
      type: object
      required: [method, url, expires_at]
      additionalProperties: false
      properties:
        method: { type: string, description: HTTP method the client uses to fetch the one object }
        url:
          type: string
          description: |
            **Opaque, single-object, short-lived.** The client does not parse, modify or
            construct it. Changing the object key invalidates the signature; it confers no
            listing authority and expires with `expires_at`.
        headers:
          type: object
          additionalProperties: { type: string }
          description: Non-secret request headers the client must echo. Never a credential
        expires_at:
          type: string
          format: date-time
          description: |
            `accounting_export_retrieval_authorization_ttl_minutes` from issue — **5 minutes**
            (settings.md v1.38), matching evidence's TTL.
      description: |
        **A temporary bearer capability, and it is treated as one.** It is never logged, never
        cached, never persisted and never returned in an audit payload — the same rule the
        session credential, the OTP and the evidence authorization already follow (§38.2,
        §20.4). `payment.ledger.export_retrieval_authorized` records that a capability was
        issued and **never the URL itself** (audit.md §9).

        **This is a capability over ONE package, not a download and not a feed.** There is no
        anonymous read, no listing, no public ACL and no permanent URL, and nothing here streams
        bytes through the API.

        **`storage_ref` is still absent**, here as everywhere. Returning it would hand a client
        the address to construct its own retrieval and bypass the authorization entirely, which
        is the reason it is absent from the record schema as well as this one.
