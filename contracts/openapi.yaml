  /pickup-manifests/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      operationId: getPickupManifest
      # SAFE READ. No CSRF: a synchronizer token defends state change, and a read
      # changes none. Requiring it here would train clients to send it everywhere.
      security:
        - browserSession: []
        - riderSession: []
      x-permission: pickup.read
      x-error-codes: [HUB_SCOPE_VIOLATION, NOT_FOUND, PERMISSION_DENIED, SESSION_INVALID]
      tags: [pickup-manifests]
      summary: Manifest detail with ordered stops
      description: |
        `pickup.read`. **What a refusal reveals depends on who asks** (MSC-DEC-432, Gate PD-3R1): a staff
        member who asks for an existing manifest outside their hubs is `HUB_SCOPE_VIOLATION` and one who
        asks for a manifest that does not exist is `NOT_FOUND`; **a Rider who asks for a manifest that is
        not assigned to them is `NOT_FOUND`, identical in status, code, body shape and timing class to a
        manifest that does not exist** (19.2, 37.3). A rider is never told that a colleague's run exists.
      responses:
