# Melarc Platform API — proving-slice scope
#
# Status:  APPROVED
# Version: 5.75
# Date:    3 October 2026
# Owns:    the authoritative FE–BE contract for the pickup → hub receiving → itemization thread
# Governed by: PROJECT_MASTER_SPECIFICATION.md §39.1, §42; contracts/* for every referenced code
#
# The contract is extended one slice at a time. A slice's operations are added when that
# slice reaches READY — not in anticipation of it.

openapi: 3.1.0

info:
  title: Melarc Platform API
  version: 5.75.0-identity-reads-and-lockout
  summary: Pickup request through hub itemization.
  description: |
    Authoritative FE–BE contract per §39.1. Neither frontend nor backend may independently
    change operations, payloads, enums, errors or contract-visible behaviour (§42.1).

    **Four contract-wide rules, each traceable to an approved section.**

    1. *The backend is authoritative.* Never trust the frontend for totals, prices, OTP
       assertions, payment success, ownership, hub assignment or status transitions (§37.1).

    2. *Hidden server values are never echoed back.* §42.3: the frontend "must not be required
       to repeat hidden server values such as the blind declared count, authoritative price,
       ownership identifier, or permission decision." Where a schema omits such a field, the
       omission is the contract.

    3. *Every mutation is optimistically concurrent.* Clients send `If-Match` with the ETag from
       their last read. A mismatch returns 409 `STATE_CONFLICT` — deterministic rejection, never
       last-write-wins (§36.1). State preconditions are enforced server-side in addition.
       **For the identity domain, every record a mutation targets has a read that returns that
       ETag** (Gate PD-3R1): the record's own `get` sets the `ETag` header, and each of those
       operations' descriptions names the read it takes its `If-Match` from. **Elsewhere the read is
       owed**: the other operations that require `If-Match` have no read that sets an ETag yet, and
       the slice that builds each adds it (`IMPLEMENTATION_PLAN.md` 4c). The failed-attempt count a
       lockout keeps on a credential is not part of any version, so a failed sign-in never
       invalidates an approver's ETag.

    4. *Every rider command is idempotent.* `Idempotency-Key` is required — not because every
       command works offline, but because a command sent over a flaky mobile connection needs
       replay safety either way. A replay of the same payload returns the original result; the
       same key with a different payload returns 409 `IDEMPOTENCY_KEY_CONFLICT` (§35.3.9, §36.1).

       **Offline capability is narrower.** §19.8 approves offline behaviour for hub-handover
       queuing only, and `MSC-DEC-415` makes that Version 1's whole offline scope: delivery
       failure, payment recording, OTP verification, hub return, return handover, collection,
       arrival and every other rider command are **online-only**, and the wider offline design
       is formally deferred (§50.4). The design of the one queued command is written at
       surfaces/rider-android.md 4.1 (`MSC-DEC-419`, closing `OQ-027`).
       *Superseded:* the first five listed as undecided under `OQ-027`.

    Error codes are defined in `contracts/errors-and-enums.md` and are not restated here.
    Enums are defined in `contracts/state-machines.md` and `contracts/domain-model.md`.
  contact:
    name: Melarc Platform — Backend Engineer

# The DEFAULT server is RELATIVE, and that is a security property rather than a convenience.
# Ops and Vendor are browser surfaces authenticated by HOST-ONLY cookies, so
# they must call the API through their own origin - https://ops.<domain>/api/v1/... and
# https://vendor.<domain>/api/v1/... - reverse-proxied to the backend. Cross-origin, the
# SameSite=Lax session cookie is not attached at all, and the change that presents itself as
# the fix is a parent-domain cookie that would merge the two surfaces' cookie jars.
# C1: the root list carries the same-origin server and NOTHING ELSE.
#
# MSC-DEC-293 already said the dedicated host was "non-browser consumers only" and said it in
# a DESCRIPTION. A generated client reads `servers`, not prose: with two entries at the root,
# every operation in the contract advertised both, and which one applied to a cookie-
# authenticated Ops call was a question the machine-readable part of the document could not
# answer. The invariant - a browser Session operation never needs a cross-origin api.* call -
# is now structural rather than asserted, because the cross-origin host is not in scope at the
# root at all.
#
# The dedicated host survives where it is genuinely used, declared per operation on the seven
# Rider native operations (OpenAPI 3 operation-level `servers` overrides this list).
servers:
  - url: /api/v1
    description: |
      **Default, and the only root server.** Relative, so Ops and Vendor resolve it against
      their own origin and their host-only cookies are sent. Every operation inherits it
      unless it declares its own `servers` block.
      Path-versioned: a breaking change increments the path segment (§42.4).

tags:
  - name: delivery-commitments
    description: |
      The five delivery-date truths and the commitment history. Append-only.
  - name: road-expenses
    description: |
      Operational expenses incurred on the road, and their effect on rider cash.
  - name: payments
    description: |
      Customer-payment reconciliation, cash custody, hub reconciliation and final disposition.
  - name: accounting-exports
    description: |
      Canonical extracts of payment facts for a closed period, and the short-lived
      authorization that retrieves one. An export creates no accounting entry
      and moves no money: Melarc runs no ledger, and these operations carry source facts to
      a system that does.
  - name: reason-definitions
    description: |
      The configurable operational reason catalogue.
  - name: vendors
    description: |
      Vendor operational eligibility - a derived projection, never a source of truth.
  - name: reports
    description: |
      Read-only projections over already-approved operational and financial records. Creates
      no accounting entry - the future Accounting, Finance & Reporting domain is OQ-005.
  - name: returns
    description: |
      Return-to-vendor, Sec28.1-28.4 only (SLICE-006 Pass 1). Damage, loss, claims and the
      remaining exceptions (Sec28.5-28.6) are OQ-004/OQ-042/OQ-084's, not built here.
  - name: auth
    description: Sign-in, session, device and credential recovery.
  - name: handshake
    description: The two-party collection handshake and its fallback ladder.
  - name: dispatch
    description: Recipient confirmation and delivery dispatch.
  - name: delivery-runs
    description: Delivery run assembly and execution.
  - name: pickup-requests
  - name: pickup-manifests
  - name: pickup-stops
  - name: hub-intakes
    description: |
      Blind count is enforced structurally. `GET /hub-intakes/{id}` returns
      `HubIntakePreCount` — which has no `rider_declared_count` property — until the physical
      count is committed. §35.5.2 forbids the system to "reveal or require the frontend to
      submit" that value beforehand, so neither the read nor the write schema carries it.
  - name: orders
  - name: staff-identities
    description: |
      Staff identity creation, approval and permission-bundle administration (30.8, 30.3).
      **Nothing here existed before 24 August** - CONFLICT-035: the product could not have
      its first user, because no key created a staff record and none granted a bundle.
  - name: delivery-stops
    description: |
      The doorstep. Arrival, payment, OTP, the successful close and the failed attempt.
      **Ops has no write path here** - 25.1 gives no ordinary override, and the one extraordinary
      path is Senior Ops authorising handover without OTP, recorded as an enhanced audit event.
  - name: couriers
    description: |
      The approved courier/station register, the approved-agent register, and the outcomes Ops
      records against a covered-mode third party's delivery (24.7, MSC-DEC-417).
  - name: cash-handovers
    description: |
      Rider-declared and hub-confirmed cash totals (26.3). **The rider never confirms** - one actor
      supplying both figures is not a comparison.
  - name: evidence
    description: |
      Controlled evidence objects (34.7) - photos, signatures, receipts and proof.
      **Evidence holds no permission domain of its own**: 11.6's closed list omits it, and its
      authorization is that of the act it attaches to. See createEvidence.

# Global default: an authenticated session over either approved transport.
# Principal type, permission, ownership and hub scope remain SERVER-SIDE authorization gates -
# transport says only that a session exists.
#
# Every deliberately pre-authentication operation overrides this with `security: []`.
# x-permission: none does NOT mean anonymous: authentication and authorization are separate axes,
# and relying on the permission axis to express anonymity is the defect Gate A closed.
# The three cookies this API sets. `x-set-cookies` on a response names members of this map,
# which is what makes the declaration checkable rather than prose.
# Every cookie below is HOST-ONLY: no Domain attribute is set, so it is returned only to the
# exact host that issued it. ops.<melarc-domain> and vendor.<melarc-domain> are
# therefore separate cookie jars, and each browser surface calls the API on a same-origin
# /api path. This was true of the intended deployment and was stated in no document: a
# parent-domain cookie would hand the Ops Portal's session to the Vendor PWA's origin and
# back, leaving 37.3's three-authentication-models rule to application code alone. It is
# also what makes SameSite=Lax the right attribute rather than a broken one - cross-origin,
# Lax suppresses the cookie on exactly the requests the attribute exists to describe.
x-cookies:
  melarc_session:
    purpose: Opaque browser Session credential
    attributes: HttpOnly; Secure; SameSite=Lax; Path=/
    host_only: true
    read_by_javascript: false
  melarc_csrf:
    purpose: CSRF synchronizer token
    attributes: Secure; SameSite=Lax; Path=/
    host_only: true
    read_by_javascript: true
  melarc_vendor_device:
    purpose: Vendor registered-browser device credential
    attributes: HttpOnly; Secure; SameSite=Lax; Path=/
    host_only: true
    read_by_javascript: false

# Default: a browser Session AND its CSRF token, OR a Rider Bearer Session.
# Safe reads override this with the non-CSRF alternative; pre-authentication operations
# override it with `security: []`. The default is the STRICTER one on purpose: an operation
# added without thought inherits the control rather than escaping it.
security:
  - browserSession: []
    csrfToken: []
  - riderSession: []

paths:
  /pickup-requests:
    post:
      operationId: createPickupRequest
      x-permission: pickup.request.create
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      x-error-codes: [CORRIDOR_DAY_NOT_PERMITTED, CSRF_VALIDATION_FAILED, PERMISSION_DENIED, PICKUP_MINIMUM_NOT_MET, SENDER_SUSPENDED, SERVICE_DATE_NOT_PERMITTED, SESSION_INVALID, VALIDATION_FAILED, VALUE_DECLARATION_REQUIRED, ZONE_NOT_SERVICED_ON_DATE]
      tags: [pickup-requests]
      summary: Create a pickup request
      description: |
        Permission `pickup.request.create`. A vendor account may create only for itself
        (§37.3). Creates in `PENDING`; carries payer **intent** only — no *authoritative* price
        exists at this point (§5.2.1). The response carries an **indicative estimate**;
        the request entity itself stores no monetary amount.

        **Idempotency-Key added 23 August.** `createPickupManifest` and `createDeliveryRun` both
        carried one; this - the highest-volume vendor-facing write in the product, submitted from
        a phone on Ghanaian mobile data - did not. A timeout retry created a second booking.

        **`pickup_intent` is the discriminator and it decides what is required**.
        There is no single universal pickup form.

        - **`OWN_PACKAGES`** — a known Vendor sending its own parcels. Requires
          `vendor_organization_id`; reuses the saved pickup location and business goods
          profile, and asks only what changes today. A `collection_point` or
          `collection_item` here is mis-declared and REJECTED.
        - **`COLLECT_FOR_VENDOR`** — collecting from a THIRD PARTY for a registered Vendor.
          Requires `collection_point`, `collection_reference` and `collection_item`, plus a
          destination: `destination_location_id`, or `use_vendor_default_destination` to
          resolve the Vendor's default saved location. A collection with nowhere to take it
          is not an executable instruction. **It is not merchandise COD** — no rider is
          authorised to pay the seller.
        - **`ADHOC_SENDER`** — a walk-in sender. EXACTLY ONE of `ad_hoc_sender_id` (a return
          visit, found by verified phone) or `new_ad_hoc_sender` (first use). Requiring an id
          made first-time senders unexecutable; permitting both made identity ambiguous.
          `current_item_description` is REQUIRED: the identity is reusable, the goods are not.
          The sender is never auto-promoted to a registered Vendor.

        **Every intent resolves `resolved_pickup_location`**, which is what dispatch and the
        rider read. All three are creatable by Ops from WhatsApp intake.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PickupRequestCreate' }
      responses:
        '201':
          description: Created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      operationId: listPickupRequests
      # SAFE READ. No CSRF: a synchronizer token defends state change, and a read
      # changes none. Requiring it here would train clients to send it everywhere.
      security:
        - browserSession: []
        - riderSession: []
      x-permission: pickup.read
      x-error-codes: [PERMISSION_DENIED, SESSION_INVALID]
      tags: [pickup-requests]
      summary: List pickup requests
      description: |
        Scoped server-side to the actor's vendor ownership and hub (§37.6). Filters are
        authorization-checked, never trusted (§42.4).
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: service_date, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_page_token]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PickupRequest' }
                  next_page_token: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /pickup-requests/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      operationId: getPickupRequest
      # SAFE READ. No CSRF: a synchronizer token defends state change, and a read
      # changes none. Requiring it here would train clients to send it everywhere.
      security:
        - browserSession: []
        - riderSession: []
      x-permission: pickup.read
      x-error-codes: [HUB_SCOPE_VIOLATION, NOT_FOUND, PERMISSION_DENIED, SESSION_INVALID]
      tags: [pickup-requests]
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /pickup-requests/{id}/confirm:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: confirmPickupRequest
      x-permission: pickup.request.confirm
      x-error-codes: [CSRF_VALIDATION_FAILED, PERMISSION_DENIED, PICKUP_ATTEMPT_LIMIT_REACHED, PICKUP_MINIMUM_NOT_MET, SENDER_SUSPENDED, SERVICE_DATE_NOT_PERMITTED, SESSION_INVALID, STATE_CONFLICT, ZONE_NOT_SERVICED_ON_DATE]
      tags: [pickup-requests]
      summary: Confirm a pickup request
      description: |
        Permission `pickup.request.confirm`. Guards, each returning its own code:
        `PICKUP_MINIMUM_NOT_MET`, `EXCEPTION_NOT_AVAILABLE_TO_SELF_SERVICE`,
        `SERVICE_DATE_NOT_PERMITTED`, `ZONE_NOT_SERVICED_ON_DATE`, `BOOKING_CUTOFF_PASSED`,
        `SENDER_SUSPENDED`, `PICKUP_ATTEMPT_LIMIT_REACHED`.

        Returns an INDICATIVE estimate — base fee × package count, assuming SMALL and in-area
        doorstep (MSC-DEC-211, superseding MSC-DEC-175). Creates no credit reservation and no
        charge (§5.2.1). The estimate is not a quote and the surface must present it as provisional.
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200':
          description: Confirmed
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /pickup-requests/{id}/cancel:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: cancelPickupRequest
      x-permission: pickup.request.cancel
      x-error-codes: [CSRF_VALIDATION_FAILED, IDEMPOTENCY_KEY_CONFLICT, NOT_FOUND, PERMISSION_DENIED, REASON_REQUIRED, REPLACEMENT_REQUIRED, SESSION_INVALID, SOURCE_STILL_ACTIVE, STATE_CONFLICT]
      tags: [pickup-requests]
      description: |
        **In V1 a vendor may cancel only its own `PENDING` request**. Vendor
        self-cancellation of a *confirmed* request is deferred — not deleted — so a vendor
        calling this on a `CONFIRMED` request receives `PERMISSION_DENIED`.

        The request never becomes uncancellable. Office cancellation remains available at every
        point; after rider assignment it carries a **discretionary** charge. A
        client presenting any refusal here as a dead end misrepresents the policy.

        **A missing charge setting does not block the cancellation.** An unset amount
        yields `cancellation_charge_outcome: UNAVAILABLE` and the cancellation proceeds. An
        operational decision is never held hostage to missing commercial configuration.

        *Deferred guard, retained for re-enablement:* self-cancellation ends at rider assignment,
        read cross-record via `PickupManifest.assigned_rider_id`.

        A reschedule must create its replacement in the same command, or `REPLACEMENT_REQUIRED`;
        the source and replacement may never both be active (`SOURCE_STILL_ACTIVE`, §35.4.4).

        **Idempotency-Key added — CRIT-05 audit remediation.** `create_replacement: true` mints a
        new `PickupRequest`, and `apply_charge: true` records a discretionary charge — a repeated
        submission over a flaky Ops connection is exactly `createPickupManifest`'s risk of two
        priced records for one logical act, not a state a guard alone catches cleanly once the
        source has already left its prior state.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason_code]
              properties:
                reason_code:
                  type: string
                  description: |
                    A reason's own metadata may make a note, photo or contact attempt mandatory
                    (§35.9.2). Omitting a field the reason requires returns `REASON_REQUIRED`.
                note: { type: string }
                create_replacement: { type: boolean, default: false }
                apply_charge:
                  type: boolean
                  description: |
                    **Discretionary**. Requires `pickup.request.cancel_chargeable`
                    and a rider already assigned; a vendor may never set it.

                    **A request is ignored where the selected reason's `attribution` is
                    `MELARC`**. The server records
                    `cancellation_charge_outcome: EXEMPT` and the cancellation proceeds - it is
                    never refused, for the same reason a missing amount does not refuse it.
                    Billing a vendor for Melarc's own operational failure is the error
                    `scheduleRedelivery` already prevents by deriving `chargeable` from the same
                    attribution field. `CUSTOMER` and `EXTERNAL` attribution leave this field
                    exactly as discretionary as MSC-DEC-197 made it.

                    Required on a post-assignment cancellation — but either value is valid. The
                    requirement is that Ops makes an explicit decision, not that the charge
                    applies. There is no default, because a default would let the decision go
                    unmade.
                charge_reason_code:
                  type: string
                  description: |
                    **Mandatory on any post-assignment cancellation**, whichever way
                    `apply_charge` went. Recording why no charge applied matters as much as
                    recording why one did.
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: |
            `SELF_CANCEL_NOT_PERMITTED_AFTER_ASSIGNMENT` for a vendor after assignment, or
            `PERMISSION_DENIED` for a chargeable cancellation without the permission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /pickup-requests/{id}/reassign-hub:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: reassignPickupRequestHub
      x-permission: pickup.request.reassign_hub
      x-error-codes: [CSRF_VALIDATION_FAILED, HUB_SCOPE_VIOLATION, IDEMPOTENCY_KEY_CONFLICT, PERMISSION_DENIED, SESSION_INVALID, STATE_CONFLICT, VALIDATION_FAILED]
      tags: [pickup-requests]
      summary: Move a pickup request to another hub, before custody
      description: |
        **The only way `responsible_hub_id` ever changes**. A generic PATCH of that
        field is forbidden: security scope is server-derived, and a client-editable scope column is
        a client-editable authorization boundary.

        **34.9 has permitted this since the baseline** - reassignment "only before custody begins" -
        and no permission, operation or command carried it, so Gate B R0 read the field as
        universally immutable. That forbade approved behaviour, and the available workarounds were
        cancel-and-recreate, which breaks the 5.7 attempt chain, or a direct database edit no policy
        or audit event sees.

        **The actor must be authorized for BOTH hubs.** Source-hub authority alone is not enough:
        moving work into a hub you cannot see exports it beyond your own authority.
        `HUB_SCOPE_VIOLATION` otherwise. Explicit all-hub authority satisfies this only where the
        Session actually grants it.

        **Cutoff.** Permitted only before rider pickup or custody begins - `STATE_CONFLICT`
        afterwards. Where the request is already planned into a manifest, reassignment stays
        possible only before that run starts, and the old stop and planning assignments are revoked
        atomically and rebuilt under the target hub. **No old planning artifact may keep conferring
        the former scope** - a manifest still pointing at the request is itself scope-conferring, so
        leaving one behind lets the previous hub's staff and rider keep reaching it.

        **Inter-hub transfer after custody is never simulated by editing this field**, and
        historical custody records never move.

        Enhanced-audited as `pickup.request.hub_reassigned`, carrying previous hub, new hub, actor,
        correlation id and every planning artifact revoked or rebuilt.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PickupRequestHubReassignment' }
      responses:
        '200':
          description: Reassigned. Planning under the previous hub has been revoked
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /pickup-requests/{id}/escalate:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: escalatePickupRequest
      x-permission: pickup.failure.resolve
      x-error-codes: [CSRF_VALIDATION_FAILED, IDEMPOTENCY_KEY_CONFLICT, PERMISSION_DENIED, REASON_REQUIRED, SESSION_INVALID, STATE_CONFLICT]
      tags: [pickup-requests]
      summary: Escalate a failed request out of the Ops decision context
      description: |
        `pickup.failure.resolve` - Ops, Senior Ops, Platform Admin at own hub.

        21.6 gives Ops three resolutions for a failed stop: reschedule, cancel, or **escalate**.
        The first two are `cancelPickupRequest` with and without `create_replacement`. This is
        the third, and it had no operation until 23 August - which made **AC-SLICE-001-33** and
        **AC-SLICE-001-34** unexecutable against the contract.

        **Two paths reach here and cannot leave any other way.** A `REFUSED_COLLECTION` failure
        is escalation-only (21.6): an ordinary reschedule is refused, and only hub Senior Ops
        force-extension (`extendPickupAttempts`) opens one. A request that has exhausted
        `MELARC_MAX_PICKUP_ATTEMPTS` is in the same position.

        **The scheduled backstop calls this same transition** after
        `stale_failure_backstop_hours`, recording `trigger: BACKSTOP` rather than an actor. A
        queue nobody works is a queue that hides parcels, so the escalation must be reachable
        both ways and distinguishable afterwards.

        **Enhanced-audited as `pickup.request.escalated`** — CRIT-09 audit remediation; this
        operation existed with no event at all until now.

        **Idempotency-Key added — CRIT-05 audit remediation**, alongside CRIT-09's new
        `pickup.request.escalated` audit event: a State guard alone stops a second escalation
        from landing, but not a second audit row from a client that never saw the first response.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PickupEscalation' }
      responses:
        '200':
          description: Escalated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /pickup-requests/{id}/attempt-extension:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: extendPickupAttempts
      x-permission: pickup.attempt.extend
      x-error-codes: [CSRF_VALIDATION_FAILED, IDEMPOTENCY_KEY_CONFLICT, INSUFFICIENT_AUTHORITY, PERMISSION_DENIED, REASON_REQUIRED, SESSION_INVALID]
      tags: [pickup-requests]
      summary: Force-extend the pickup attempt cap
      description: |
        `pickup.attempt.extend` - **hub Senior Ops and Platform Admin only**, own hub
        (21.6, MSC-DEC-116). Not Ops Staff.

        Raises the ceiling for **this request alone** past `MELARC_MAX_PICKUP_ATTEMPTS`. It does
        not change the setting, and it is the only route by which a `REFUSED_COLLECTION` or an
        exhausted chain becomes reschedulable again.

        **`reason` is required by the schema rather than by review.** 21.6, MSC-DEC-116 makes the
        reason mandatory and the audit immutable; a force-extension whose reason could be omitted
        is an attempt cap that quietly is not one.

        **Idempotency-Key added — CRIT-05 audit remediation.** The extension is a ceiling raised
        for this request; nothing in this contract states it is measured rather than accumulated,
        and a Senior Ops officer retrying an unclear submission must not risk raising it twice.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttemptExtension' }
      responses:
        '200':
          description: Ceiling extended for this request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /pickup-requests/{id}/cancellation-charge/waiver:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: waiveCancellationCharge
      x-permission: pickup.cancellation_charge.waive
      x-error-codes: [CSRF_VALIDATION_FAILED, INSUFFICIENT_AUTHORITY, NO_CHARGE_APPLIED, PERMISSION_DENIED, REASON_REQUIRED, SESSION_INVALID]
      tags: [pickup-requests]
      summary: Waive an applied cancellation charge
      description: |
        `pickup.cancellation_charge.waive` - **Senior Ops floor**, own hub.

        The charge is applied at Ops discretion by `cancelPickupRequest`; **relieving it is a
        higher authority than applying it**, which is the whole shape of MSC-DEC-197: charged by
        default, relieved by judgement, and the waiver frequency visible in the audit trail. A
        rule with no relief valve gets ignored in practice; a relief valve with no record gets
        used until it is the rule.

        Refused with `NO_CHARGE_APPLIED` where the cancellation recorded
        `cancellation_charge_outcome: UNAVAILABLE`, `NOT_APPLIED` or `EXEMPT` - there is nothing to waive,
        and a waiver recorded against no charge would corrupt the very frequency data that makes
        this control work.
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancellationChargeWaiver' }
      responses:
        '200':
          description: Charge waived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /pickup-requests/{id}/one-package-exception:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: requestOnePackageException
      x-permission: pickup.exception.request
      x-error-codes: [CSRF_VALIDATION_FAILED, PERMISSION_DENIED, SESSION_INVALID, VALIDATION_FAILED]
      tags: [pickup-requests]
      description: |
        Maker side. Permission `pickup.exception.request` — **Ops only**. A vendor account
        attempting this receives `EXCEPTION_NOT_AVAILABLE_TO_SELF_SERVICE` (§35.2.4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason_code]
              properties:
                reason_code: { type: string }
                note: { type: string }
      responses:
        '201':
          description: Exception requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /pickup-requests/{id}/one-package-exception/approve:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: approveOnePackageException
      x-permission: pickup.exception.approve
      x-error-codes: [CSRF_VALIDATION_FAILED, INSUFFICIENT_AUTHORITY, PERMISSION_DENIED, SELF_APPROVAL_FORBIDDEN, SESSION_INVALID]
      tags: [pickup-requests]
      description: |
        Checker side. Permission `pickup.exception.approve` — held by **Senior Ops, Platform
        Admin, or an Ops Staff member explicitly granted it**. **The permission is
        authoritative, not the role**: a hub-floor judgement routed to the busiest authority
        in the product stops being asked for.

        *Superseded reading:* §11.4 row 3 placed this with Platform Admin **only**, and Gate C
        widened it.

        The approver may not be the requester, or `SELF_APPROVAL_FORBIDDEN` (§37.4,
        MSC-DEC-135).

        **The approved GH20 single-package fee becomes due on acceptance**, and
        settlement follows the Vendor's eligibility: posted to statement for an
        allowance-enabled unrestricted Vendor, settled before pickup proceeds where
        VendorOperationalEligibility.requires_prepayment.
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /pickup-stops/{id}/arrive:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: arriveAtPickupStop
      # C1. Rider native operation: reachable through the
      # dedicated non-browser host as well as same-origin. Same-origin stays FIRST so a
      # generated browser client keeps the default the root list guarantees.
      servers:
        - url: /api/v1
          description: Same-origin. The default for any browser-delivered surface.
        - url: https://api.melarc.example/v1
          description: >-
            Dedicated non-browser host for the Rider native client. Bearer-authenticated,
            never cookie-authenticated - a browser would not attach the host-only session
            cookie here, which is why this host is safe for the native app and unsafe for
            Ops or Vendor.
      x-permission: pickup.run.execute
      x-error-codes: [CSRF_VALIDATION_FAILED, IDEMPOTENCY_KEY_CONFLICT, MANIFEST_NOT_STARTED, NOT_ASSIGNED_RIDER, PERMISSION_DENIED, SESSION_INVALID, STATE_CONFLICT]
      tags: [pickup-stops]
      summary: Mark arrival at a pickup stop
      description: |
        `pickup.run.execute` - the assigned rider only. PENDING to ARRIVED (5), guarded on the
        manifest being IN_PROGRESS (`MANIFEST_NOT_STARTED`).

        **Arrival is a command, not a screen event.** 36.1: a record must not change state
        because a screen changed. The delivery side has had `arriveAtDeliveryStop` since
        26 August; this side was recorded as CONFLICT-038 and had no operation behind it
        until MSC-DEC-392.

        **The cancellation window closes here**. That is the whole
        reason this cannot be a screen event: a commercial consequence - the vendor's
        self-service cancellation ending - hangs on this transition, and a state a client can
        assert is a charge a client can trigger.

        Idempotent - for connection resilience, not offline capability (rule 4): arrival
        requires a connection in Version 1, and a retried arrival must not close
        the window twice. *Superseded:* "this is an offline command (35.3.9), the same as
        `recordCollection`".
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200':
          description: Stop ARRIVED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupStop' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /pickup-stops/{id}/collect:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: recordCollection
      x-permission: pickup.collection.confirm
      x-error-codes: [CSRF_VALIDATION_FAILED, HANDSHAKE_NOT_VERIFIED, IDEMPOTENCY_KEY_CONFLICT, MANIFEST_NOT_STARTED, NOT_ASSIGNED_RIDER, SESSION_INVALID, STATE_CONFLICT, ZERO_COLLECTION_IS_FAILURE]
      tags: [pickup-stops]
      summary: Record the physical collection result
      description: |
        Rider only, assigned stop only (`NOT_ASSIGNED_RIDER`). Idempotent — for connection
        resilience, not offline capability (rule 4): **collection requires a connection in
        Version 1**. *Superseded:* "this is an offline command (§35.3.9)".

        `collected_count` of zero is a **failed pickup** and may not accompany a collected stop:
        `ZERO_COLLECTION_IS_FAILURE` (§36.4).

        **Partial collection is permitted**. A short count requires
        `variance_reason_code`, or `REASON_REQUIRED`. A short collection also raises the office
        notification at the time of the shortfall — it supplements the rider's phone call and
        does not replace it.

        **The hub blind count still runs independently.** `collected_count` never seeds
        `HubIntake.rider_declared_count`. They are two checks, and a package lost between the
        door and the hub is visible only in the second (MSC-DEC-194 part 3).
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectionRecordCreate' }
      responses:
        '200':
          description: Collection recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionRecord' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /pickup-stops/{id}/fail:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: reportPickupFailure
      x-permission: pickup.failure.report
      x-error-codes: [CSRF_VALIDATION_FAILED, IDEMPOTENCY_KEY_CONFLICT, MANIFEST_NOT_STARTED, NOT_ASSIGNED_RIDER, REASON_REQUIRED, SESSION_INVALID, VALIDATION_FAILED]
      tags: [pickup-stops]
      description: |
        Rider only, owned dispatched stop. Requires a categorized reason **and whatever that
        reason's metadata makes mandatory** — note, photo, or contact attempt (§35.4.1, §35.9.2).
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason_code]
              properties:
                reason_code: { type: string }
                note: { type: string }
                evidence_ids:
                  type: array
                  items: { type: string, format: uuid }
                  description: |
                    Each id must name an evidence record in `STORED`. A `PENDING_UPLOAD` record is
                    rejected with `EVIDENCE_NOT_STORED` - otherwise "attached evidence" is satisfiable
                    by a declaration with no bytes behind it.
                contact_attempts:
                  type: array
                  items: { $ref: '#/components/schemas/ContactAttempt' }
      responses:
        '200':
          description: Failure recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupStop' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  # THE SIGNED TRANSITION NOTHING COULD PERFORM (MSC-DEC-412, closing OQ-141). state-machines.md
  # 5's PENDING/ARRIVED to SKIPPED row has named OPS with a mandatory reason since 17 August 2026,
  # and no operation performed it - so 4's IN_PROGRESS to COMPLETED guard, "every stop in a
  # terminal state", could not be satisfied on a run with one unresolvable stop. That defeated
  # MSC-DEC-246's custody record exactly where it was written to help: after a RunCustodyHandover
  # the receiver holds completion authority and submitHubHandover refuses with STOPS_UNRESOLVED.
  /pickup-stops/{id}/skip:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: skipPickupStop
      x-permission: pickup.stop.skip
      x-error-codes: [CSRF_VALIDATION_FAILED, IDEMPOTENCY_KEY_CONFLICT, NOT_FOUND, PERMISSION_DENIED, REASON_NOT_ACTIVE, REASON_REQUIRED, SESSION_INVALID, STATE_CONFLICT]
      tags: [pickup-stops]
      summary: Ops authorises a skip, and the run can close
      description: |
        `pickup.stop.skip` - **Ops Staff, Senior Ops or Platform Admin at own hub**.
        **Not the rider**: no rider bundle holds this key, and a rider who could skip a stop could
        choose which customers to serve.

        **This performs state-machines.md 5's SIGNED `PENDING/ARRIVED` to `SKIPPED` row**, which
        named Ops with a mandatory reason and had no operation behind it. STATE_CONFLICT refuses a
        stop already in a terminal state.

        **The reason is a PICKUP_STOP_SKIP catalogue code** (domain-model.md 3.9) - RUN_CUT_SHORT,
        VENDOR_REQUESTED_SKIP, LOCATION_INACCESSIBLE or STOP_RAISED_IN_ERROR, and an approved
        operational reason may be added without a contract change. REASON_REQUIRED without one;
        REASON_NOT_ACTIVE for an inactive or wrong-domain code. **A note is mandatory where the
        reason's metadata says so** - LOCATION_INACCESSIBLE and STOP_RAISED_IN_ERROR both do.

        **THE VENDOR IS NOTIFIED, ALWAYS** (MSC-DEC-412, on MSC-DEC-348's field set): the vendor,
        the pickup request, the reason and the requested vendor action where anything would unblock
        it. A vendor whose parcels were not collected today is the party who can act.

        **NO ATTEMPT IS CONSUMED.** The PickupRequest attempt chain is untouched and
        MELARC_MAX_PICKUP_ATTEMPTS is not approached: a skip is Melarc's operational decision, not
        a failed collection. **The request keeps the state it had** - Ops reschedule with 3's
        CONFIRMED to CANCELLED (replacement), which increments attempt_number, or cancel outright.
        Nothing is created automatically, because three of the four reasons reschedule and
        STOP_RAISED_IN_ERROR must not re-raise the stop it removed.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason_code]
              additionalProperties: false
              properties:
                reason_code:
                  type: string
                  description: >-
                    An ACTIVE PICKUP_STOP_SKIP code. A DELIVERY_FAILURE, RECIPIENT_CONTACT or
                    21.5 pickup-failure code is refused with REASON_NOT_ACTIVE - a skip is not a
                    failure, and 5 gives them separate rows with different effects.
                note:
                  type: string
                  description: >-
                    Mandatory where the reason's requires_note is true (35.9.2).
      responses:
        '200':
          description: Stop is SKIPPED. The run may now reach COMPLETED if no other stop is open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupStop' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  /hub-intakes:
    get:
      operationId: listHubIntakes
      # SAFE READ. No CSRF: a synchronizer token defends state change, and a read
      # changes none. Requiring it here would train clients to send it everywhere.
      security:
        - browserSession: []
        - riderSession: []
      x-permission: hub.read
      x-error-codes: [PERMISSION_DENIED, SESSION_INVALID]
      tags: [hub-intakes]
      summary: List intakes at the acting hub - the awaiting-receive queue
      description: |
        Permission `hub.read`, **hub-scoped**. Filtered to `state=AWAITING_COUNT` this is the
        awaiting-receive queue §22.3 describes: each intake's handover, run and rider, its
        submission timing, and whether another user is actively receiving.

        **Pre-count items are `HubIntakePreCount`**, so no rider declaration - not even a zero
        one - is served before the blind count commits (§22.3, §35.5.2). A queue that flagged
        zero declarations would reveal the declared count by another route.

        **Added at MSC-DEC-416.** The queue had a route in ops-portal.md and a step in
        hub-intake.md, and no operation behind either.
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [AWAITING_COUNT, COUNTED, RECONCILIATION_REQUIRED, READY_FOR_ITEMIZATION, ITEMIZING, CLOSED]
          description: Narrow to one intake state. AWAITING_COUNT is the awaiting-receive queue.
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: Intakes
          content:
            application/json:
              schema:
                type: object
                required: [items, next_page_token]
                properties:
                  items:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/HubIntakePreCount'
                        - $ref: '#/components/schemas/HubIntakePostCount'
                      discriminator:
                        propertyName: count_phase
                  next_page_token: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /hub-intakes/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      operationId: getHubIntake
      # SAFE READ. No CSRF: a synchronizer token defends state change, and a read
      # changes none. Requiring it here would train clients to send it everywhere.
      security:
        - browserSession: []
        - riderSession: []
      x-permission: hub.read
      x-error-codes: [HUB_SCOPE_VIOLATION, PERMISSION_DENIED, SESSION_INVALID]
      tags: [hub-intakes]
      summary: Read an intake
      description: |
        **The blind-count guard lives here, on the read path.**

        Before the physical count is committed this returns `HubIntakePreCount`, whose schema
        has no `rider_declared_count` property at all. §35.5.2 forbids the system to reveal it,
        and §43.2 states the criterion: the declared count "is not returned in the editable/view
        model used before submission." An implementation that returns the field and relies on
        the frontend to hide it violates the contract, not merely the UI guidance.

        After commitment, `HubIntakePostCount` carries the declared count, the physical count
        and the comparison.
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HubIntakePreCount'
                  - $ref: '#/components/schemas/HubIntakePostCount'
                discriminator:
                  propertyName: count_phase
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /hub-intakes/{id}/lock:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: acquireIntakeLock
      x-permission: hub.intake.count
      x-error-codes: [CSRF_VALIDATION_FAILED, HUB_SCOPE_VIOLATION, PERMISSION_DENIED, SESSION_INVALID]
      tags: [hub-intakes]
      summary: Take the advisory receive lock on an intake, or see who holds it
      description: |
        Performs state-machines.md 7's signed *acquire receive lock* row exactly (§22.8). The
        caller takes the lock when no receiver holds it, or when the holder has been idle past
        `intake_lock_idle_ttl_minutes`; otherwise the intake comes back showing who is actively
        receiving, and nothing changes. The holder calling again refreshes `lock_acquired_at`.

        **Advisory, and nothing may treat it otherwise.** §22.8: a visual lock alone is not
        sufficient. `submitBlindCount` keeps its own transition and idempotency guards, and two
        receivers who both submit a count get one success and one STATE_CONFLICT whatever this
        says (AC-SLICE-001-43).

        **Added at MSC-DEC-416.** The row is signed and had no operation behind it - the same
        class as skipPickupStop at MSC-DEC-412.
      responses:
        '200':
          description: The intake, showing the current receiver
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HubIntakePreCount'
                  - $ref: '#/components/schemas/HubIntakePostCount'
                discriminator:
                  propertyName: count_phase
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /hub-intakes/{id}/count:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: submitBlindCount
      x-permission: hub.intake.count
      x-error-codes: [CSRF_VALIDATION_FAILED, IDEMPOTENCY_KEY_CONFLICT, PERMISSION_DENIED, SESSION_INVALID, STATE_CONFLICT, VALIDATION_FAILED]
      tags: [hub-intakes]
      summary: Submit the blind physical count
      description: |
        **The blind-count guard's write half.** The request body carries only the physical
        count. §35.5.2 forbids the system to "require the frontend to submit" the declared
        count, so it is absent from the request schema — a design that accepts it echoed back
        fails for a second, independent reason (§42.3).

        The response reveals the comparison for the first time.

        **Idempotency-Key added — CRIT-05 audit remediation.** `itemizeOrder` below already
        claimed *"`submitBlindCount`, the operation immediately before this one, carried both
        guards from the start"* — true of `If-Match` and false of `Idempotency-Key` until now.
        This closes that gap rather than correcting the claim, since the reasoning was already
        right: a receiving officer on the same flaky hub connection `itemizeOrder` describes
        needs the same replay safety one call earlier.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [physical_count]
              additionalProperties: false
              properties:
                physical_count: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Counted; comparison revealed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubIntakePostCount' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: |
            `BLIND_COUNT_VIOLATED` if the declared count was served or accepted before commit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /hub-intakes/{id}/orders:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: itemizeOrder
      x-permission: hub.intake.itemize
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      x-error-codes: [ACCOUNT_OVERDUE, ALLOWANCE_DISABLED, CARRIER_COST_REQUIRED, COMMITMENT_SOURCE_UNRESOLVED, CREDIT_LIMIT_EXCEEDED, CSRF_VALIDATION_FAILED, MARGIN_NOT_CONFIGURED, ORDER_UNPRICED, PERMISSION_DENIED, SESSION_INVALID, SETTING_MISSING, SIZE_CLASS_REQUIRED, STATE_CONFLICT, VALUE_DECLARATION_REQUIRED]
      tags: [orders]
      summary: Itemize one order from an intake
      description: |
        Permission `hub.intake.itemize`. Creates one `Order` — the single itemized delivery unit.
        

        Destination zone is **server-resolved**; a free-text address alone is not authoritative
        (§35.6.6). The client sends the address and, where applicable, an explicit authorization;
        it never sends the zone.

        Price is calculated server-side from the hub's service-area base fee, corridor off-day fee
        or station-drop fee, plus the size-class surcharge in third-party mode only, plus carrier
        cost and margin where applicable (MSC-DEC-207, 209, 210). The client never sends a price
        (§42.3) — only an observed carrier cost.


        **It also creates the order's initial `DeliveryCommitment`** -
        the side effect R1 defined in the domain model and did not put here.

        **The SLA clock reaches BACKWARDS.** The Order does not exist at pickup: a pickup is a
        batch, and the Order is created here, hours after the custody that started its promise.
        The server reads the successful pickup-custody timestamp from the authoritative lineage -
        CollectionRecord to PickupStop to PickupManifest - and sets `sla_start_at` to THAT earlier
        time. `default_date` derives from the custody date, not from today. The corridor schedule
        applies where the destination has one, and an accepted sender or recipient requested date
        applies over it.

        **Hub arrival and itemization time never reset it.** Starting the clock here would be
        simpler, would look correct, and would quietly award Melarc every hour of its own delay -
        measured from an event the sender cannot observe.

        **The commitment is written atomically with the Order, at `sequence = 1`.** `(order_id,
        sequence)` is unique, so the Idempotency-Key retry above cannot mint a second initial
        commitment. **An Order without its initial commitment is not a state this operation may
        leave behind**: either both exist or neither does.

        **Idempotency-Key and If-Match are both required, and both were absent until 23 August.**
        This operation **creates a money record and freezes a price**. A receiving officer
        retrying over a flaky hub connection would have created **two priced Orders for one
        physical parcel** - a duplicate credit reservation against a GH₵200 global limit, and two
        system parcels where the blind count proved there was one.

        §22.8 does not leave this to judgement: the intake soft lock is **advisory**, and
        *"backend transition and idempotency controls are still required; a visual lock alone is
        not sufficient."* `submitBlindCount`, the operation immediately before this one, carried
        both guards from the start.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderItemize' }
      responses:
        '201':
          description: Order created and priced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: |
            `SETTING_MISSING` when the hub has no approved base fee, or `MARGIN_NOT_CONFIGURED`
            when outside-Accra pricing is attempted with no configured margin. Per §33.4 the
            system does **not** fall back to another hub's rates or a global default; it fails
            visibly.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /hub-intakes/{id}/close:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: closeHubIntake
      x-permission: hub.intake.close
      x-error-codes: [CSRF_VALIDATION_FAILED, IDEMPOTENCY_KEY_CONFLICT, PARITY_NOT_MET, PERMISSION_DENIED, SESSION_INVALID, STATE_CONFLICT]
      tags: [hub-intakes]
      summary: Close an intake
      description: |
        Permission `hub.intake.close`. Parity is required: the itemized order count must
        reconcile to the **authoritative hub-received count**, or `PARITY_NOT_MET`.

        **An order in `PAYMENT_REQUIRED` counts toward parity** (§35.6.11). Parity counts
        physical parcels itemized, not orders cleared for dispatch. An implementation that
        counts dispatch-ready orders will refuse to close correct intakes.

        Closing without parity is possible only through `hub.intake.close_exception`, the sole
        approved exception route (§35.5.5).

        **Idempotency-Key added — CRIT-05 audit remediation**, for consistency with the rest of
        the intake sequence (`submitBlindCount`, `itemizeOrder`) that already carries it over the
        same connection.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubIntakePostCount' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }


  /pickup-manifests:
    post:
      operationId: createPickupManifest
      x-permission: pickup.manifest.create
      x-error-codes: [CSRF_VALIDATION_FAILED, PERMISSION_DENIED, SESSION_INVALID, VALIDATION_FAILED]
      tags: [pickup-manifests]
      summary: Create a manifest from confirmed, unmanifested requests
      description: |
        Permission `pickup.manifest.create`. Ops only.

        A manifest is **not vendor-owned** (domain-model §4). It groups stops across vendors,
        so vendor scoping must not be applied to it — a vendor may see their own stop, never
        the manifest.

        Only `CONFIRMED` requests in the unmanifested pool are eligible. A request already on
        a manifest is rejected with `ALREADY_MANIFESTED`.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
