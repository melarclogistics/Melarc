          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupManifest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/RuleViolation' }
    get:
      operationId: listPickupManifests
      # SAFE READ. No CSRF: a synchronizer token defends state change, and a read
      # changes none. Requiring it here would train clients to send it everywhere.
      security:
        - browserSession: []
        - riderSession: []
      x-permission: pickup.read
      x-error-codes: [PERMISSION_DENIED, SESSION_INVALID]
      tags: [pickup-manifests]
      summary: List manifests for the acting hub
      description: |
        Permission `pickup.read`. **Hub-scoped, never vendor-scoped.**

        **Paginated — CRIT-10 audit remediation.** This was the one list operation in the
