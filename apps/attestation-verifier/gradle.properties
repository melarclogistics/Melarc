# The Gradle JVM is kept small: this is a machine that also runs PostgreSQL, a browser and Node.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Kotlin compiles inside Gradle's own JVM, so that a run without a daemon (scripts/verifier.ts) leaves no compiler daemon behind it.
kotlin.compiler.execution.strategy=in-process
org.gradle.configuration-cache=true
# No build cache, local or remote: nothing a build uses comes from anywhere but its sources and the artifacts whose checksums are pinned
# (and the Kotlin build-cache advisory in gradle/libs.versions.toml is not reachable).
org.gradle.caching=false
kotlin.code.style=official
