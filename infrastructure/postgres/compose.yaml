# The local PostgreSQL service for development and the database tests (B0.4). It is not a production
# definition: production PostgreSQL is a managed service (architecture/DEPLOYMENT_AND_ENVIRONMENTS.md).
#
# The image tag is a provisional engineering choice: no retained specification names a PostgreSQL
# version. Change it here, deliberately, and re-run the database tests (pnpm run test:db).
#
# Create its settings with `pnpm run setup:env`, then start it with `pnpm run infra:up` (DEVELOPMENT.md), which runs:
#   docker compose -f infrastructure/postgres/compose.yaml --env-file infrastructure/postgres/.env up -d --wait
name: melarc-db

services:
  postgres:
    image: postgres:18.6-bookworm
    # A name of its own: "melarc-postgres" is easily taken by another project's database on the same machine.
    container_name: melarc-db
    # Comes back by itself whenever Docker Desktop starts, unless it was stopped on purpose.
    restart: unless-stopped
    environment:
      # The cluster superuser. Only the local provisioning and the database tests use it, never the API.
      POSTGRES_PASSWORD: ${MELARC_PG_ADMIN_PASSWORD:?set it in infrastructure/postgres/.env (see .env.example)}
      # Every connection authenticates with a password. Without this the image's initdb trusts connections
      # from the loopback address, and whether a wrong password is refused would depend on how Docker
      # routes the connection. It only takes effect when the data volume is first created.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    ports:
      # Loopback only: the database is never reachable from the network.
      - '127.0.0.1:${MELARC_PG_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18 and later images keep their data under /var/lib/postgresql/<major>/docker, and the
      # volume belongs at /var/lib/postgresql. Mounting it at .../data would not persist anything.
      - melarc_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  melarc_pgdata:
    name: melarc_pgdata
